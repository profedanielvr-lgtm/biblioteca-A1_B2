name: Preparar archivos descargables B2
on:
  push:
    branches:
      - mejora-b2-informes-docentes-2026-10-29
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generar ZIP único de la edición autónoma
        run: |
          rm -f downloads/La-Biblioteca.zip
          zip -q -j downloads/La-Biblioteca.zip La-Biblioteca.html
      - name: Guardar archivos compilados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html La-Biblioteca.html downloads/La-Biblioteca.zip content/version.js content/catalog.js content/crosswalk.csv
          if ! git diff --cached --quiet; then
            git commit -m "Compilar versión con 400 tarjetas e informes"
            git push origin HEAD:mejora-b2-informes-docentes-2026-10-29
          fi
