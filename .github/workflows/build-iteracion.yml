name: Construir edición descargable de esta propuesta
on:
  push:
    branches:
      - mejora-vocabulario-panel-docente-oct2026
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Actualizar el ZIP descargable
        run: |
          zip -q -j downloads/La-Biblioteca.zip La-Biblioteca.html
      - name: Guardar archivos compilados en la rama de la propuesta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html La-Biblioteca.html content/version.js content/catalog.js content/crosswalk.csv downloads/La-Biblioteca.zip
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar edición autocontenida y ZIP para 320 tarjetas"
            git push origin HEAD:mejora-vocabulario-panel-docente-oct2026
          fi
