name: Construir paradigmas e informe PDF
on:
  push:
    branches:
      - todos-tiempos-informe-pdf-2026-10-29
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --save-dev --save-exact @jirimracek/conjugate-esp@2.3.6 jspdf@4.2.1
      - run: npm run build
      - run: npm test
      - name: Empaquetar edición autónoma
        run: |
          rm -f downloads/La-Biblioteca.zip
          zip -q -j downloads/La-Biblioteca.zip La-Biblioteca.html
      - name: Guardar corpus y edición publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json content/verb-paradigms.js modules/vendor-jspdf.js content/version.js content/catalog.js content/crosswalk.csv index.html La-Biblioteca.html downloads/La-Biblioteca.zip
          if ! git diff --cached --quiet; then
            git commit -m "Compilar paradigmas completos y PDF offline"
            git push origin HEAD:todos-tiempos-informe-pdf-2026-10-29
          fi
