ál/cuáles identifica una opción o un dato: ¿cuál prefieres?, ¿cuál es tu número?","nl":"Qué vraagt naar informatie of soort, quién/quiénes naar personen, dónde naar plaats, cuándo naar tijd, cómo naar manier en por qué naar reden. Cuánto past zich aan vóór een naamwoord: cuántas personas. Cuál/cuáles vraagt naar een keuze of gegeven: ¿cuál prefieres?, ¿cuál es tu número?"},{"es":"Delante de un nombre es frecuente qué: ¿qué libro buscas? Cuál + nombre también se usa en varias zonas de América. Las palabras interrogativas llevan tilde, también en no sé dónde está. Para preguntas de sí o no basta entonación y signos: ¿vienes mañana?","nl":"Vóór een naamwoord is qué gebruikelijk: ¿qué libro buscas? Cuál + naamwoord komt ook in delen van Amerika voor. Vraagwoorden hebben een accent, ook in no sé dónde está. Ja/nee vragen gebruiken intonatie en tekens: ¿vienes mañana?"}],"ex":[{"es":"Vamos a reservar un taller. ¿Cuántas personas vienen y qué materiales necesitan?","nl":"We gaan een workshop boeken. Hoeveel mensen komen en welke materialen hebben ze nodig?"},{"es":"Hay dos horarios. ¿Cuál prefieres? ¿Por qué te viene mejor ese?","nl":"Er zijn twee tijdstippen. Welk heeft je voorkeur? Waarom komt dat beter uit?"}],"refs":["que","nl_preguntas","pcic"],"related":["A01","A02","F65"],"title":{"es":"Preguntas y palabras interrogativas","nl":"Vragen en vraagwoorden"},"goal":{"es":"Pedir la información que falta.","nl":"Ontbrekende informatie vragen."},"error":{"es":"No reduzcas qué/cuál a «abierto/cerrado»: ¿cuál es tu dirección? pide un dato sin mostrar opciones.","nl":"Beperk qué/cuál niet tot «open/gesloten»: ¿cuál es tu dirección? vraagt een gegeven zonder zichtbare opties."},"tip":{"es":"Asocia cada pregunta a la información que debe aparecer en la respuesta.","nl":"Koppel elke vraag aan de informatie die het antwoord moet geven."},"task":{"es":"Entrega dos versiones incompletas de una reserva. Cada persona pregunta por sus datos ausentes y completa la ficha.","nl":"Geef twee onvolledige reserveringen. Ieder vraagt naar de ontbrekende gegevens en vult het formulier aan."},"nl":{"es":"Welke puede corresponder a qué o cuál. «¿Qué es tu profesión?» no es el modelo para preguntar profesión; usa «¿A qué te dedicas?».","nl":"Welke kan qué of cuál zijn. Gebruik voor iemands beroep bijvoorbeeld «¿A qué te dedicas?»."},"check":{"es":"Quieres conocer el motivo de una ausencia. ¿Qué palabra necesitas?","nl":"Je wilt de reden van een afwezigheid weten. Welk vraagwoord past?"},"answer":{"es":"Por qué: «¿Por qué no vienes?». La respuesta puede empezar con porque.","nl":"Por qué: «¿Por qué no vienes?». Het antwoord kan beginnen met porque."},"prereq":["F21"],"exercises":[{"stem":"¿___ personas vienen al taller? (cuánto)","answers":["cuántas"],"why":{"es":"Cuántas concuerda con personas y lleva tilde interrogativa.","nl":"Cuántas past bij personas en krijgt een vraagaccent."},"mode":"word","instruction":null,"id":"F24_1"},{"stem":"¿___ no vienes mañana? Porque tengo otra clase.","answers":["por qué"],"why":{"es":"Por qué pregunta por la causa y se escribe separado con tilde.","nl":"Por qué vraagt naar de reden: twee woorden en een accent."},"mode":"word","instruction":null,"id":"F24_2"}]},{"id":"F25","block":4,"p":[{"es":"¡Qué + adjetivo! expresa una reacción: ¡qué bonito! También usamos ¡qué + nombre!: ¡qué sorpresa! Con un nombre y una descripción: ¡qué día tan bonito! El adjetivo concuerda con lo que describe.","nl":"¡Qué + bijvoeglijk naamwoord! geeft een reactie: ¡qué bonito! Ook mogelijk: ¡qué + naamwoord!, zoals ¡qué sorpresa! Met een beschrijving: ¡qué día tan bonito! Het bijvoeglijk naamwoord past bij wat het beschrijft."},{"es":"Qué lleva tilde y no cambia por género o número: ¡qué casas tan bonitas! En escritura usamos ¡ y !. Una exclamación puede expresar alegría, sorpresa o molestia; la voz y la situación ayudan a interpretarla.","nl":"Qué heeft een accent en verandert niet naar geslacht of getal: ¡qué casas tan bonitas! We schrijven ¡ en !. Een uitroep kan blijdschap, verbazing of irritatie uitdrukken; stem en situatie helpen bij de interpretatie."}],"ex":[{"es":"Entramos en la exposición y vemos el trabajo de la clase. ¡Qué fotos tan interesantes!","nl":"We komen de tentoonstelling binnen en zien het werk van de klas. Wat een interessante foto's!"},{"es":"Se rompe la impresora justo antes del taller. ¡Qué problema! Necesitamos otra solución.","nl":"De printer gaat vlak vóór de workshop kapot. Wat een probleem! We hebben een andere oplossing nodig."}],"refs":["que","pcic","ortografia"],"related":["F08","A02"],"title":{"es":"Exclamaciones con qué","nl":"Uitroepen met qué"},"goal":{"es":"Expresar una reacción breve.","nl":"Kort reageren met een uitroep."},"error":{"es":"Ante «qué un día bonito», ofrece el modelo qué día tan bonito sin artículo indefinido.","nl":"Geef bij «qué un día bonito» het model qué día tan bonito zonder onbepaald lidwoord."},"tip":{"es":"Separa reacción, objeto y descripción para combinar las piezas.","nl":"Scheid reactie, voorwerp en beschrijving om de delen te combineren."},"task":{"es":"Cada persona recibe una noticia cotidiana y responde con una exclamación adecuada. La pareja explica qué emoción entiende.","nl":"Ieder krijgt dagelijks nieuws en reageert met een passende uitroep. De ander vertelt welke emotie overkomt."},"nl":{"es":"Wat een mooie dag lleva een; ¡qué día tan bonito! no lleva un.","nl":"Wat een mooie dag heeft een; ¡qué día tan bonito! heeft geen un."},"check":{"es":"Reacciona a unas ideas interesantes con qué.","nl":"Reageer op interessante ideeën met qué."},"answer":{"es":"¡Qué ideas tan interesantes! El plural aparece en ideas e interesantes.","nl":"¡Qué ideas tan interesantes! Ideas en interesantes staan in het meervoud."},"prereq":["F08"],"exercises":[{"stem":"¡___ actividad tan interesante!","answers":["qué"],"why":{"es":"Qué exclamativo lleva tilde.","nl":"Uitroepend qué krijgt een accent."},"mode":"word","instruction":null,"id":"F25_1"},{"stem":"¡Qué aulas tan ___! (bonito)","answers":["bonitas"],"why":{"es":"El adjetivo concuerda con aulas, femenino plural.","nl":"Het bijvoeglijk naamwoord past bij aulas, vrouwelijk meervoud."},"mode":"word","instruction":null,"id":"F25_2"}]},{"id":"F26","block":4,"p":[{"es":"Quitamos ar, er o ir del infinitivo y añadimos la terminación de persona. La tabla muestra hablar, comer y vivir. El presente sirve para hábitos, estados actuales y hechos generales; no solo para lo que ocurre en este segundo.","nl":"Verwijder ar, er of ir van de infinitief en voeg de persoonsuitgang toe. De tabel toont hablar, comer en vivir. De tegenwoordige tijd beschrijft gewoonten, huidige situaties en algemene feiten, niet alleen dit moment."},{"es":"Las formas nosotros y vosotros distinguen er de ir: comemos/vivimos, coméis/vivís. Vos hablás, comés, vivís son modelos de un voseo extendido. Para otras variantes consulta F22.","nl":"Bij nosotros en vosotros verschillen er en ir: comemos/vivimos, coméis/vivís. Vos hablás, comés, vivís zijn vormen van een veelvoorkomend voseo. Zie F22 voor variatie."}],"ex":[{"es":"Cada martes preparo las clases en casa. Después como con una compañera que vive cerca.","nl":"Elke dinsdag bereid ik thuis de lessen voor. Daarna eet ik met een collega die in de buurt woont."},{"es":"¿Ustedes trabajan cerca? Nosotros vivimos a diez minutos y caminamos al centro.","nl":"Werken jullie in de buurt? Wij wonen op tien minuten afstand en lopen naar het centrum."}],"refs":["pcic","voseo","nl_andar"],"related":["F27","F28"],"title":{"es":"Presente regular","nl":"Regelmatige tegenwoordige tijd"},"goal":{"es":"Hablar de hábitos, situaciones actuales y hechos generales.","nl":"Gewoonten, huidige situaties en algemene feiten beschrijven."},"error":{"es":"Ante «yo hablar», pregunta quién y cuándo; el infinitivo por sí solo no expresa persona.","nl":"Vraag bij «yo hablar» wie en wanneer; de infinitief alleen geeft geen persoon aan."},"tip":{"es":"Conserva la raíz como base y cambia la terminación al cambiar de persona.","nl":"Bewaar de stam als basis en wissel de uitgang wanneer de persoon verandert."},"task":{"es":"Entrevisten a una pareja sobre sus hábitos y presenten dos coincidencias al grupo.","nl":"Laat tweetallen elkaar interviewen over gewoonten en twee overeenkomsten presenteren."},"nl":{"es":"Invertir la pregunta neerlandesa puede cambiar werk/werkt. La forma española no cambia solo por ser pregunta: trabajas / ¿trabajas?","nl":"In een Nederlandse vraag kan werk/werkt veranderen. In het Spaans verandert de vorm niet alleen doordat het een vraag is: trabajas / ¿trabajas?."},"check":{"es":"Completa con vivir: «Nosotras ... en Breda, pero ellos ... en Tilburg».","nl":"Vul aan met vivir: «Nosotras ... en Breda, pero ellos ... en Tilburg»."},"answer":{"es":"Vivimos, viven. La persona decide la terminación.","nl":"Vivimos, viven. De persoon bepaalt de uitgang."},"table":[["Persona","hablar","comer","vivir"],["yo","hablo","como","vivo"],["tú","hablas","comes","vives"],["él / ella / usted","habla","come","vive"],["nosotros / nosotras","hablamos","comemos","vivimos"],["vosotros / vosotras","habláis","coméis","vivís"],["ellos / ellas / ustedes","hablan","comen","viven"],["vos","hablás","comés","vivís"]],"prereq":["F21","F22"],"exercises":[{"stem":"Nosotras ___ en Breda y viajamos en tren. (vivir, presente)","answers":["vivimos"],"why":{"es":"Vivir forma vivimos con nosotros/nosotras.","nl":"Vivir wordt vivimos bij nosotros/nosotras."},"mode":"word","instruction":null,"id":"F26_1"},{"stem":"¿Ustedes ___ antes de clase? (comer, presente)","answers":["comen"],"why":{"es":"Ustedes usa tercera persona plural: comen.","nl":"Ustedes krijgt derde persoon meervoud: comen."},"mode":"word","instruction":null,"id":"F26_2"}]},{"id":"F27","block":4,"p":[{"es":"Algunos verbos cambian una vocal de la raíz cuando esa parte recibe el acento: pensar → pienso, poder → puedo, pedir → pido, jugar → juego. En estos modelos, nosotros y vosotros conservan la vocal: pensamos, podéis, pedimos, jugáis.","nl":"Sommige werkwoorden veranderen een stamklinker wanneer die beklemtoond is: pensar → pienso, poder → puedo, pedir → pido, jugar → juego. Bij deze modellen behouden nosotros en vosotros de klinker: pensamos, podéis, pedimos, jugáis."},{"es":"Aprende el infinitivo y una forma que muestre el cambio: querer/quiero, dormir/duermo, repetir/repito. No todos los verbos con e u o cambian. En el voseo de hablás/comés: pensás, podés, pedís, jugás.","nl":"Leer de infinitief met een vorm die de verandering toont: querer/quiero, dormir/duermo, repetir/repito. Niet elk werkwoord met e of o verandert. Bij het voseo van hablás/comés: pensás, podés, pedís, jugás."}],"ex":[{"es":"Quiero empezar temprano, pero mis compañeros prefieren las diez. Pensamos en un horario común.","nl":"Ik wil vroeg beginnen, maar mijn medestudenten hebben liever tien uur. We denken over een gezamenlijk tijdstip na."},{"es":"En el restaurante pido una sopa. Mis amigos piden arroz porque después juegan un partido.","nl":"In het restaurant bestel ik soep. Mijn vrienden bestellen rijst, want daarna spelen ze een wedstrijd."}],"refs":["pcic","voseo"],"related":["F26","F28","F41"],"title":{"es":"Presente con cambios en la raíz","nl":"Tegenwoordige tijd met stamverandering"},"goal":{"es":"Reconocer familias de cambios frecuentes.","nl":"Veelvoorkomende stamveranderingen herkennen."},"error":{"es":"Ante «nosotros puedemos», compara dónde cae el acento en puedo y podemos.","nl":"Vergelijk bij «nosotros puedemos» de klemtoon van puedo en podemos."},"tip":{"es":"El truco del acento ayuda con estos modelos; no permite adivinar qué verbos pertenecen a cada familia.","nl":"De klemtoon helpt bij deze modellen, maar voorspelt niet welke werkwoorden tot de familie behoren."},"task":{"es":"Con horarios distintos, una pareja negocia cuándo puede quedar y qué prefiere hacer.","nl":"Laat tweetallen met verschillende roosters overleggen wanneer ze kunnen afspreken en wat ze willen doen."},"nl":{"es":"En neerlandés también cambia la raíz de algunos verbos, pero las familias españolas se aprenden con sus propios modelos.","nl":"Ook in het Nederlands veranderen sommige werkwoordstammen, maar leer de Spaanse families met hun eigen modellen."},"check":{"es":"Completa: «Yo ... una copia; nosotros ... dos», con pedir.","nl":"Vul aan met pedir: «Yo ... una copia; nosotros ... dos»."},"answer":{"es":"Pido, pedimos. El cambio e → i no aparece en pedimos.","nl":"Pido, pedimos. De verandering e → i verschijnt niet in pedimos."},"table":[["Persona","pensar","poder","pedir","jugar"],["yo","pienso","puedo","pido","juego"],["tú","piensas","puedes","pides","juegas"],["él / ella / usted","piensa","puede","pide","juega"],["nosotros / nosotras","pensamos","podemos","pedimos","jugamos"],["vosotros / vosotras","pensáis","podéis","pedís","jugáis"],["ellos / ellas / ustedes","piensan","pueden","piden","juegan"]],"prereq":["F26"],"exercises":[{"stem":"Hoy yo ___ una copia. (pedir, presente)","answers":["pido"],"why":{"es":"Pedir cambia e a i en pido.","nl":"Pedir verandert e in i bij pido."},"mode":"word","instruction":null,"id":"F27_1"},{"stem":"Nosotros ___ empezar ahora. (poder, presente)","answers":["podemos"],"why":{"es":"Nosotros conserva la o en podemos.","nl":"Nosotros behoudt de o in podemos."},"mode":"word","instruction":null,"id":"F27_2"}]},{"id":"F28","block":4,"p":[{"es":"Ser e ir tienen formas muy diferentes del infinitivo. Otros verbos cambian especialmente en yo: hago, salgo, sé, doy, veo, conozco. Tener, venir, decir y oír presentan cambios en varias personas. La tabla permite consultar cada forma.","nl":"Ser en ir hebben vormen die sterk van de infinitief verschillen. Andere veranderen vooral bij yo: hago, salgo, sé, doy, veo, conozco. Tener, venir, decir en oír veranderen bij meerdere personen. De tabel helpt elke vorm opzoeken."},{"es":"Usted usa la forma de él/ella; ustedes, la de ellos/ellas. En un voseo extendido encontramos sos, vas, estás, tenés, venís, hacés, salís, decís, sabés, das, ves, oís, conocés.","nl":"Usted gebruikt de vorm van él/ella; ustedes die van ellos/ellas. Een veelvoorkomend voseo gebruikt sos, vas, estás, tenés, venís, hacés, salís, decís, sabés, das, ves, oís, conocés."}],"ex":[{"es":"Salgo de casa a las ocho, voy al centro y hago una pausa antes de clase.","nl":"Ik vertrek om acht uur, ga naar het centrum en neem vóór de les een pauze."},{"es":"Conozco a la nueva profesora. Viene los martes y siempre nos dice dónde están los materiales.","nl":"Ik ken de nieuwe docent. Ze komt op dinsdag en vertelt ons altijd waar de materialen liggen."}],"refs":["pcic","voseo","nl_estar"],"related":["F22","F26","F27"],"title":{"es":"Otros presentes irregulares","nl":"Andere onregelmatige vormen in de tegenwoordige tijd"},"goal":{"es":"Usar los presentes irregulares más frecuentes.","nl":"De meest voorkomende onregelmatige vormen gebruiken."},"error":{"es":"No pidas memorizar trece paradigmas de una vez. Selecciona tres verbos que la tarea necesite y recupéralos después.","nl":"Laat niet dertien paradigma's ineens leren. Kies drie werkwoorden die de taak nodig heeft en laat die later terugkomen."},"tip":{"es":"Agrupa formas yo en go, formas con varios cambios y los modelos ser/ir. Comprueba las demás personas.","nl":"Groepeer yo vormen op go, werkwoorden met meerdere veranderingen en ser/ir. Controleer ook de andere personen."},"task":{"es":"Preparen una presentación de prácticas con dónde van, qué hacen y a quién conocen. La pareja hace dos preguntas.","nl":"Laat een stagepresentatie voorbereiden over waar men heen gaat, wat men doet en wie men kent. De ander stelt twee vragen."},"nl":{"es":"Una forma irregular de yo no determina por sí sola todas las demás formas.","nl":"Een onregelmatige yo vorm bepaalt niet automatisch alle andere vormen."},"check":{"es":"Cambia «Yo hago la tarea» a nosotros y a ustedes.","nl":"Verander «Yo hago la tarea» naar nosotros en ustedes."},"answer":{"es":"Nosotros hacemos la tarea. Ustedes hacen la tarea. Hago no da «hagemos».","nl":"Nosotros hacemos la tarea. Ustedes hacen la tarea. Hago leidt niet tot «hagemos»."},"table":[["Verbo","yo","tú","él / ella / Ud.","nosotros/as","vosotros/as","ellos / ellas / Uds."],["ser","soy","eres","es","somos","sois","son"],["ir","voy","vas","va","vamos","vais","van"],["estar","estoy","estás","está","estamos","estáis","están"],["tener","tengo","tienes","tiene","tenemos","tenéis","tienen"],["venir","vengo","vienes","viene","venimos","venís","vienen"],["hacer","hago","haces","hace","hacemos","hacéis","hacen"],["salir","salgo","sales","sale","salimos","salís","salen"],["decir","digo","dices","dice","decimos","decís","dicen"],["saber","sé","sabes","sabe","sabemos","sabéis","saben"],["dar","doy","das","da","damos","dais","dan"],["ver","veo","ves","ve","vemos","veis","ven"],["oír","oigo","oyes","oye","oímos","oís","oyen"],["conocer","conozco","conoces","conoce","conocemos","conocéis","conocen"]],"prereq":["F26"],"exercises":[{"stem":"Yo ___ las copias antes del taller. (hacer, presente)","answers":["hago"],"why":{"es":"La forma de yo es hago, no haco.","nl":"De yo vorm is hago, niet haco."},"mode":"word","instruction":null,"id":"F28_1"},{"stem":"Ellas ___ al centro todos los días. (venir, presente)","answers":["vienen"],"why":{"es":"Venir cambia e a ie en vienen.","nl":"Venir verandert e in ie bij vienen."},"mode":"word","instruction":null,"id":"F28_2"},{"stem":"Yo ___ a la nueva profesora. (conocer, presente)","answers":["conozco"],"why":{"es":"Conocer forma conozco en primera persona singular.","nl":"Conocer krijgt conozco in de eerste persoon enkelvoud."},"mode":"word","instruction":null,"id":"F28_3"},{"stem":"¿Tú ___ dónde está la biblioteca? (saber, presente)","answers":["sabes"],"why":{"es":"Sabes es la forma de tú; sé corresponde a yo.","nl":"Sabes hoort bij tú; sé bij yo."},"mode":"word","instruction":null,"id":"F28_4"}]},{"id":"F29","block":5,"p":[{"es":"Ser presenta identidad, profesión, origen o características: soy Ana, soy profesora, soy de Guatemala, soy tranquila. También expresa pertenencia y material: es de Marta, es de madera. Con profesión sin descripción normalmente no hay artículo.","nl":"Ser geeft identiteit, beroep, herkomst of eigenschappen aan: soy Ana, soy profesora, soy de Guatemala, soy tranquila. Ook bezit en materiaal: es de Marta, es de madera. Bij een beroep zonder beschrijving staat meestal geen lidwoord."},{"es":"Usamos ser para la hora y para situar eventos: son las nueve; la reunión es en el aula dos. Las formas son soy, eres, es, somos, sois, son; con vos, sos en un voseo extendido. Una característica expresada con ser también puede cambiar.","nl":"Ser geeft de tijd en de plaats van evenementen aan: son las nueve; la reunión es en el aula dos. Vormen: soy, eres, es, somos, sois, son; bij veelvoorkomend voseo sos. Een eigenschap met ser kan ook veranderen."}],"ex":[{"es":"Soy profesora de español y soy de Guatemala. Mi grupo es pequeño, pero muy participativo.","nl":"Ik ben docent Spaans en kom uit Guatemala. Mijn groep is klein, maar doet actief mee."},{"es":"Son las diez. La presentación es en la biblioteca y el material es de la escuela.","nl":"Het is tien uur. De presentatie is in de bibliotheek en het materiaal is van de school."}],"refs":["ser","nl_serestar","pcic"],"related":["F30","F31"],"title":{"es":"Ser","nl":"Ser"},"goal":{"es":"Identificar, describir y expresar origen o pertenencia.","nl":"Identificeren, beschrijven en herkomst of bezit aangeven."},"error":{"es":"No justifiques ser solo con «para siempre»: una profesión puede cambiar y se expresa con ser.","nl":"Verklaar ser niet alleen met «voor altijd»: een beroep kan veranderen en krijgt toch ser."},"tip":{"es":"Clasifica ejemplos por mensaje: quién, de dónde, cómo, de quién y cuándo o dónde ocurre un evento.","nl":"Orden voorbeelden naar boodschap: wie, waarvandaan, hoe, van wie en wanneer of waar een evenement plaatsvindt."},"task":{"es":"Preparen una presentación de un centro con nombre, características y lugar de una actividad. Otra pareja identifica el centro.","nl":"Laat een centrum voorstellen met naam, eigenschappen en de locatie van een activiteit. Een ander tweetal herkent het centrum."},"nl":{"es":"Zijn no decide entre ser y estar. De bijeenkomst is in lokaal twee usa ser por tratarse de un evento.","nl":"Zijn bepaalt niet de keuze tussen ser en estar. De bijeenkomst is in lokaal twee krijgt ser omdat het om een evenement gaat."},"check":{"es":"¿Cómo dices dónde tiene lugar el taller?","nl":"Hoe vertel je waar de workshop plaatsvindt?"},"answer":{"es":"El taller es en la biblioteca. Para localizar a las personas: están en la biblioteca.","nl":"El taller es en la biblioteca. Personen lokaliseren: están en la biblioteca."},"prereq":["F21","F28"],"exercises":[{"stem":"La reunión ___ en la sala dos. (ser / estar, presente)","answers":["es"],"why":{"es":"El lugar de un evento se expresa aquí con ser.","nl":"De locatie van een evenement krijgt hier ser."},"mode":"word","instruction":null,"id":"F29_1"},{"stem":"Nosotras ___ profesoras de español. (ser, presente)","answers":["somos"],"why":{"es":"Nosotras requiere somos.","nl":"Nosotras vraagt somos."},"mode":"word","instruction":null,"id":"F29_2"}]},{"id":"F30","block":5,"p":[{"es":"Estar indica dónde se encuentra alguien o algo: la escuela está cerca. También expresa estados: estoy cansada, las ventanas están abiertas. La duración no decide el verbo: una ciudad está junto al mar aunque siga allí muchos años.","nl":"Estar geeft aan waar iemand of iets zich bevindt: la escuela está cerca. Het beschrijft ook toestanden: estoy cansada, las ventanas están abiertas. Duur bepaalt het werkwoord niet: een stad está junto al mar, ook als dat jarenlang zo blijft."},{"es":"Formas: estoy, estás, está, estamos, estáis, están. Bien y mal no cambian: estamos bien. Un adjetivo sí concuerda: estamos cansadas. Estar + gerundio describe una acción en desarrollo, como estamos leyendo, en F39.","nl":"Vormen: estoy, estás, está, estamos, estáis, están. Bien en mal veranderen niet: estamos bien. Een bijvoeglijk naamwoord past zich wel aan: estamos cansadas. Estar + gerundio beschrijft een lopende handeling, zoals estamos leyendo, in F39."}],"ex":[{"es":"El centro está cerca de la estación. Las aulas están en el primer piso.","nl":"Het centrum ligt bij het station. De lokalen zijn op de eerste verdieping."},{"es":"Después de tres clases estoy cansada, pero estoy contenta con el trabajo del grupo.","nl":"Na drie lessen ben ik moe, maar tevreden over het werk van de groep."}],"refs":["estar","nl_serestar","pcic"],"related":["F29","F31","F32"],"title":{"es":"Estar","nl":"Estar"},"goal":{"es":"Localizar personas o cosas y expresar estados.","nl":"Personen of dingen lokaliseren en toestanden beschrijven."},"error":{"es":"En «somos en clase» pide localizar a las personas: estamos en clase. No preguntes cuánto tiempo permanecerán.","nl":"Laat bij «somos en clase» de personen lokaliseren: estamos en clase. Vraag niet hoe lang ze blijven."},"tip":{"es":"Separa dos preguntas útiles: ¿dónde está? y ¿cómo está?","nl":"Houd twee nuttige vragen apart: ¿dónde está? en ¿cómo está?."},"task":{"es":"Una persona organiza materiales en un plano y otra debe colocarlos siguiendo sus indicaciones. Después comparan.","nl":"De een plaatst materialen op een plattegrond; de ander zet ze volgens de beschrijving neer. Daarna vergelijken ze."},"nl":{"es":"Estar puede corresponder a staan, liggen o zijn cuando lo importante es la ubicación: el libro está en la mesa.","nl":"Estar kan staan, liggen of zijn weergeven als de plaats centraal staat: el libro está en la mesa."},"check":{"es":"Completa: «Las llaves ... en la mochila y yo ... tranquila».","nl":"Vul aan: «Las llaves ... en la mochila y yo ... tranquila»."},"answer":{"es":"Están, estoy. El verbo concuerda con las llaves y con yo.","nl":"Están, estoy. Het werkwoord past bij las llaves en yo."},"prereq":["F21","F28"],"exercises":[{"stem":"Las llaves ___ sobre la mesa. (estar, presente)","answers":["están"],"why":{"es":"Se localizan varias llaves: están, con tilde.","nl":"We lokaliseren meerdere sleutels: están, met accent."},"mode":"word","instruction":null,"id":"F30_1"},{"stem":"Después de la clase yo ___ cansada. (estar, presente)","answers":["estoy"],"why":{"es":"Estoy concuerda con yo y expresa un estado.","nl":"Estoy past bij yo en geeft een toestand aan."},"mode":"word","instruction":null,"id":"F30_2"}]},{"id":"F31","block":5,"p":[{"es":"Ser suele presentar una característica con la que describimos o clasificamos. Estar suele presentar un estado situado en un contexto. Ana es tranquila describe su carácter; Ana está tranquila describe cómo se encuentra en esa situación. No es simplemente permanente frente a temporal.","nl":"Ser beschrijft of classificeert vaak met een eigenschap. Estar beschrijft vaak een toestand binnen een situatie. Ana es tranquila beschrijft haar karakter; Ana está tranquila hoe zij zich hier voelt. Het is niet eenvoudig blijvend tegenover tijdelijk."},{"es":"Algunos adjetivos cambian de significado: es listo significa inteligente; está listo, preparado. Es aburrido puede describir algo que aburre; está aburrido, a alguien que siente aburrimiento. Para personas y cosas en un lugar usamos estar; para el lugar de un evento, ser.","nl":"Sommige bijvoeglijke naamwoorden veranderen van betekenis: es listo betekent slim; está listo betekent klaar. Es aburrido kan iets saais beschrijven; está aburrido iemand die zich verveelt. Personen en dingen lokaliseren: estar; de plaats van een evenement: ser."}],"ex":[{"es":"Normalmente Lucas es tranquilo. Hoy está nervioso porque presenta su primera clase.","nl":"Lucas is meestal rustig. Vandaag is hij zenuwachtig, want hij geeft zijn eerste les."},{"es":"El grupo está listo para empezar. La actividad es interesante y nadie está aburrido.","nl":"De groep is klaar om te beginnen. De activiteit is interessant en niemand verveelt zich."}],"refs":["ser","estar","nl_serestar","pcic"],"related":["F29","F30","F32"],"title":{"es":"Elegir ser o estar","nl":"Kiezen tussen ser en estar"},"goal":{"es":"Relacionar la elección del verbo con el significado.","nl":"De werkwoordkeuze aan de betekenis verbinden."},"error":{"es":"Si el alumno responde por duración, añade «Madrid está en España» y pide revisar el criterio con el contexto.","nl":"Voeg «Madrid está en España» toe als iemand op duur afgaat en laat het criterium met de context herzien."},"tip":{"es":"Compara dos escenas de la misma persona. Explica qué cambia en la descripción, sin prometer que todo adjetivo admite ambos verbos.","nl":"Vergelijk twee scènes met dezelfde persoon. Bespreek de beschrijving, zonder te suggereren dat elk bijvoeglijk naamwoord beide werkwoorden toelaat."},"task":{"es":"Escriban dos escenas para «es listo» y «está listo». Otra pareja identifica el significado y justifica la elección.","nl":"Laat twee scènes schrijven voor «es listo» en «está listo». Een ander tweetal herkent de betekenis en verklaart de keuze."},"nl":{"es":"Hij is slim y hij is klaar usan is; el español elige es listo y está listo.","nl":"Hij is slim en hij is klaar gebruiken is; het Spaans kiest es listo en está listo."},"check":{"es":"¿Cómo dices que la clase está preparada para salir?","nl":"Hoe zeg je dat de klas klaar is om te vertrekken?"},"answer":{"es":"La clase está lista para salir. Es lista indicaría inteligencia, no preparación.","nl":"La clase está lista para salir. Es lista zou slim betekenen, niet klaar."},"prereq":["F29","F30"],"exercises":[{"stem":"Ya he preparado todo. ___ listo para empezar. (ser / estar, yo)","answers":["estoy"],"why":{"es":"Estar listo significa estar preparado.","nl":"Estar listo betekent klaar zijn."},"mode":"word","instruction":null,"id":"F31_1"},{"stem":"Ana aprende muy rápido: ___ muy lista. (ser / estar, característica)","answers":["es"],"why":{"es":"Ser lista describe inteligencia.","nl":"Ser lista beschrijft slim zijn."},"mode":"word","instruction":null,"id":"F31_2"}]},{"id":"F32","block":5,"title":{"es":"Hay y estar","nl":"Hay en estar"},"goal":{"es":"Presentar lo que hay en un lugar y localizar personas o cosas identificadas.","nl":"Vertellen wat ergens aanwezig is en waar bekende personen of dingen zijn."},"p":[{"es":"Usamos **hay** para decir que algo existe o está presente. En «En el centro cultural hay una biblioteca», presentamos la biblioteca. Podemos preguntar «¿Hay una biblioteca?» o «¿Qué hay en el centro cultural?».","nl":"Met **hay** vertel je dat iets bestaat of aanwezig is. In «En el centro cultural hay una biblioteca» introduceer je de bibliotheek. Je kunt vragen «¿Hay una biblioteca?» of «¿Qué hay en el centro cultural?»."},{"es":"**Hay mantiene la misma forma** con una cosa o con varias, «Hay una sala», «Hay dos salas». También aparece con nombres sin artículo, «Hay agua», «Hay sillas». Para negar, «No hay agua».","nl":"**Hay houdt dezelfde vorm** bij één ding en bij meerdere dingen, «Hay una sala», «Hay dos salas». Het kan ook zonder lidwoord, «Hay agua», «Hay sillas». Een ontkenning maak je met no, «No hay agua»."},{"es":"Usamos **estar** para decir dónde se encuentra alguien o algo que podemos identificar. En «La biblioteca está en la planta baja», indicamos el lugar de esa biblioteca. No hace falta haberla mencionado antes si la situación permite saber de cuál hablamos.","nl":"Met **estar** vertel je waar iemand of iets is. Het moet duidelijk zijn over wie of wat je het hebt. In «La biblioteca está en la planta baja» geef je de plaats van die bibliotheek aan. Je hoeft die niet eerder te noemen als de situatie duidelijk maakt welke bibliotheek je bedoelt."},{"es":"Estar cambia según la persona y el número, **estoy, estás, está, estamos, estáis, están**. En esta ficha usamos sobre todo está y están, «El proyector está en la sala», «Las sillas están junto a la puerta».","nl":"Estar verandert met de persoon en het aantal, **estoy, estás, está, estamos, estáis, están**. Op deze kaart gebruik je vooral está en están, «El proyector está en la sala», «Las sillas están junto a la puerta»."},{"es":"En estas situaciones, hay suele acompañar a **un, una, cantidades o nombres sin artículo**. Con estar son frecuentes **el, la, mi, este o un nombre propio**. Estas palabras orientan, pero también hay que mirar qué queremos comunicar.","nl":"In deze situaties staat hay vaak bij **un, una, aantallen of woorden zonder lidwoord**. Bij estar zie je vaak **el, la, mi, este of een naam**. Die woorden helpen je kiezen. Kijk ook naar wat je wilt vertellen."}],"ex":[{"es":"**Llegar a un centro cultural.** Ana pregunta, «¿Hay una biblioteca en este centro?». Luis responde, «Sí, hay una. La biblioteca está en la planta baja». Primero presenta un servicio y después indica su ubicación.","nl":"**Aankomen bij een cultureel centrum.** Ana vraagt «¿Hay una biblioteca en este centro?». Luis antwoordt «Sí, hay una. La biblioteca está en la planta baja». Eerst vertelt hij dat er een bibliotheek is. Daarna vertelt hij waar die is."},{"es":"**Preparar un taller.** «En esta sala hay ocho sillas. Las sillas están junto a la ventana. El proyector está sobre la mesa». El número se presenta con hay y la ubicación de los objetos identificados con estar.","nl":"**Een workshop voorbereiden.** «En esta sala hay ocho sillas. Las sillas están junto a la ventana. El proyector está sobre la mesa». Hay geeft het aantal aanwezige stoelen aan. Estar geeft de plaats aan van de dingen waarover je het hebt."},{"es":"**Buscar un objeto.** «Busco mi mochila. ¿Está en el aula?». «Sí, tu mochila está debajo de la mesa». Los dos saben qué mochila buscan.","nl":"**Iets zoeken.** «Busco mi mochila. ¿Está en el aula?». «Sí, tu mochila está debajo de la mesa». Beiden weten welke tas ze zoeken."},{"es":"**Comprobar el material.** «¿Hay papel para la actividad?». «Sí, hay papel en ese armario, pero no hay tijeras». Se indica qué material está disponible.","nl":"**Het materiaal controleren.** «¿Hay papel para la actividad?». «Sí, hay papel en ese armario, pero no hay tijeras». Je hoort welk materiaal beschikbaar is."}],"refs":["haber","estar","nl_serestar","pcic"],"related":["F04","F30","F31"],"start":{"es":"**Empezar por el significado.** Muestra el primer diálogo y pregunta «¿Qué información añade cada frase?». Después, el grupo escribe dos preguntas para un edificio nuevo, una sobre los servicios disponibles y otra sobre su ubicación.","nl":"**Begin bij de betekenis.** Laat de eerste dialoog zien en vraag «Welke informatie voegt elke zin toe?». Laat de groep daarna twee vragen bedenken over een nieuw gebouw, één over wat er aanwezig is en één over de plaats."},"error":{"es":"**Anticipar errores.** Si alguien responde a «¿Dónde está tu mochila?» con «Hay mi mochila en el aula», pregunta «¿Estamos presentando algo o buscando una mochila concreta?». La respuesta adecuada aquí es «Mi mochila está en el aula». Si escribe «Las sillas está junto a la ventana», pide que señale cuántas sillas localiza. Si dice «El proyector es en la sala», haz que reformule la ubicación con estar.","nl":"**Speel in op mogelijke fouten.** Antwoordt iemand op «¿Dónde está tu mochila?» met «Hay mi mochila en el aula», vraag dan «Introduceer je iets of zoek je een bepaalde tas?». Hier past «Mi mochila está en el aula». Bij «Las sillas está junto a la ventana» laat je de leerling aangeven hoeveel stoelen het zijn. Bij «El proyector es en la sala» laat je de leerling de plaats opnieuw aangeven met estar."},"tip":{"es":"**Truco útil.** Hay ayuda a hacer un inventario, estar ayuda a localizar en un mapa. El alumno debe poder explicar para qué usa cada verbo. La imagen apoya estas tareas, pero no sustituye al contexto ni explica todos los usos de estar.","nl":"**Een bruikbaar geheugensteuntje.** Met hay maak je een inventaris, met estar geef je een plaats aan op een kaart. Laat leerlingen hun keuze uitleggen. Dit helpt bij deze taken, maar verklaart niet elk gebruik van estar."},"nl":{"es":"**Contraste con el neerlandés.** «Er is een projector» y «Er zijn acht stoelen» se expresan con hay. El neerlandés cambia el verbo, el español conserva hay. Además, «Mijn tas ligt in het lokaal» corresponde a «Mi mochila está en el aula». No se traduce er automáticamente por hay, «Mijn tas ligt er» puede corresponder a «Mi mochila está allí».","nl":"**Vergelijk met het Nederlands.** «Er is een projector» en «Er zijn acht stoelen» krijgen in het Spaans allebei hay. In het Nederlands verandert het werkwoord, in het Spaans blijft hay gelijk. «Mijn tas ligt in het lokaal» wordt «Mi mochila está en el aula». Vertaal er niet automatisch met hay, «Mijn tas ligt er» kan «Mi mochila está allí» betekenen."},"precision":{"es":"**Precisión para el futuro docente.** La RAE y la ASALE analizan haber existencial como impersonal. En «Hay ocho sillas», ocho sillas no es el sujeto. Evita explicarlo como onbepaald onderwerp. Es más claro decir al alumno que hay indica qué está presente y no cambia con la cantidad.","nl":"**Precies uitleggen als docent.** Volgens de RAE en de ASALE is haber in dit gebruik onpersoonlijk. In «Hay ocho sillas» is ocho sillas geen onderwerp. Vermijd daarom de uitleg onbepaald onderwerp. Leg voor leerlingen eenvoudig uit dat hay aangeeft wat aanwezig is en niet verandert met het aantal."},"task":{"es":"**Actividad con información diferente.** Reparte dos tarjetas por pareja. No pueden mostrárselas. A necesita elegir una sala para un taller con proyector y al menos seis sillas. B tiene esta información, «Hay dos salas. La sala 1 está en la planta baja y tiene cuatro sillas. La sala 2 está en el primer piso. Allí hay un proyector y ocho sillas». A pregunta por los recursos y por la ubicación. Al final explica qué sala elige y dónde está.","nl":"**Activiteit met verschillende informatie.** Geef ieder tweetal twee verschillende kaartjes. Ze mogen die niet aan elkaar laten zien. A zoekt een ruimte voor een workshop met een projector en minstens zes stoelen. B krijgt deze informatie, «Hay dos salas. La sala 1 está en la planta baja y tiene cuatro sillas. La sala 2 está en el primer piso. Allí hay un proyector y ocho sillas». A vraagt naar het materiaal en de plaats. Daarna legt A uit welke ruimte geschikt is en waar die is."},"model":{"es":"**Respuesta posible.** «Podemos usar la sala 2. Hay un proyector y ocho sillas. La sala está en el primer piso». Valora si la decisión se entiende, si distingue presentar y localizar y si usa está o están cuando corresponde.","nl":"**Mogelijk antwoord.** «Podemos usar la sala 2. Hay un proyector y ocho sillas. La sala está en el primer piso». Kijk of de keuze duidelijk is, of de leerling onderscheid maakt tussen aanwezigheid en plaats en of está en están goed worden gebruikt."},"adapt":{"es":"**Comprobar y adaptar.** Pide una frase con hay y otra con estar sobre un lugar distinto. Pregunta por la elección del verbo. Si falta apoyo, ofrece un inicio de frase. Si el estudiante domina el español, pídele que explique por qué «Una de las salas está en el primer piso» es posible. Así comprueba que un o una no deciden el verbo por sí solos.","nl":"**Controleer en pas aan.** Vraag om één zin met hay en één met estar over een andere plek. Laat de leerling de keuze uitleggen. Geef zo nodig een begin van een zin. Beheerst de student het Spaans al goed, laat die dan uitleggen waarom «Una de las salas está en el primer piso» mogelijk is. Zo wordt duidelijk dat un of una op zichzelf de keuze niet bepaalt."},"check":{"es":"¿Por qué es posible «Una de las salas está en el primer piso»?","nl":"Waarom is «Una de las salas está en el primer piso» mogelijk?"},"answer":{"es":"Localizamos una sala de un conjunto. Una no obliga a usar hay; importa la información que comunicamos.","nl":"We geven de plaats van een ruimte uit een geheel aan. Una verplicht niet tot hay; de boodschap bepaalt de keuze."},"prereq":["F04","F03","F30"],"exercises":[{"stem":"¿Qué material hay? En esta sala ___ ocho sillas. (hay / están)","answers":["hay"],"why":{"es":"Hay presenta lo disponible y no cambia con la cantidad.","nl":"Hay introduceert wat aanwezig is en verandert niet met het aantal."},"mode":"word","instruction":null,"id":"F32_1"},{"stem":"Busco las sillas del taller. Las sillas ___ junto a la ventana. (está / están)","answers":["están"],"why":{"es":"Localizamos unas sillas identificadas y concordamos en plural.","nl":"We lokaliseren bepaalde stoelen en gebruiken meervoud."},"mode":"word","instruction":null,"id":"F32_2"},{"stem":"¿Dónde está mi mochila? Mi mochila ___ debajo de la mesa. (hay / está)","answers":["está"],"why":{"es":"La pregunta busca la ubicación de una mochila identificada.","nl":"De vraag zoekt de plaats van een bepaalde rugzak."},"mode":"word","instruction":null,"id":"F32_3"}]},{"id":"F33","block":5,"p":[{"es":"Tener expresa posesión o relaciones: tengo un coche, tiene dos hermanos. Para edad usamos tener + número + años. Algunas sensaciones se expresan con tener + nombre: hambre, sed, frío, calor, sueño, miedo.","nl":"Tener drukt bezit of relaties uit: tengo un coche, tiene dos hermanos. Leeftijd: tener + getal + años. Sommige gevoelens krijgen tener + naamwoord: hambre, sed, frío, calor, sueño, miedo."},{"es":"Usamos mucho/mucha con esos nombres: tengo mucho sueño, tengo mucha hambre. Formas: tengo, tienes, tiene, tenemos, tenéis, tienen; vos tenés en un voseo extendido. Tener frío habla de una sensación; estar frío describe la temperatura de algo o alguien.","nl":"Bij deze naamwoorden staat mucho/mucha: tengo mucho sueño, tengo mucha hambre. Vormen: tengo, tienes, tiene, tenemos, tenéis, tienen; vaak vos tenés. Tener frío geeft aan dat je het koud hebt; estar frío beschrijft de temperatuur."}],"ex":[{"es":"Tengo veintitrés años y tengo dos hermanas. Una de ellas también estudia español.","nl":"Ik ben drieëntwintig en heb twee zussen. Een van hen studeert ook Spaans."},{"es":"Después del viaje tenemos hambre y mucha sed. Buscamos un lugar para comer.","nl":"Na de reis hebben we honger en veel dorst. We zoeken een plek om te eten."}],"refs":["pcic","concordancia"],"related":["F28","F34","F42"],"title":{"es":"Tener, edad y sensaciones","nl":"Tener, leeftijd en gevoelens"},"goal":{"es":"Expresar posesión, edad y necesidades físicas.","nl":"Bezit, leeftijd en lichamelijke behoeften uitdrukken."},"error":{"es":"Ante «soy veinte años» ofrece tengo veinte años y pide reutilizarlo con una edad diferente.","nl":"Geef bij «soy veinte años» tengo veinte años en laat het met een andere leeftijd hergebruiken."},"tip":{"es":"Aprende tener junto al nombre de la sensación, como una expresión completa.","nl":"Leer tener samen met het naamwoord voor het gevoel als complete uitdrukking."},"task":{"es":"Cada persona recibe un personaje con edad y necesidades después de un viaje. El grupo organiza una pausa adecuada.","nl":"Ieder krijgt een personage met leeftijd en behoeften na een reis. De groep plant een passende pauze."},"nl":{"es":"Ik ben twintig se expresa tengo veinte años. Ik heb honger se parece más a tengo hambre.","nl":"Ik ben twintig wordt tengo veinte años. Ik heb honger lijkt meer op tengo hambre."},"check":{"es":"¿Cómo expresas que necesitas beber después de caminar?","nl":"Hoe zeg je dat je na het wandelen moet drinken?"},"answer":{"es":"Tengo sed. Para intensidad: tengo mucha sed.","nl":"Tengo sed. Sterker: tengo mucha sed."},"prereq":["F28"],"exercises":[{"stem":"Yo ___ veinticuatro años. (tener, presente)","answers":["tengo"],"why":{"es":"La edad se expresa con tener.","nl":"Leeftijd wordt met tener uitgedrukt."},"mode":"word","instruction":null,"id":"F33_1"},{"stem":"Después de caminar tenemos mucha ___. Necesitamos beber. (sed / sueño)","answers":["sed"],"why":{"es":"Tener sed expresa la necesidad de beber.","nl":"Tener sed geeft aan dat je moet drinken."},"mode":"word","instruction":null,"id":"F33_2"}]},{"id":"F34","block":5,"p":[{"es":"Para el tiempo decimos hace frío, hace calor, hace sol o hace viento. Llover y nevar suelen usarse en tercera persona singular: llueve, nieva. No añadimos un pronombre equivalente al het de het regent.","nl":"Voor het weer zeggen we hace frío, hace calor, hace sol of hace viento. Llover en nevar staan meestal in de derde persoon enkelvoud: llueve, nieva. We voegen geen voornaamwoord toe zoals het in het regent."},{"es":"También hay niebla y está nublado. Aprende cada expresión con su verbo. Hace frío describe el tiempo; tengo frío describe cómo me siento. En el pasado, hacía frío y llovía sirven para describir una situación.","nl":"Ook mogelijk: hay niebla en está nublado. Leer elke uitdrukking met het werkwoord. Hace frío beschrijft het weer; tengo frío mijn gevoel. In het verleden beschrijven hacía frío en llovía een situatie."}],"ex":[{"es":"Hoy hace viento y está nublado. Organizamos el taller dentro del centro.","nl":"Vandaag waait het en is het bewolkt. We organiseren de workshop binnen."},{"es":"En la montaña nieva, pero aquí solo llueve. Tengo frío y busco mi chaqueta.","nl":"In de bergen sneeuwt het, maar hier regent het alleen. Ik heb het koud en zoek mijn jas."}],"refs":["pcic","haber"],"related":["F33","F49"],"title":{"es":"Tiempo atmosférico","nl":"Het weer"},"goal":{"es":"Describir el tiempo sin añadir un sujeto personal.","nl":"Het weer beschrijven zonder persoonlijk onderwerp."},"error":{"es":"Ante «ello llueve», explica que este uso de llover no necesita sujeto.","nl":"Leg bij «ello llueve» uit dat dit gebruik van llover geen onderwerp nodig heeft."},"tip":{"es":"Usa tarjetas completas: hace sol, llueve, hay niebla, está nublado. Evita inventar un único verbo para todas.","nl":"Gebruik complete kaartjes: hace sol, llueve, hay niebla, está nublado. Bedenk geen enkel werkwoord dat overal past."},"task":{"es":"Con tres partes meteorológicos ficticios, elijan dónde hacer una actividad al aire libre y expliquen por qué.","nl":"Laat met drie verzonnen weerberichten kiezen waar een buitenactiviteit kan plaatsvinden en waarom."},"nl":{"es":"Het is koud, het regent y het is bewolkt requieren construcciones españolas diferentes.","nl":"Het is koud, het regent en het is bewolkt vragen verschillende Spaanse constructies."},"check":{"es":"Diferencia el tiempo de tu sensación con frío.","nl":"Onderscheid het weer en je gevoel met frío."},"answer":{"es":"Hace frío y tengo frío. La primera frase describe el tiempo; la segunda, mi sensación.","nl":"Hace frío y tengo frío. De eerste zin beschrijft het weer; de tweede mijn gevoel."},"prereq":["F28"],"exercises":[{"stem":"Hoy ___ mucho frío y necesitamos abrigo. (hacer, presente)","answers":["hace"],"why":{"es":"El uso meteorológico es impersonal y va en singular.","nl":"Dit weergebruik is onpersoonlijk en staat in het enkelvoud."},"mode":"word","instruction":null,"id":"F34_1"},{"stem":"En la montaña ___ y todo está blanco. (nevar, presente)","answers":["nieva"],"why":{"es":"Nevar cambia e a ie en nieva.","nl":"Nevar verandert e in ie bij nieva."},"mode":"word","instruction":null,"id":"F34_2"}]},{"id":"F35","block":5,"p":[{"es":"Saber sirve para información: sé la respuesta, sé dónde está. Con infinitivo expresa una habilidad aprendida: sé nadar. Conocer indica familiaridad con personas, lugares o cosas: conozco a Ana, conozco Utrecht, conozco ese libro.","nl":"Saber gaat over informatie: sé la respuesta, sé dónde está. Met een infinitief geeft het een geleerde vaardigheid aan: sé nadar. Conocer geeft bekendheid met personen, plaatsen of dingen: conozco a Ana, conozco Utrecht, conozco ese libro."},{"es":"Las formas de yo son sé y conozco. Con personas identificadas, conocer lleva normalmente a: conozco a tu profesora. Poder puede expresar posibilidad o capacidad en una situación: sé nadar, pero hoy no puedo nadar.","nl":"De yo vormen zijn sé en conozco. Bij bepaalde personen staat meestal a: conozco a tu profesora. Poder kan mogelijkheid of vermogen in een situatie aangeven: sé nadar, pero hoy no puedo nadar."}],"ex":[{"es":"Sé dónde está el centro, pero no conozco a la coordinadora. La voy a conocer mañana.","nl":"Ik weet waar het centrum is, maar ken de coördinator niet. Morgen ga ik haar ontmoeten."},{"es":"Marta sabe conducir, pero hoy no puede llevarnos porque no tiene coche.","nl":"Marta kan autorijden, maar kan ons vandaag niet brengen, want ze heeft geen auto."}],"refs":["pcic","pronombres"],"related":["F28","F41","F51"],"title":{"es":"Saber y conocer","nl":"Saber en conocer"},"goal":{"es":"Distinguir información, habilidad y familiaridad.","nl":"Informatie, vaardigheid en bekendheid onderscheiden."},"error":{"es":"Ante «conozco hablar español», recupera saber + infinitivo. No conviertas todos los usos de kunnen en poder.","nl":"Geef bij «conozco hablar español» saber + infinitief. Vertaal niet elk kunnen met poder."},"tip":{"es":"Información, habilidad aprendida y familiaridad son tres casillas para clasificar ejemplos.","nl":"Gebruik drie vakken: informatie, geleerde vaardigheid en bekendheid."},"task":{"es":"Una pareja organiza una visita: averigua quién conoce el lugar, quién sabe llegar y quién puede acompañar al grupo.","nl":"Laat een bezoek organiseren: wie kent de plaats, wie weet de weg en wie kan de groep begeleiden?"},"nl":{"es":"Weten se aproxima a saber y kennen a conocer. Para una habilidad, kunnen puede corresponder a saber.","nl":"Weten lijkt op saber en kennen op conocer. Bij een vaardigheid kan kunnen saber worden."},"check":{"es":"¿Qué verbo necesitas para afirmar que has aprendido a nadar?","nl":"Welk werkwoord gebruik je om te zeggen dat je hebt leren zwemmen?"},"answer":{"es":"Sé nadar. Puedo nadar puede expresar que ahora tengo la posibilidad de hacerlo.","nl":"Sé nadar. Puedo nadar kan aangeven dat ik nu de mogelijkheid heb."},"prereq":["F28"],"exercises":[{"stem":"He aprendido a nadar: ___ nadar. (saber, presente)","answers":["sé"],"why":{"es":"Saber + infinitivo expresa habilidad aprendida; sé lleva tilde.","nl":"Saber + infinitief geeft een geleerde vaardigheid; sé krijgt een accent."},"mode":"word","instruction":null,"id":"F35_1"},{"stem":"Yo ___ a Ana; trabajamos juntas. (conocer, presente)","answers":["conozco"],"why":{"es":"Conocer expresa familiaridad con una persona.","nl":"Conocer geeft bekendheid met een persoon."},"mode":"word","instruction":null,"id":"F35_2"}]},{"id":"F36","block":5,"p":[{"es":"Algunos verbos se usan con me, te, se, nos, os, se: me levanto, te duchas, se llama. El pronombre cambia con la persona. Con vos usamos te; con ustedes, se. Delante de un verbo conjugado: nos levantamos temprano.","nl":"Sommige werkwoorden krijgen me, te, se, nos, os, se: me levanto, te duchas, se llama. Het voornaamwoord verandert met de persoon. Bij vos hoort te; bij ustedes se. Vóór een vervoegd werkwoord: nos levantamos temprano."},{"es":"En me lavo, la acción recae sobre quien la hace. En me llamo Ana, el pronombre forma parte de la expresión del nombre. No todos los verbos con se significan «a sí mismo». Con partes del cuerpo: me lavo las manos.","nl":"In me lavo is de handelende persoon ook degene die gewassen wordt. In me llamo Ana hoort het voornaamwoord bij het noemen van de naam. Niet elk werkwoord met se betekent «zichzelf». Bij lichaamsdelen: me lavo las manos."}],"ex":[{"es":"Me llamo Inés. Me levanto a las siete y me ducho antes de desayunar.","nl":"Ik heet Inés. Ik sta om zeven uur op en douche vóór het ontbijt."},{"es":"Los estudiantes se preparan para la actividad. Después nos sentamos en círculo.","nl":"De studenten maken zich klaar voor de activiteit. Daarna gaan we in een kring zitten."}],"refs":["pronombres","pcic"],"related":["F21","F54"],"title":{"es":"Reflexivos y pronominales frecuentes","nl":"Wederkerende en andere werkwoorden met se"},"goal":{"es":"Describir rutinas y usar el pronombre con la persona correcta.","nl":"Gewoonten beschrijven met het juiste voornaamwoord."},"error":{"es":"Ante «yo se levanto», busca la pareja de persona y pronombre: yo me, tú te, ella se.","nl":"Zoek bij «yo se levanto» de combinatie van persoon en voornaamwoord: yo me, tú te, ella se."},"tip":{"es":"Cambia juntos persona, pronombre y verbo. No enseñes se como una pieza fija.","nl":"Verander persoon, voornaamwoord en werkwoord samen. Leer se niet als een vast onderdeel dat altijd gelijk blijft."},"task":{"es":"Dos personas comparan sus mañanas y negocian el uso de un baño compartido.","nl":"Laat twee personen hun ochtendroutine vergelijken en het gebruik van een gedeelde badkamer plannen."},"nl":{"es":"Ik heet Ana no lleva un pronombre equivalente a me. Leer llamarse como expresión evita traducir palabra por palabra.","nl":"Ik heet Ana heeft geen vorm zoals me. Leer llamarse als uitdrukking om letterlijk vertalen te voorkomen."},"check":{"es":"Transforma «Me levanto temprano» para ustedes.","nl":"Verander «Me levanto temprano» naar ustedes."},"answer":{"es":"Ustedes se levantan temprano. Cambian el pronombre y el verbo.","nl":"Ustedes se levantan temprano. Voornaamwoord en werkwoord veranderen."},"prereq":["F21","F26"],"exercises":[{"stem":"Nosotras ___ levantamos a las siete. (pronombre)","answers":["nos"],"why":{"es":"Nos corresponde a nosotras.","nl":"Nos hoort bij nosotras."},"mode":"word","instruction":null,"id":"F36_1"},{"stem":"¿Cómo ___ llamas? Yo me llamo Sara. (pronombre)","answers":["te"],"why":{"es":"Te se combina con la forma llamas.","nl":"Te hoort bij llamas."},"mode":"word","instruction":null,"id":"F36_2"}]},{"id":"F37","block":5,"p":[{"es":"Con estos verbos indicamos a quién afecta algo: me, te, le, nos, os, les. El verbo concuerda con lo que gusta, interesa o duele: me gusta el libro, me gustan los libros; me duele la cabeza, me duelen los pies.","nl":"Met deze werkwoorden geef je aan wie iets ervaart: me, te, le, nos, os, les. Het werkwoord past bij wat bevalt, interesseert of pijn doet: me gusta el libro, me gustan los libros; me duele la cabeza, me duelen los pies."},{"es":"Una actividad en infinitivo lleva normalmente singular: nos encanta bailar. A mí, a Ana o a ustedes aclaran o destacan la persona, pero mantienen el pronombre: a Ana le interesa el curso. Para negar: no me gusta.","nl":"Een activiteit in de infinitief krijgt meestal enkelvoud: nos encanta bailar. A mí, a Ana of a ustedes verduidelijkt de persoon; het korte voornaamwoord blijft: a Ana le interesa el curso. Ontkenning: no me gusta."}],"ex":[{"es":"A nuestros estudiantes les interesan las canciones. A mí me encanta trabajar con letras sencillas.","nl":"Onze studenten vinden liedjes interessant. Ik werk graag met eenvoudige songteksten."},{"es":"Después de caminar me duelen los pies. No me apetece otra visita; prefiero descansar.","nl":"Na het lopen doen mijn voeten pijn. Ik heb geen zin in nog een bezoek; ik rust liever uit."}],"refs":["gustar","pronombres","pcic"],"related":["F52","F70"],"title":{"es":"Gustar, encantar, interesar y doler","nl":"Gustar, encantar, interesar en doler"},"goal":{"es":"Expresar gustos, interés y dolor con concordancia.","nl":"Voorkeur, interesse en pijn met passende vormen uitdrukken."},"error":{"es":"En «me gusto el libro», pregunta qué produce el gusto. El libro es singular y necesita gusta.","nl":"Vraag bij «me gusto el libro» wat het plezier geeft. El libro is enkelvoud en vraagt gusta."},"tip":{"es":"Dos decisiones: quién lo siente elige me/le/les; qué lo produce decide gusta/gustan.","nl":"Twee keuzes: wie het ervaart bepaalt me/le/les; wat het veroorzaakt bepaalt gusta/gustan."},"task":{"es":"Recojan preferencias de tres personas y elijan una actividad que interese al grupo. Justifiquen con gusta e interesa.","nl":"Verzamel voorkeuren van drie personen en kies een activiteit die de groep aanspreekt. Onderbouw met gusta en interesa."},"nl":{"es":"Ik vind boeken leuk tiene ik como sujeto. En me gustan los libros, los libros determina el plural del verbo.","nl":"Ik vind boeken leuk heeft ik als onderwerp. In me gustan los libros bepaalt los libros het meervoud van het werkwoord."},"check":{"es":"Completa: «A Sara ... ... los museos», con gustar.","nl":"Vul aan met gustar: «A Sara ... ... los museos»."},"answer":{"es":"A Sara le gustan los museos. Le corresponde a Sara y gustan a los museos.","nl":"A Sara le gustan los museos. Le hoort bij Sara en gustan bij los museos."},"prereq":["F21","F28"],"exercises":[{"stem":"A Sara le ___ los museos. (gustar, presente)","answers":["gustan"],"why":{"es":"Los museos es plural y determina gustan.","nl":"Los museos is meervoud en bepaalt gustan."},"mode":"word","instruction":null,"id":"F37_1"},{"stem":"A mis compañeros ___ interesa el curso. (le / les)","answers":["les"],"why":{"es":"Les se refiere a varios compañeros; interesa concuerda con el curso.","nl":"Les verwijst naar meerdere personen; interesa past bij el curso."},"mode":"word","instruction":null,"id":"F37_2"}]},{"id":"F38","block":6,"p":[{"es":"El infinitivo termina en ar, er o ir y no indica persona: hablar, comer, vivir. Aparece detrás de muchos verbos: quiero aprender. Si cambia el sujeto, puede ser necesaria otra construcción; aquí trabajamos casos como yo quiero aprender yo.","nl":"De infinitief eindigt op ar, er of ir en geeft geen persoon aan: hablar, comer, vivir. Hij volgt op veel werkwoorden: quiero aprender. Bij een ander onderwerp kan een andere constructie nodig zijn; hier wil en leert dezelfde persoon."},{"es":"Tras preposición usamos infinitivo para una acción: para estudiar, antes de salir, sin hablar. También puede nombrar una actividad como sujeto: leer ayuda. El infinitivo puede llevar complemento: leer novelas ayuda a ampliar vocabulario.","nl":"Na een voorzetsel gebruiken we voor een handeling een infinitief: para estudiar, antes de salir, sin hablar. Hij kan ook een activiteit als onderwerp noemen: leer ayuda. Een aanvulling is mogelijk: leer novelas ayuda a ampliar vocabulario."}],"ex":[{"es":"Quiero preparar una actividad para practicar las preguntas. Antes de empezar, reviso los ejemplos.","nl":"Ik wil een activiteit voorbereiden om vragen te oefenen. Voor ik begin, bekijk ik de voorbeelden."},{"es":"Caminar al centro me ayuda a pensar. Prefiero salir temprano y llegar sin prisa.","nl":"Naar het centrum lopen helpt me nadenken. Ik vertrek liever vroeg en kom zonder haast aan."}],"refs":["pcic","gerundio"],"related":["F41","F65","F68"],"title":{"es":"Usos del infinitivo","nl":"Gebruik van de infinitief"},"goal":{"es":"Nombrar actividades y combinar verbos.","nl":"Activiteiten benoemen en werkwoorden combineren."},"error":{"es":"Ante «para estudio», recupera para + infinitivo. El verbo de esa acción no se conjuga aquí.","nl":"Geef bij «para estudio» para + infinitief. Het werkwoord van die handeling wordt hier niet vervoegd."},"tip":{"es":"Distingue el verbo que lleva la persona y la actividad que queda en infinitivo.","nl":"Onderscheid het werkwoord dat de persoon aangeeft en de activiteit in de infinitief."},"task":{"es":"Cada pareja propone tres actividades para aprender vocabulario y explica para qué sirve cada una.","nl":"Laat tweetallen drie activiteiten voor woordenschat voorstellen en het doel van elke activiteit uitleggen."},"nl":{"es":"Te aparece en muchas combinaciones neerlandesas, pero no se traduce siempre con una preposición: quiero aprender.","nl":"Te staat in veel Nederlandse combinaties, maar wordt niet altijd een voorzetsel: quiero aprender."},"check":{"es":"Completa con leer: «Antes de ... el texto, miro el título».","nl":"Vul aan met leer: «Antes de ... el texto, miro el título»."},"answer":{"es":"Leer. Después de antes de mantenemos el infinitivo.","nl":"Leer. Na antes de blijft de infinitief staan."},"prereq":["F21","F26"],"exercises":[{"stem":"Antes de ___ la actividad, leemos las instrucciones. (empezar)","answers":["empezar"],"why":{"es":"Después de antes de usamos aquí infinitivo.","nl":"Na antes de gebruiken we hier de infinitief."},"mode":"word","instruction":null,"id":"F38_1"},{"stem":"Quiero ___ español para trabajar con este grupo. (aprender)","answers":["aprender"],"why":{"es":"Querer se combina directamente con infinitivo.","nl":"Querer staat direct vóór een infinitief."},"mode":"word","instruction":null,"id":"F38_2"}]},{"id":"F39","block":6,"p":[{"es":"Estar + gerundio presenta una acción en curso: estoy leyendo. Con ar formamos ando; con er e ir, iendo: hablando, comiendo, viviendo. Formas frecuentes: leyendo, oyendo, yendo, diciendo, pidiendo, durmiendo.","nl":"Estar + gerundio toont een lopende handeling: estoy leyendo. Bij ar komt ando; bij er en ir iendo: hablando, comiendo, viviendo. Veelvoorkomende vormen: leyendo, oyendo, yendo, diciendo, pidiendo, durmiendo."},{"es":"Estar cambia con la persona; el gerundio no: estamos escribiendo, están escribiendo. No se usa para cualquier presente: estudio español puede expresar una situación general. Estoy estudiando español destaca una actividad o proceso en curso.","nl":"Estar verandert met de persoon; het gerundio niet: estamos escribiendo, están escribiendo. Gebruik het niet voor elk heden: estudio español kan algemeen zijn. Estoy estudiando español benadrukt een lopende activiteit of proces."}],"ex":[{"es":"Ahora no puedo hablar. Estoy preparando la clase y mis compañeros están buscando imágenes.","nl":"Ik kan nu niet praten. Ik bereid de les voor en mijn medestudenten zoeken afbeeldingen."},{"es":"Este mes estamos leyendo una novela corta. Hoy comentamos el primer capítulo.","nl":"Deze maand lezen we een korte roman. Vandaag bespreken we het eerste hoofdstuk."}],"refs":["gerundio","estar","pcic"],"related":["F26","F38","F54"],"title":{"es":"Estar + gerundio","nl":"Estar + gerundio"},"goal":{"es":"Mostrar una acción en desarrollo.","nl":"Een handeling tijdens het verloop beschrijven."},"error":{"es":"Ante «estoy estudio», conserva la persona en estoy y cambia la actividad a estudiando.","nl":"Houd bij «estoy estudio» de persoon in estoy en verander de activiteit naar estudiando."},"tip":{"es":"Imagina una cámara dentro de la acción, no solo una fotografía de un instante exacto.","nl":"Denk aan een camera midden in de handeling, niet alleen aan één exact moment."},"task":{"es":"Una persona describe qué están haciendo los equipos de una clase imaginada. Otra completa un esquema de tareas.","nl":"De een beschrijft wat teams in een denkbeeldige klas doen. De ander vult een taakoverzicht in."},"nl":{"es":"Aan het lezen zijn ayuda a entender estar leyendo, aunque ambas construcciones no coinciden en todos sus usos.","nl":"Aan het lezen zijn helpt bij estar leyendo, maar de constructies komen niet in elk gebruik overeen."},"check":{"es":"Completa con dormir: «Los niños están ...».","nl":"Vul aan met dormir: «Los niños están ...»."},"answer":{"es":"Durmiendo. El gerundio no cambia a plural.","nl":"Durmiendo. Het gerundio krijgt geen meervoud."},"prereq":["F30","F38"],"exercises":[{"stem":"Ahora estamos ___ las instrucciones. (leer)","answers":["leyendo"],"why":{"es":"El gerundio de leer es leyendo.","nl":"Het gerundio van leer is leyendo."},"mode":"word","instruction":null,"id":"F39_1"},{"stem":"El niño está ___ y no queremos despertarlo. (dormir)","answers":["durmiendo"],"why":{"es":"Dormir forma durmiendo, con cambio de o a u.","nl":"Dormir krijgt durmiendo, met o naar u."},"mode":"word","instruction":null,"id":"F39_2"}]},{"id":"F40","block":6,"p":[{"es":"Conjugamos ir y mantenemos a + infinitivo: voy a estudiar, vas a venir, va a llover, vamos a salir, vais a leer, van a trabajar. Puede expresar un plan o una previsión. No tiene que ocurrir inmediatamente: el próximo año voy a viajar.","nl":"Vervoeg ir en behoud a + infinitief: voy a estudiar, vas a venir, va a llover, vamos a salir, vais a leer, van a trabajar. Het drukt een plan of verwachting uit. Dat hoeft niet direct te zijn: el próximo año voy a viajar."},{"es":"El presente también puede hablar de un futuro previsto si el contexto lo aclara: mañana tengo clase. En voy a la biblioteca, a introduce un lugar; en voy a estudiar, introduce una acción.","nl":"Ook de tegenwoordige tijd kan een gepland toekomstig moment uitdrukken: mañana tengo clase. In voy a la biblioteca volgt een plaats op a; in voy a estudiar een handeling."}],"ex":[{"es":"El viernes vamos a visitar una escuela. Después vamos a comentar la experiencia en clase.","nl":"Vrijdag gaan we een school bezoeken. Daarna bespreken we de ervaring in de les."},{"es":"Mañana tengo tutoría a las diez. Voy a preparar dos preguntas esta tarde.","nl":"Morgen heb ik om tien uur begeleiding. Ik ga vanmiddag twee vragen voorbereiden."}],"refs":["ir","pcic"],"related":["F28","F38"],"title":{"es":"Planes con ir a + infinitivo","nl":"Plannen met ir a + infinitief"},"goal":{"es":"Hablar de planes y previsiones.","nl":"Plannen en verwachtingen bespreken."},"error":{"es":"Ante «voy estudiar» recupera las tres piezas: ir, a, infinitivo.","nl":"Haal bij «voy estudiar» de drie delen terug: ir, a, infinitief."},"tip":{"es":"Separa el destino físico de la acción prevista comparando voy a casa y voy a descansar.","nl":"Vergelijk voy a casa en voy a descansar om een bestemming van een geplande handeling te onderscheiden."},"task":{"es":"Planifiquen una visita con tres acciones y una hora. Otra pareja comprueba si el plan es viable.","nl":"Laat een bezoek plannen met drie handelingen en een tijdstip. Een ander tweetal controleert of het haalbaar is."},"nl":{"es":"Ik ga studeren no lleva una palabra como a. No la omitas al pasar al español.","nl":"Ik ga studeren heeft geen woord zoals a. Laat het in het Spaans niet weg."},"check":{"es":"Cambia «Yo voy a leer» para ustedes.","nl":"Verander «Yo voy a leer» naar ustedes."},"answer":{"es":"Ustedes van a leer. Solo cambia ir.","nl":"Ustedes van a leer. Alleen ir verandert."},"prereq":["F28","F38"],"exercises":[{"stem":"Mañana vamos ___ visitar una escuela.","answers":["a"],"why":{"es":"Ir a + infinitivo necesita a.","nl":"Ir a + infinitief heeft a nodig."},"mode":"word","instruction":null,"id":"F40_1"},{"stem":"Mis compañeros ___ a preparar la sala. (ir, presente)","answers":["van"],"why":{"es":"El sujeto plural necesita van.","nl":"Het meervoudige onderwerp vraagt van."},"mode":"word","instruction":null,"id":"F40_2"}]},{"id":"F41","block":6,"p":[{"es":"Estos verbos pueden ir con infinitivo sin preposición: puedo venir, quiero estudiar, prefiero leer, necesito descansar. El primer verbo lleva persona; el segundo presenta la acción. Sus formas de yo son puedo, quiero, prefiero, necesito.","nl":"Deze werkwoorden kunnen zonder voorzetsel vóór een infinitief: puedo venir, quiero estudiar, prefiero leer, necesito descansar. Het eerste geeft de persoon aan, het tweede de handeling. De yo vormen zijn puedo, quiero, prefiero, necesito."},{"es":"Poder puede expresar capacidad, permiso o posibilidad: ¿puedo entrar? Querer expresa deseo; preferir compara opciones; necesitar señala una necesidad. Con un nombre también es posible: necesito una copia.","nl":"Poder kan vermogen, toestemming of mogelijkheid uitdrukken: ¿puedo entrar? Querer geeft een wens, preferir een voorkeur tussen opties en necesitar een behoefte. Een naamwoord kan ook volgen: necesito una copia."}],"ex":[{"es":"Quiero participar, pero no puedo venir el lunes. Prefiero trabajar con el grupo del martes.","nl":"Ik wil meedoen, maar kan maandag niet komen. Ik werk liever met de dinsdaggroep."},{"es":"Necesitamos preparar la sala. ¿Puedes traer el proyector? Yo puedo llevar las hojas.","nl":"We moeten de ruimte voorbereiden. Kun je de projector meenemen? Ik kan de bladen meenemen."}],"refs":["pcic","ir"],"related":["F27","F35","F42"],"title":{"es":"Poder, querer, preferir y necesitar","nl":"Poder, querer, preferir en necesitar"},"goal":{"es":"Expresar posibilidad, deseo, preferencia y necesidad.","nl":"Mogelijkheid, wens, voorkeur en behoefte uitdrukken."},"error":{"es":"Ante «quiero a estudiar», contrasta quiero estudiar con voy a estudiar. Cada construcción tiene su combinación.","nl":"Vergelijk bij «quiero a estudiar» quiero estudiar met voy a estudiar. Elke constructie heeft zijn eigen combinatie."},"tip":{"es":"Pregunta qué cambia al sustituir quiero por puedo en el mismo plan.","nl":"Vraag wat verandert wanneer quiero door puedo wordt vervangen in hetzelfde plan."},"task":{"es":"Negocien una actividad con tarjetas de deseos, posibilidades y necesidades distintas. Deben llegar a una decisión compartida.","nl":"Laat een activiteit bespreken met verschillende wensen, mogelijkheden en behoeften op kaartjes. Het doel is een gezamenlijk besluit."},"nl":{"es":"Willen y kunnen ayudan a reconocer querer y poder. Necesitar + infinitivo no necesita te traducido.","nl":"Willen en kunnen helpen bij querer en poder. Necesitar + infinitief krijgt geen vertaling van te erbij."},"check":{"es":"¿Cómo expresas que una actividad te atrae, aunque no tengas tiempo?","nl":"Hoe zeg je dat een activiteit je aanspreekt, maar dat je geen tijd hebt?"},"answer":{"es":"Quiero participar, pero no puedo. Distingue deseo de posibilidad.","nl":"Quiero participar, pero no puedo. Het onderscheidt wens en mogelijkheid."},"prereq":["F27","F38"],"exercises":[{"stem":"Yo ___ participar, pero hoy no tengo tiempo. (querer, presente)","answers":["quiero"],"why":{"es":"Quiero expresa deseo, distinto de la posibilidad de hacerlo.","nl":"Quiero geeft een wens, los van de mogelijkheid."},"mode":"word","instruction":null,"id":"F41_1"},{"stem":"Nosotros ___ venir a las diez. (poder, presente)","answers":["podemos"],"why":{"es":"Podemos expresa posibilidad y no cambia la raíz a pued.","nl":"Podemos geeft mogelijkheid; de stam wordt hier niet pued."},"mode":"word","instruction":null,"id":"F41_2"}]},{"id":"F42","block":6,"p":[{"es":"Tener que + infinitivo relaciona una obligación con alguien: tengo que preparar la clase. Hay que + infinitivo presenta una necesidad general sin nombrar un sujeto: hay que reservar. Hay que mantiene la misma forma.","nl":"Tener que + infinitief koppelt een verplichting aan iemand: tengo que preparar la clase. Hay que + infinitief geeft een algemene noodzaak zonder onderwerp: hay que reservar. Hay que blijft gelijk."},{"es":"Deber + infinitivo puede expresar obligación o consejo: debes revisar el horario. Aquí practicamos ese uso básico. La fuerza de la obligación depende del contexto; no hay una escala fija entre estas tres expresiones.","nl":"Deber + infinitief kan een verplichting of advies uitdrukken: debes revisar el horario. Hier oefenen we dat basisgebruik. Hoe sterk de verplichting is, hangt van de context af; er is geen vaste rangorde tussen deze drie vormen."}],"ex":[{"es":"Para entrar al taller hay que reservar. Nosotros tenemos que hacerlo hoy porque quedan pocas plazas.","nl":"Voor de workshop moet je reserveren. Wij moeten dat vandaag doen, want er zijn weinig plaatsen over."},{"es":"Tienes que entregar la llave al salir. También debes comprobar que las ventanas están cerradas.","nl":"Je moet de sleutel bij vertrek afgeven. Je moet ook controleren of de ramen dicht zijn."}],"refs":["deber","haber","nl_obligacion","pcic"],"related":["F33","F54"],"title":{"es":"Tener que, hay que y deber","nl":"Tener que, hay que en deber"},"goal":{"es":"Expresar obligación y necesidad.","nl":"Verplichting en noodzaak uitdrukken."},"error":{"es":"Ante «tenemos estudiar», recupera que. Con deber no aparece que: debemos estudiar.","nl":"Herstel bij «tenemos estudiar» que. Bij deber komt geen que: debemos estudiar."},"tip":{"es":"Pregunta si la frase nombra a quien tiene la obligación o presenta una norma general.","nl":"Vraag of de zin noemt wie de verplichting heeft of een algemene regel geeft."},"task":{"es":"Diseñen instrucciones para usar un aula compartida. Distingan las normas generales de las tareas asignadas a cada persona.","nl":"Laat instructies voor een gedeeld lokaal maken. Onderscheid algemene regels en persoonlijk verdeelde taken."},"nl":{"es":"Moeten puede corresponder a tener que, hay que o deber. Er moet no se traduce palabra por palabra.","nl":"Moeten kan tener que, hay que of deber worden. Er moet vertaal je niet woord voor woord."},"check":{"es":"¿Cómo formulas una norma general sobre reservar, sin nombrar una persona?","nl":"Hoe formuleer je een algemene reserveringsregel zonder een persoon te noemen?"},"answer":{"es":"Hay que reservar. No añadimos un pronombre sujeto a hay que.","nl":"Hay que reservar. Hay que krijgt geen onderwerpsvoornaamwoord."},"prereq":["F33","F38"],"exercises":[{"stem":"Para entrar hay ___ reservar una plaza.","answers":["que"],"why":{"es":"La construcción es hay que + infinitivo.","nl":"De constructie is hay que + infinitief."},"mode":"word","instruction":null,"id":"F42_1"},{"stem":"Yo ___ que devolver la llave hoy. (tener, presente)","answers":["tengo"],"why":{"es":"Tener que vincula la obligación a una persona.","nl":"Tener que koppelt de verplichting aan een persoon."},"mode":"word","instruction":null,"id":"F42_2"}]},{"id":"F43","block":6,"p":[{"es":"Empezar a + infinitivo señala el comienzo: empiezo a estudiar. Volver a + infinitivo señala repetición: vuelvo a leer el texto. Acabar de + infinitivo, en presente, suele indicar un pasado muy reciente: acabo de llegar.","nl":"Empezar a + infinitief geeft het begin aan: empiezo a estudiar. Volver a + infinitief geeft herhaling: vuelvo a leer el texto. Acabar de + infinitief in het heden geeft meestal een heel recent verleden aan: acabo de llegar."},{"es":"Solo conjugamos el primer verbo: empezamos a trabajar, vuelven a preguntar, acabas de entrar. Volver a hacer algo no implica necesariamente volver físicamente a un lugar.","nl":"Alleen het eerste werkwoord wordt vervoegd: empezamos a trabajar, vuelven a preguntar, acabas de entrar. Volver a hacer algo betekent niet noodzakelijk teruggaan naar een plaats."}],"ex":[{"es":"Acabo de abrir el documento. Ahora empiezo a revisar las instrucciones.","nl":"Ik heb het document net geopend. Nu begin ik de instructies te bekijken."},{"es":"No entiendo esta parte y vuelvo a leerla. Después vuelvo a preguntar a mi compañera.","nl":"Ik begrijp dit deel niet en lees het opnieuw. Daarna vraag ik het nog eens aan mijn medestudent."}],"refs":["pcic","ir"],"related":["F27","F38","F46"],"title":{"es":"Empezar a, volver a y acabar de","nl":"Empezar a, volver a en acabar de"},"goal":{"es":"Indicar inicio, repetición y una acción reciente.","nl":"Begin, herhaling en een recente handeling aangeven."},"error":{"es":"Ante «acabo a llegar», contrasta la preposición de acabar de con la a de empezar a y volver a.","nl":"Vergelijk bij «acabo a llegar» de van acabar de met a van empezar a en volver a."},"tip":{"es":"Tres momentos: inicio, otra vez y hace un instante. Une cada uno a una expresión completa.","nl":"Drie momenten: begin, opnieuw en zojuist. Koppel elk aan een complete uitdrukking."},"task":{"es":"En parejas, expliquen el proceso de preparar una presentación y qué hacen cuando necesitan repetir un paso.","nl":"Laat tweetallen uitleggen hoe zij een presentatie voorbereiden en wat zij doen als een stap opnieuw moet."},"nl":{"es":"Net gedaan corresponde a acabo de hacer; opnieuw a volver a. Afmaken no explica todos los usos de acabar de.","nl":"Net gedaan komt overeen met acabo de hacer; opnieuw met volver a. Afmaken verklaart niet elk gebruik van acabar de."},"check":{"es":"¿Cómo dices que has llegado hace un momento?","nl":"Hoe zeg je dat je zojuist bent aangekomen?"},"answer":{"es":"Acabo de llegar. El primer verbo va en presente aunque la llegada ya ha ocurrido.","nl":"Acabo de llegar. Het eerste werkwoord staat in het heden, hoewel de aankomst al voorbij is."},"prereq":["F27","F38"],"exercises":[{"stem":"Acabo ___ llegar; todavía tengo la mochila puesta.","answers":["de"],"why":{"es":"Acabar de + infinitivo expresa una acción muy reciente.","nl":"Acabar de + infinitief geeft een heel recente handeling."},"mode":"word","instruction":null,"id":"F43_1"},{"stem":"No entiendo esta frase. Vuelvo ___ leerla.","answers":["a"],"why":{"es":"Volver a + infinitivo indica repetición.","nl":"Volver a + infinitief geeft herhaling."},"mode":"word","instruction":null,"id":"F43_2"}]},{"id":"F44","block":6,"p":[{"es":"Con tú, las formas regulares se parecen a la tercera persona del presente: habla, come, escribe. Irregulares frecuentes: di, haz, ve, pon, sal, sé, ten, ven. Con vosotros: hablad, comed, escribid. El modelo de vos más extendido: hablá, comé, escribí, decí, hacé, vení.","nl":"Bij tú lijken regelmatige vormen op de derde persoon van het heden: habla, come, escribe. Veelvoorkomende uitzonderingen: di, haz, ve, pon, sal, sé, ten, ven. Bij vosotros: hablad, comed, escribid. Een veelvoorkomend vos model: hablá, comé, escribí, decí, hacé, vení."},{"es":"Para usted/ustedes: hable/hablen, coma/coman, escriba/escriban, haga/hagan, vaya/vayan. Estas formas coinciden con el presente de subjuntivo, pero aquí se aprenden como instrucciones. Los pronombres se unen detrás: léelo, siéntate. No basta añadir no para una orden negativa; ese sistema queda fuera de esta ficha.","nl":"Bij usted/ustedes: hable/hablen, coma/coman, escriba/escriban, haga/hagan, vaya/vayan. Deze vormen zijn ook de presente de subjuntivo, maar worden hier als instructies geleerd. Voornaamwoorden komen vast erachter: léelo, siéntate. Een ontkenning vraagt meer dan alleen no; dat systeem valt buiten deze kaart."}],"ex":[{"es":"En un grupo que usa tú: «Lee el texto y busca dos ejemplos. Después comparte tu respuesta».","nl":"In een groep met tú: «Lee el texto y busca dos ejemplos. Después comparte tu respuesta»."},{"es":"A varios participantes con ustedes: «Abran el documento y escriban sus nombres, por favor».","nl":"Tegen meerdere deelnemers met ustedes: «Abran el documento y escriban sus nombres, por favor»."}],"refs":["voseo","pronombres","pcic"],"related":["F22","F28","F54"],"title":{"es":"Imperativo afirmativo básico","nl":"De bevestigende gebiedende wijs"},"goal":{"es":"Dar instrucciones y hacer invitaciones breves.","nl":"Instructies en korte uitnodigingen geven."},"error":{"es":"Ante «ustedes abre», identifica primero a cuántas personas se dirige la instrucción.","nl":"Bepaal bij «ustedes abre» eerst hoeveel personen worden aangesproken."},"tip":{"es":"Conserva juntos tratamiento y forma. El tono y por favor ayudan a interpretar la cortesía; la forma sola no basta.","nl":"Leer aanspreekvorm en werkwoordsvorm samen. Toon en por favor helpen bij beleefdheid; de vorm alleen is niet genoeg."},"task":{"es":"Escriban tres instrucciones para una actividad y pruébenlas con otra pareja. Comprueben si permiten actuar sin pedir aclaración.","nl":"Laat drie instructies voor een activiteit schrijven en met een ander tweetal uitproberen. Kunnen zij zonder verduidelijking handelen?"},"nl":{"es":"Lees puede dirigirse a varias personas en neerlandés. En español lee, lean y leed distinguen destinatarios y tratamientos.","nl":"Lees kan in het Nederlands meerdere mensen aanspreken. In het Spaans onderscheiden lee, lean en leed verschillende aanspreekvormen."},"check":{"es":"Da una instrucción afirmativa a varias personas con ustedes y escribir.","nl":"Geef meerdere personen met ustedes een bevestigende instructie met escribir."},"answer":{"es":"Escriban sus nombres, por favor. La forma termina en an.","nl":"Escriban sus nombres, por favor. De vorm eindigt op an."},"table":[["Verbo","tú","usted","ustedes","vosotros/as","vos"],["hablar","habla","hable","hablen","hablad","hablá"],["comer","come","coma","coman","comed","comé"],["escribir","escribe","escriba","escriban","escribid","escribí"],["hacer","haz","haga","hagan","haced","hacé"],["venir","ven","venga","vengan","venid","vení"],["decir","di","diga","digan","decid","decí"]],"prereq":["F22","F26","F28"],"exercises":[{"stem":"___ el texto, por favor. (leer, imperativo afirmativo, tú)","answers":["lee"],"why":{"es":"La instrucción afirmativa con tú es lee.","nl":"De bevestigende tú instructie is lee."},"mode":"word","instruction":null,"id":"F44_1"},{"stem":"___ sus nombres aquí, por favor. (escribir, imperativo afirmativo, ustedes)","answers":["escriban"],"why":{"es":"Ustedes usa escriban para esta instrucción.","nl":"Bij deze instructie met ustedes hoort escriban."},"mode":"word","instruction":null,"id":"F44_2"},{"stem":"___ aquí, por favor. (venir, imperativo afirmativo, vos, modelo de hablá)","answers":["vení"],"why":{"es":"En este voseo se usa vení, con tilde final.","nl":"Dit voseo gebruikt vení, met accent achteraan."},"mode":"word","instruction":null,"id":"F44_3"}]},{"id":"F45","block":7,"p":[{"es":"El participio regular se forma con ado para ar e ido para er e ir: hablado, comido, vivido. Formas frecuentes irregulares: abierto, dicho, escrito, hecho, puesto, roto, visto, vuelto. Leer y oír forman leído y oído, con tilde.","nl":"Het regelmatige deelwoord krijgt ado bij ar en ido bij er en ir: hablado, comido, vivido. Veelvoorkomende onregelmatige vormen: abierto, dicho, escrito, hecho, puesto, roto, visto, vuelto. Leer en oír worden leído en oído, met accent."},{"es":"Con haber, el participio no concuerda: hemos cerrado las puertas. Como descripción de resultado con estar, sí concuerda: las puertas están cerradas. Haber expresa aquí la acción anterior; estar describe el estado.","nl":"Bij haber verandert het deelwoord niet: hemos cerrado las puertas. Als beschrijving van een resultaat met estar past het zich wel aan: las puertas están cerradas. Haber geeft hier de eerdere handeling aan; estar beschrijft de toestand."}],"ex":[{"es":"Hemos escrito las instrucciones. Ahora están escritas en la pizarra y todos pueden leerlas.","nl":"We hebben de instructies geschreven. Nu staan ze op het bord en kan iedereen ze lezen."},{"es":"He abierto las ventanas para ventilar. Las ventanas están abiertas y entra aire fresco.","nl":"Ik heb de ramen geopend om te luchten. Ze staan open en er komt frisse lucht binnen."}],"refs":["haber","concordancia","pcic"],"related":["F46","F30"],"title":{"es":"Participios","nl":"Voltooide deelwoorden"},"goal":{"es":"Formar tiempos compuestos y describir resultados.","nl":"Samengestelde tijden maken en resultaten beschrijven."},"error":
