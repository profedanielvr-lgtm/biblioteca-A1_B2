{"es":"Ante «he escritas las frases», distingue el auxiliar haber del uso descriptivo con estar.","nl":"Onderscheid bij «he escritas las frases» haber als hulpwerkwoord en estar bij een beschrijving."},"tip":{"es":"Dos marcos: he cerrado expresa acción; está cerrada describe estado.","nl":"Twee kaders: he cerrado geeft een handeling; está cerrada beschrijft een toestand."},"task":{"es":"Una pareja prepara un aula y otra revisa el resultado. Comparan qué han hecho y cómo están los materiales.","nl":"Een tweetal bereidt een lokaal voor, een ander controleert het resultaat. Ze bespreken wat gedaan is en hoe de materialen nu zijn."},"nl":{"es":"Geopend no muestra la concordancia de abierta/abiertas en «las puertas están abiertas».","nl":"Geopend laat niet dezelfde aanpassing zien als abierta/abiertas in «las puertas están abiertas»."},"check":{"es":"Completa: «Hemos ... la puerta; la puerta está ...», con cerrar.","nl":"Vul aan met cerrar: «Hemos ... la puerta; la puerta está ...»."},"answer":{"es":"Cerrado, cerrada. Con haber no cambia; con estar concuerda con puerta.","nl":"Cerrado, cerrada. Bij haber blijft de vorm gelijk; bij estar past die bij puerta."},"prereq":["F08"],"exercises":[{"stem":"Hemos ___ las ventanas para ventilar. (abrir)","answers":["abierto"],"why":{"es":"Con haber se usa el participio invariable abierto.","nl":"Bij haber staat het onveranderlijke deelwoord abierto."},"mode":"word","instruction":null,"id":"F45_1"},{"stem":"Las ventanas están ___. (abrir, estado resultante)","answers":["abiertas"],"why":{"es":"El estado concuerda con ventanas en femenino plural.","nl":"De toestand past bij ventanas, vrouwelijk meervoud."},"mode":"word","instruction":null,"id":"F45_2"}]},{"id":"F46","block":7,"p":[{"es":"Formamos este tiempo con he, has, ha, hemos, habéis, han + participio: he visitado, hemos visto. Con tú y con vos usamos has en el modelo trabajado. El participio no cambia por género o número.","nl":"Deze tijd bestaat uit he, has, ha, hemos, habéis, han + deelwoord: he visitado, hemos visto. Bij tú en vos gebruiken we hier has. Het deelwoord verandert niet naar geslacht of getal."},{"es":"Sirve para experiencias hasta ahora: nunca he visitado Perú. En muchas variedades de España aparece con periodos que incluyen el presente: hoy he hablado con Ana. En gran parte de América es habitual hoy hablé con Ana. Hoy no obliga universalmente al compuesto.","nl":"Deze tijd kan ervaringen tot nu toe noemen: nunca he visitado Perú. In veel Spaanse variëteiten staat hij bij periodes die het heden omvatten: hoy he hablado con Ana. In veel van Amerika is hoy hablé con Ana gebruikelijk. Hoy verplicht niet overal tot de samengestelde tijd."}],"ex":[{"es":"Nunca he preparado una visita escolar. Este curso he aprendido a organizar actividades fuera del aula.","nl":"Ik heb nog nooit een schoolbezoek voorbereid. Dit studiejaar heb ik geleerd activiteiten buiten het lokaal te organiseren."},{"es":"En una variedad que usa el compuesto con hoy: «Hoy hemos hablado con la coordinadora y ya hemos reservado la sala».","nl":"In een variëteit met de samengestelde tijd bij hoy: «Hoy hemos hablado con la coordinadora y ya hemos reservado la sala»."}],"refs":["perfecto","haber","nl_andar","pcic"],"related":["F45","F47","F50"],"title":{"es":"Pretérito perfecto compuesto","nl":"Pretérito perfecto compuesto"},"goal":{"es":"Hablar de experiencias y de un pasado relacionado con el presente.","nl":"Ervaringen en een verleden met een relatie tot het heden bespreken."},"error":{"es":"No marques hoy hablé como error universal. Si el ejercicio practica una forma concreta, debe decirlo expresamente.","nl":"Markeer hoy hablé niet als universele fout. Als een oefening een specifieke vorm oefent, moet dat expliciet staan."},"tip":{"es":"Relaciona el pasado con el ahora del hablante y observa cómo lo expresa su variedad.","nl":"Verbind het verleden met het nu van de spreker en kijk hoe diens variëteit dat uitdrukt."},"task":{"es":"Entrevisten sobre experiencias docentes hasta ahora y elijan una experiencia que otra persona pueda compartir con el grupo.","nl":"Laat ervaringen met lesgeven tot nu toe bespreken en één ervaring kiezen om met de groep te delen."},"nl":{"es":"El neerlandés usa hebben o zijn; este tiempo español siempre usa haber: he llegado, no soy llegado.","nl":"Het Nederlands gebruikt hebben of zijn; deze Spaanse tijd gebruikt altijd haber: he llegado, niet soy llegado."},"check":{"es":"Forma el perfecto compuesto de nosotros + hacer.","nl":"Vorm de perfecto compuesto van nosotros + hacer."},"answer":{"es":"Hemos hecho. Haber aporta persona y hecho queda invariable.","nl":"Hemos hecho. Haber geeft de persoon aan en hecho blijft gelijk."},"prereq":["F45"],"exercises":[{"stem":"Nosotras ___ preparado una actividad nueva. (haber, perfecto compuesto)","answers":["hemos"],"why":{"es":"Hemos es la forma de haber para nosotras.","nl":"Hemos is de vorm van haber bij nosotras."},"mode":"word","instruction":null,"id":"F46_1"},{"stem":"Yo he ___ las instrucciones. (hacer)","answers":["hecho"],"why":{"es":"Hacer tiene el participio irregular hecho.","nl":"Hacer heeft het onregelmatige deelwoord hecho."},"mode":"word","instruction":null,"id":"F46_2"}]},{"id":"F47","block":7,"p":[{"es":"El indefinido, también llamado pretérito perfecto simple, presenta hechos como completos en un marco pasado: ayer preparé la clase. Las terminaciones de er e ir coinciden. No expresa solo acciones cortas: viví allí diez años también presenta un periodo completo.","nl":"De indefinido, ook pretérito perfecto simple, presenteert gebeurtenissen als geheel in een verleden kader: ayer preparé la clase. Er en ir hebben dezelfde uitgangen. Het gaat niet alleen om korte handelingen: viví allí diez años geeft ook een hele periode."},{"es":"La tilde distingue hablo de habló. Tú hablaste no lleva s final en el modelo general escrito. Hablamos y vivimos pueden ser presente o pasado; el contexto lo aclara. Hay cambios de escritura para conservar sonidos: busqué, llegué, empecé.","nl":"Het accent onderscheidt hablo en habló. Tú hablaste krijgt in het algemene geschreven model geen s achteraan. Hablamos en vivimos kunnen heden of verleden zijn; de context maakt het duidelijk. Spelling bewaart soms de klank: busqué, llegué, empecé."}],"ex":[{"es":"Ayer preparé la sala, expliqué la actividad y escuché las propuestas del grupo.","nl":"Gisteren maakte ik de ruimte klaar, legde de activiteit uit en luisterde naar de voorstellen van de groep."},{"es":"El año pasado vivimos tres meses en Granada. Allí aprendimos a organizar visitas para estudiantes.","nl":"Vorig jaar woonden we drie maanden in Granada. Daar leerden we bezoeken voor studenten organiseren."}],"refs":["indefinido","pcic"],"related":["F48","F49","A01"],"title":{"es":"Pretérito indefinido regular","nl":"Regelmatige pretérito indefinido"},"goal":{"es":"Contar hechos pasados como completos.","nl":"Gebeurtenissen in het verleden als geheel vertellen."},"error":{"es":"Ante «ayer hablo», pregunta quién habla y escucha el acento antes de revisar la tilde.","nl":"Vraag bij «ayer hablo» wie spreekt en luister naar de klemtoon voordat je het accent controleert."},"tip":{"es":"Presenta el hecho como una unidad del relato; no uses «corto» como definición.","nl":"Toon de gebeurtenis als een geheel in het verhaal; gebruik «kort» niet als definitie."},"task":{"es":"Reconstruyan una visita con cuatro tarjetas de acontecimientos y cuenten qué ocurrió en orden.","nl":"Laat met vier gebeurteniskaartjes een bezoek reconstrueren en in volgorde vertellen."},"nl":{"es":"La forma neerlandesa ik werkte no determina por sí sola trabajé o trabajaba. Hace falta el enfoque del relato.","nl":"De Nederlandse vorm ik werkte bepaalt niet op zichzelf trabajé of trabajaba. Het perspectief van het verhaal telt."},"check":{"es":"Conjuga hablar para ella en indefinido.","nl":"Vervoeg hablar voor ella in de indefinido."},"answer":{"es":"Habló. La tilde marca la sílaba final fuerte.","nl":"Habló. Het accent markeert de beklemtoonde laatste lettergreep."},"table":[["Persona","hablar","comer","vivir"],["yo","hablé","comí","viví"],["tú / vos","hablaste","comiste","viviste"],["él / ella / usted","habló","comió","vivió"],["nosotros/as","hablamos","comimos","vivimos"],["vosotros/as","hablasteis","comisteis","vivisteis"],["ellos / ellas / ustedes","hablaron","comieron","vivieron"]],"prereq":["F26"],"exercises":[{"stem":"Ayer Ana ___ con el grupo. (hablar, indefinido)","answers":["habló"],"why":{"es":"La tercera persona singular de indefinido es habló.","nl":"De derde persoon enkelvoud van de indefinido is habló."},"mode":"word","instruction":null,"id":"F47_1"},{"stem":"El martes pasado nosotros ___ en el centro. (comer, indefinido)","answers":["comimos"],"why":{"es":"Comimos expresa aquí el hecho completo del martes pasado.","nl":"Comimos presenteert hier de gebeurtenis van vorige dinsdag als geheel."},"mode":"word","instruction":null,"id":"F47_2"},{"stem":"Ayer yo ___ al centro a las nueve. (llegar, indefinido)","answers":["llegué"],"why":{"es":"La u mantiene el sonido de g delante de e.","nl":"De u bewaart de g klank vóór e."},"mode":"word","instruction":null,"id":"F47_3"}]},{"id":"F48","block":7,"p":[{"es":"Varios verbos tienen una raíz distinta: tener → tuv, estar → estuv, poder → pud, poner → pus, saber → sup, venir → vin, querer → quis. Añaden e, iste, o, imos, isteis, ieron, sin tilde en estas formas. Hacer usa hice e hizo.","nl":"Verschillende werkwoorden hebben een andere stam: tener → tuv, estar → estuv, poder → pud, poner → pus, saber → sup, venir → vin, querer → quis. Daarachter komen e, iste, o, imos, isteis, ieron, zonder accent in deze vormen. Hacer heeft hice en hizo."},{"es":"Ser e ir comparten fui, fuiste, fue, fuimos, fuisteis, fueron. El contexto distingue su significado. Decir forma dijeron; traer, trajeron. Dar forma di, diste, dio, dimos, disteis, dieron; ver, vi, viste, vio, vimos, visteis, vieron. También: pidió/pidieron, durmió/durmieron, leyó/leyeron.","nl":"Ser en ir delen fui, fuiste, fue, fuimos, fuisteis, fueron. De context onderscheidt de betekenis. Decir heeft dijeron; traer trajeron. Dar: di, diste, dio, dimos, disteis, dieron; ver: vi, viste, vio, vimos, visteis, vieron. Ook: pidió/pidieron, durmió/durmieron, leyó/leyeron."}],"ex":[{"es":"Ayer fuimos al centro y tuvimos una reunión. La coordinadora nos dijo qué materiales necesitábamos.","nl":"Gisteren gingen we naar het centrum en hadden we een vergadering. De coördinator vertelde welke materialen we nodig hadden."},{"es":"Ana hizo las copias y puso las hojas en la mesa. Después todos leyeron las instrucciones.","nl":"Ana maakte kopieën en legde de bladen op tafel. Daarna las iedereen de instructies."}],"refs":["indefinido","pcic","nl_andar"],"related":["F47","F50"],"title":{"es":"Pretérito indefinido irregular","nl":"Onregelmatige pretérito indefinido"},"goal":{"es":"Usar formas frecuentes para contar experiencias concretas.","nl":"Veelvoorkomende vormen voor concrete ervaringen gebruiken."},"error":{"es":"En «tení» no basta cambiar una letra: recupera la familia tuve, tuviste, tuvo.","nl":"Bij «tení» is één letter veranderen niet genoeg: haal de familie tuve, tuviste, tuvo terug."},"tip":{"es":"Agrupa por raíz compartida y luego trabaja formas especiales como dijo/dijeron.","nl":"Groepeer op gedeelde stam en oefen daarna bijzondere vormen zoals dijo/dijeron."},"task":{"es":"Con una agenda y tres imprevistos, cuenten cómo resolvieron una jornada de prácticas.","nl":"Laat met een agenda en drie onverwachte gebeurtenissen vertellen hoe een stagedag verliep."},"nl":{"es":"Igual que ging y deed no se deducen de reglas regulares, fui e hice necesitan recuperación frecuente en contexto.","nl":"Net als ging en deed vragen fui en hice om herhaald ophalen in context."},"check":{"es":"Completa con hacer: «Yo ... las copias y Ana ... el cartel».","nl":"Vul aan met hacer: «Yo ... las copias y Ana ... el cartel»."},"answer":{"es":"Hice, hizo. La tercera persona se escribe con z.","nl":"Hice, hizo. De derde persoon schrijf je met z."},"table":[["Persona","tener","estar","hacer","decir"],["yo","tuve","estuve","hice","dije"],["tú / vos","tuviste","estuviste","hiciste","dijiste"],["él / ella / usted","tuvo","estuvo","hizo","dijo"],["nosotros/as","tuvimos","estuvimos","hicimos","dijimos"],["vosotros/as","tuvisteis","estuvisteis","hicisteis","dijisteis"],["ellos / ellas / ustedes","tuvieron","estuvieron","hicieron","dijeron"]],"prereq":["F47"],"exercises":[{"stem":"Ayer ella ___ todas las copias. (hacer, indefinido)","answers":["hizo"],"why":{"es":"La tercera persona es hizo, con z y sin tilde.","nl":"De derde persoon is hizo, met z en zonder accent."},"mode":"word","instruction":null,"id":"F48_1"},{"stem":"Mis compañeros ___ que la sala estaba lista. (decir, indefinido)","answers":["dijeron"],"why":{"es":"Dijeron termina en eron, no ieron.","nl":"Dijeron eindigt op eron, niet ieron."},"mode":"word","instruction":null,"id":"F48_2"},{"stem":"El viernes nosotros ___ al museo. (ir, indefinido)","answers":["fuimos"],"why":{"es":"Fuimos puede ser de ir o ser; al museo aclara aquí ir.","nl":"Fuimos kan ir of ser zijn; al museo maakt hier ir duidelijk."},"mode":"word","instruction":null,"id":"F48_3"}]},{"id":"F49","block":7,"p":[{"es":"El imperfecto muestra una situación pasada sin presentar su principio o final. Sirve para describir personas, lugares, tiempo y hábitos: era pequeña, hacía frío, iba al colegio. No significa que la situación continúe hoy.","nl":"De imperfecto toont een vroegere situatie zonder begin of einde te presenteren. Hij beschrijft personen, plaatsen, weer en gewoonten: era pequeña, hacía frío, iba al colegio. Dat betekent niet dat de situatie vandaag nog voortduurt."},{"es":"Los verbos en ar usan aba; er e ir usan ía. Los irregulares básicos son ser, ir y ver. Yo y él/ella comparten forma; el contexto o un pronombre puede aclarar quién: yo vivía, ella vivía.","nl":"Werkwoorden op ar krijgen aba; er en ir krijgen ía. De belangrijkste uitzonderingen zijn ser, ir en ver. Yo en él/ella delen hun vorm; context of een voornaamwoord verduidelijkt wie: yo vivía, ella vivía."}],"ex":[{"es":"Cuando era niña vivía cerca de la escuela. Iba caminando todos los días y jugaba en el patio.","nl":"Als kind woonde ik vlak bij school. Ik liep er elke dag heen en speelde op het plein."},{"es":"La sala era pequeña y tenía dos ventanas. Hacía calor, así que abrimos la puerta.","nl":"De ruimte was klein en had twee ramen. Het was warm, dus deden we de deur open."}],"refs":["imperfecto","pcic"],"related":["F47","F50"],"title":{"es":"Pretérito imperfecto","nl":"Pretérito imperfecto"},"goal":{"es":"Describir situaciones y hábitos del pasado.","nl":"Situaties en gewoonten in het verleden beschrijven."},"error":{"es":"No expliques imperfecto como «una acción que no terminó». Explica que la frase no enfoca su final.","nl":"Leg de imperfecto niet uit als «een handeling die niet eindigde». De zin richt de aandacht niet op het einde."},"tip":{"es":"El imperfecto permite entrar en una escena pasada y observar cómo era o qué solía ocurrir.","nl":"Met de imperfecto stap je een vroegere scène binnen om te zien hoe het was of wat gewoonlijk gebeurde."},"task":{"es":"Comparen una escuela de antes con la actual usando recuerdos o una descripción ficticia, sin presentar invenciones como recuerdos propios.","nl":"Vergelijk een vroegere en huidige school met herinneringen of een duidelijk fictieve beschrijving."},"nl":{"es":"La onvoltooid verleden tijd puede traducirse por imperfecto o indefinido; el nombre neerlandés no resuelve el contraste.","nl":"De onvoltooid verleden tijd kan imperfecto of indefinido worden; de Nederlandse naam lost het verschil niet op."},"check":{"es":"Describe un hábito infantil con nosotros + ir.","nl":"Beschrijf een jeugdgewoonte met nosotros + ir."},"answer":{"es":"Íbamos al parque todos los domingos. Íbamos lleva tilde.","nl":"Íbamos al parque todos los domingos. Íbamos krijgt een accent."},"table":[["Persona","hablar","comer / vivir","ser","ir","ver"],["yo","hablaba","comía / vivía","era","iba","veía"],["tú / vos","hablabas","comías / vivías","eras","ibas","veías"],["él / ella / usted","hablaba","comía / vivía","era","iba","veía"],["nosotros/as","hablábamos","comíamos / vivíamos","éramos","íbamos","veíamos"],["vosotros/as","hablabais","comíais / vivíais","erais","ibais","veíais"],["ellos / ellas / ustedes","hablaban","comían / vivían","eran","iban","veían"]],"prereq":["F26"],"exercises":[{"stem":"De niña, Ana ___ al colegio a pie. (ir, imperfecto)","answers":["iba"],"why":{"es":"Iba presenta aquí un hábito del pasado.","nl":"Iba geeft hier een gewoonte in het verleden."},"mode":"word","instruction":null,"id":"F49_1"},{"stem":"En aquella época nosotras ___ cerca del centro. (vivir, imperfecto)","answers":["vivíamos"],"why":{"es":"Vivíamos lleva tilde en í y describe la situación de entonces.","nl":"Vivíamos krijgt een accent op í en beschrijft de situatie van toen."},"mode":"word","instruction":null,"id":"F49_2"}]},{"id":"F50","block":7,"p":[{"es":"El indefinido presenta hechos como completos: ayer preparé la sala. El imperfecto describe el marco o una situación en curso: la sala estaba vacía. Pueden aparecer juntos: estaba leyendo cuando llegó Ana. La duración por sí sola no decide.","nl":"De indefinido presenteert gebeurtenissen als geheel: ayer preparé la sala. De imperfecto beschrijft het kader of een lopende situatie: la sala estaba vacía. Ze kunnen samen: estaba leyendo cuando llegó Ana. Duur alleen bepaalt de keuze niet."},{"es":"El perfecto compuesto relaciona el pasado con el presente en usos como experiencias hasta ahora. La elección entre hablé y he hablado varía geográficamente. Antes de corregir, mira significado, marco temporal y variedad; no busques solo una palabra como ayer u hoy.","nl":"De perfecto compuesto verbindt verleden en heden, bijvoorbeeld bij ervaringen tot nu toe. Hablé en he hablado verschillen ook per regio. Bekijk vóór correctie betekenis, tijdskader en variëteit, niet alleen een woord zoals ayer of hoy."}],"ex":[{"es":"Ayer llegué temprano. La sala estaba cerrada y no había nadie. Llamé a la coordinadora y ella abrió la puerta.","nl":"Gisteren kwam ik vroeg. De ruimte was gesloten en er was niemand. Ik belde de coördinator en zij opende de deur."},{"es":"He trabajado con varios grupos. El año pasado preparé un taller para una clase que tenía veinte estudiantes.","nl":"Ik heb met meerdere groepen gewerkt. Vorig jaar maakte ik een workshop voor een klas met twintig studenten."}],"refs":["perfecto","indefinido","imperfecto","pcic"],"related":["F46","F47","F49"],"title":{"es":"Elegir entre pasados","nl":"Kiezen tussen verleden tijden"},"goal":{"es":"Contar una experiencia y explicar el enfoque elegido.","nl":"Een ervaring vertellen en het gekozen perspectief uitleggen."},"error":{"es":"«Viví allí diez años» demuestra que un hecho largo puede presentarse como completo. Evita largo = imperfecto.","nl":"«Viví allí diez años» laat zien dat iets langdurigs als geheel kan worden gepresenteerd. Vermijd lang = imperfecto."},"tip":{"es":"Pregunta qué parte cuenta lo ocurrido y qué parte permite imaginar la escena. Son apoyos para estos relatos, no reglas sin excepción.","nl":"Vraag welk deel de gebeurtenissen vertelt en welk deel de scène zichtbaar maakt. Dit helpt hier, maar is geen regel zonder uitzonderingen."},"task":{"es":"Una persona escribe tres hechos de una visita y otra añade el ambiente. Leen el relato y justifican dos elecciones de tiempo.","nl":"De een schrijft drie gebeurtenissen van een bezoek, de ander voegt de omstandigheden toe. Laat twee tijdskeuzes uitleggen."},"nl":{"es":"Ik woonde daar puede ser vivía allí o viví allí. El español hace explícita una perspectiva que el neerlandés deja al contexto.","nl":"Ik woonde daar kan vivía allí of viví allí zijn. Het Spaans maakt een perspectief expliciet dat het Nederlands aan de context overlaat."},"check":{"es":"¿«Viví allí diez años» contradice que el indefinido presenta un hecho completo?","nl":"Spreekt «Viví allí diez años» het voltooide perspectief van de indefinido tegen?"},"answer":{"es":"No. El hablante presenta esos diez años como un periodo completo, aunque sea largo.","nl":"Nee. De spreker presenteert die tien jaar als een hele periode, ook al is die lang."},"prereq":["F46","F47","F49"],"exercises":[{"stem":"Ayer entré en la sala. ___ vacía y hacía frío. (estar, imperfecto, descripción)","answers":["estaba"],"why":{"es":"Estaba construye el marco descriptivo de la escena.","nl":"Estaba beschrijft de achtergrond van de scène."},"mode":"word","instruction":null,"id":"F50_1"},{"stem":"Viví allí diez años. ¿Se presenta ese periodo como completo? ___ (sí / no)","answers":["sí"],"why":{"es":"Sí. Un periodo largo también puede presentarse como completo.","nl":"Ja. Ook een lange periode kan als geheel worden gepresenteerd."},"mode":"word","instruction":null,"id":"F50_2"}]},{"id":"F51","block":8,"p":[{"es":"El objeto directo completa verbos como ver, comprar o leer: leo el texto → lo leo. Formas: me, te, lo/la, nos, os, los/las. Lo, la, los y las concuerdan con lo que sustituyen: compro las carpetas → las compro.","nl":"Het lijdend voorwerp vult werkwoorden aan zoals ver, comprar en leer: leo el texto → lo leo. Vormen: me, te, lo/la, nos, os, los/las. Lo, la, los en las passen bij wat ze vervangen: compro las carpetas → las compro."},{"es":"Ante personas identificadas suele aparecer a: veo a Ana → la veo. Esa a no convierte el complemento en indirecto. Para una persona masculina singular también se admite le en ciertos usos; aquí practicamos el modelo lo/la para distinguir las funciones.","nl":"Bij bepaalde personen staat vaak a: veo a Ana → la veo. Die a maakt het geen meewerkend voorwerp. Bij één mannelijke persoon is le in bepaalde gevallen ook aanvaard; hier oefenen we lo/la om de functies te onderscheiden."}],"ex":[{"es":"Busco las instrucciones del taller. ¿Las tienes? Sí, las tengo en mi carpeta.","nl":"Ik zoek de instructies van de workshop. Heb je ze? Ja, ze zitten in mijn map."},{"es":"Ana está en la biblioteca. La veo desde aquí y voy a saludarla.","nl":"Ana is in de bibliotheek. Ik zie haar vanaf hier en ga haar begroeten."}],"refs":["pronombres","a","pcic"],"related":["F52","F54"],"title":{"es":"Pronombres de objeto directo","nl":"Voornaamwoorden als lijdend voorwerp"},"goal":{"es":"Evitar repetir a quién o qué afecta directamente una acción.","nl":"Herhaling van het lijdend voorwerp vermijden."},"error":{"es":"No identifiques OD solo con «cosa» ni OI solo con «persona». Una persona también puede ser OD.","nl":"Stel OD niet gelijk aan «ding» en OI niet aan «persoon». Een persoon kan ook OD zijn."},"tip":{"es":"Sustituye primero el grupo completo y después comprueba género y número.","nl":"Vervang eerst de hele woordgroep en controleer daarna geslacht en getal."},"task":{"es":"Una pareja busca materiales para un taller y otra confirma cuáles tiene. Deben evitar repetir cada nombre.","nl":"Het ene tweetal zoekt workshopmaterialen, het andere bevestigt wat het heeft. Laat herhaling van de namen vermijden."},"nl":{"es":"Hem/haar no siguen exactamente el género gramatical de objetos en español: la carpeta → la.","nl":"Hem/haar volgen niet precies het Spaanse grammaticale geslacht van voorwerpen: la carpeta → la."},"check":{"es":"Sustituye «las llaves» en «Busco las llaves».","nl":"Vervang «las llaves» in «Busco las llaves»."},"answer":{"es":"Las busco. Las conserva femenino y plural.","nl":"Las busco. Las behoudt vrouwelijk en meervoud."},"prereq":["F21"],"exercises":[{"stem":"¿Tienes las carpetas? Sí, ___ tengo aquí. (pronombre OD)","answers":["las"],"why":{"es":"Las sustituye las carpetas, femenino plural.","nl":"Las vervangt las carpetas, vrouwelijk meervoud."},"mode":"word","instruction":null,"id":"F51_1"},{"stem":"Veo a Ana desde la ventana. ___ veo junto a la puerta. (pronombre OD)","answers":["la"],"why":{"es":"Ana es aquí objeto directo; la a personal no lo convierte en OI.","nl":"Ana is hier lijdend voorwerp; de persoonlijke a maakt het geen OI."},"mode":"word","instruction":null,"id":"F51_2"}]},{"id":"F52","block":8,"p":[{"es":"El objeto indirecto puede indicar a quién damos, decimos o enviamos algo: doy el libro a Ana → le doy el libro. Formas: me, te, le, nos, os, les. Le y les distinguen número, no género: le escribo a Ana, le escribo a Luis.","nl":"Het meewerkend voorwerp kan aangeven aan wie we iets geven, zeggen of sturen: doy el libro a Ana → le doy el libro. Vormen: me, te, le, nos, os, les. Le en les onderscheiden aantal, niet geslacht: le escribo a Ana, le escribo a Luis."},{"es":"Es frecuente mantener pronombre y destinatario: les doy una copia a los estudiantes. Con a mí o a ti, el pronombre corto es necesario en estas construcciones: a mí me dan una copia. También aparece en me gusta, aunque no haya una entrega.","nl":"Voornaamwoord en ontvanger staan vaak samen: les doy una copia a los estudiantes. Bij a mí of a ti is de korte vorm hier nodig: a mí me dan una copia. Ook in me gusta staat zo'n vorm, zonder overdracht."}],"ex":[{"es":"Le mando el horario a la profesora. Después les envío la dirección a los estudiantes.","nl":"Ik stuur de docent het rooster. Daarna stuur ik de studenten het adres."},{"es":"A mí me dan una carpeta azul. A Sara le dan una verde.","nl":"Ik krijg een blauwe map. Sara krijgt een groene."}],"refs":["pronombres","pcic"],"related":["F37","F51","F53"],"title":{"es":"Pronombres de objeto indirecto","nl":"Voornaamwoorden als meewerkend voorwerp"},"goal":{"es":"Indicar destinatarios y personas afectadas.","nl":"Ontvangers en betrokken personen aangeven."},"error":{"es":"Ante «le doy las hojas a los alumnos», comprueba el número del destinatario: les corresponde al grupo plural.","nl":"Controleer bij «le doy las hojas a los alumnos» het aantal ontvangers: bij het meervoud hoort les."},"tip":{"es":"En una entrega, separa objeto entregado y destinatario. Es una ayuda inicial, no una definición de todos los OI.","nl":"Onderscheid bij een overdracht het gegeven voorwerp en de ontvanger. Dat helpt eerst, maar definieert niet elk OI."},"task":{"es":"Distribuyan invitaciones entre tres personas y dos grupos. Confirmen a quién envían cada invitación.","nl":"Laat uitnodigingen verdelen over drie personen en twee groepen. Controleer wie welke uitnodiging krijgt."},"nl":{"es":"Ik geef Ana een boek no repite el destinatario con un pronombre; le doy un libro a Ana es normal en español.","nl":"Ik geef Ana een boek herhaalt de ontvanger niet met een voornaamwoord; le doy un libro a Ana is gewoon Spaans."},"check":{"es":"Completa: «... envío un mensaje a mis dos compañeras».","nl":"Vul aan: «... envío un mensaje a mis dos compañeras»."},"answer":{"es":"Les. Hay dos destinatarias; el género no cambia les.","nl":"Les. Er zijn twee ontvangers; het geslacht verandert les niet."},"prereq":["F21","F51"],"exercises":[{"stem":"___ envío una copia a Ana. (pronombre OI)","answers":["le"],"why":{"es":"Le indica una destinataria singular.","nl":"Le geeft één ontvanger aan."},"mode":"word","instruction":null,"id":"F52_1"},{"stem":"___ envío una copia a mis dos compañeros. (pronombre OI)","answers":["les"],"why":{"es":"Les concuerda con los destinatarios, no con la copia.","nl":"Les past bij de ontvangers, niet bij de kopie."},"mode":"word","instruction":null,"id":"F52_2"}]},{"id":"F53","block":8,"p":[{"es":"Cuando aparecen juntos, el pronombre indirecto va antes del directo: me lo, te la, nos los, os las. En «Ana me da el libro → Ana me lo da», me indica destinatario y lo sustituye el libro.","nl":"Samen staat het meewerkende voornaamwoord vóór het lijdende: me lo, te la, nos los, os las. In «Ana me da el libro → Ana me lo da» geeft me de ontvanger en lo het boek aan."},{"es":"Le y les se convierten en se delante de lo, la, los o las: le doy el libro → se lo doy. Se no muestra si hay uno o varios destinatarios; podemos aclarar: se lo doy a ellas. Lo/los sigue contando los objetos, no los destinatarios.","nl":"Le en les worden se vóór lo, la, los of las: le doy el libro → se lo doy. Se toont niet of er één of meer ontvangers zijn: verduidelijk met se lo doy a ellas. Lo/los blijft bij de voorwerpen horen, niet bij de ontvangers."}],"ex":[{"es":"¿Le mandas el horario a Ana? Sí, se lo mando esta tarde.","nl":"Stuur je Ana het rooster? Ja, ik stuur het haar vanmiddag."},{"es":"Las carpetas son para ustedes. Se las doy al final de la clase.","nl":"De mappen zijn voor jullie. Ik geef ze aan jullie aan het einde van de les."}],"refs":["pronombres","pcic"],"related":["F51","F52","F54"],"title":{"es":"Combinar pronombres, me lo y se lo","nl":"Voornaamwoorden combineren, me lo en se lo"},"goal":{"es":"Referirse al objeto y al destinatario sin repetirlos.","nl":"Naar voorwerp en ontvanger verwijzen zonder herhaling."},"error":{"es":"Ante «les lo envío», cambia solo les a se. Ante «se los envío» para un solo documento, revisa qué sustituye los.","nl":"Verander bij «les lo envío» alleen les in se. Controleer bij «se los envío» voor één document waar los naar verwijst."},"tip":{"es":"Mantén dos casillas: destinatario primero, objeto después. Se ocupa la primera cuando le/les encuentra lo/la/los/las.","nl":"Gebruik twee vakken: ontvanger eerst, voorwerp daarna. Se komt in het eerste als le/les voor lo/la/los/las staat."},"task":{"es":"Organicen el envío de tres documentos a distintos equipos y confirmen cada entrega sin repetir los nombres.","nl":"Laat drie documenten naar verschillende teams sturen en elke overdracht bevestigen zonder de namen te herhalen."},"nl":{"es":"Ik geef het aan haar tiene otro orden. El español coloca se antes de lo en se lo doy.","nl":"Ik geef het aan haar heeft een andere volgorde. Het Spaans zet se vóór lo in se lo doy."},"check":{"es":"Sustituye ambos complementos en «Doy la llave a Ana».","nl":"Vervang beide aanvullingen in «Doy la llave a Ana»."},"answer":{"es":"Se la doy. Se sustituye le; la se refiere a la llave.","nl":"Se la doy. Se vervangt le; la verwijst naar de sleutel."},"prereq":["F51","F52"],"exercises":[{"stem":"Le doy el libro a Ana. ___ lo doy ahora.","answers":["se"],"why":{"es":"Le cambia a se delante de lo.","nl":"Le wordt se vóór lo."},"mode":"word","instruction":null,"id":"F53_1"},{"stem":"Les envío las fotos. Se ___ envío esta tarde.","answers":["las"],"why":{"es":"Las se refiere a las fotos, no a los destinatarios.","nl":"Las verwijst naar de foto's, niet naar de ontvangers."},"mode":"word","instruction":null,"id":"F53_2"}]},{"id":"F54","block":8,"p":[{"es":"Ante un verbo conjugado: lo leo; en un tiempo compuesto: lo he leído. Con infinitivo y gerundio se unen detrás: leerlo, leyéndolo. Con imperativo afirmativo también: léelo. El conjunto se escribe como una palabra y sigue las reglas de tilde.","nl":"Vóór een vervoegd werkwoord: lo leo; bij een samengestelde tijd: lo he leído. Aan een infinitief en gerundio komen ze vast: leerlo, leyéndolo. Ook bij bevestigende bevelen: léelo. Het geheel is één woord en volgt de accentregels."},{"es":"En muchas combinaciones hay dos lugares posibles: lo voy a leer / voy a leerlo; lo estoy leyendo / estoy leyéndolo. Los pronombres dobles viajan juntos: se lo voy a dar / voy a dárselo. Con hay que: hay que hacerlo, no lo hay que hacer en el modelo general.","nl":"Bij veel combinaties zijn twee plaatsen mogelijk: lo voy a leer / voy a leerlo; lo estoy leyendo / estoy leyéndolo. Dubbele voornaamwoorden blijven samen: se lo voy a dar / voy a dárselo. Bij hay que: hay que hacerlo, niet lo hay que hacer in het algemene model."}],"ex":[{"es":"El texto está listo. Lo voy a leer ahora; después voy a explicárselo al grupo.","nl":"De tekst is klaar. Ik ga hem nu lezen; daarna ga ik hem aan de groep uitleggen."},{"es":"Hay que devolver la llave. Hay que devolverla antes de salir del centro.","nl":"De sleutel moet terug. Je moet hem teruggeven voordat je het centrum verlaat."}],"refs":["pronombres","pcic","tilde"],"related":["F39","F44","F53"],"title":{"es":"Posición de los pronombres","nl":"De plaats van voornaamwoorden"},"goal":{"es":"Colocar los pronombres con distintas formas verbales.","nl":"Voornaamwoorden bij verschillende werkwoordsvormen plaatsen."},"error":{"es":"Ante «he leídolo», lleva el pronombre delante de haber: lo he leído.","nl":"Zet bij «he leídolo» het voornaamwoord vóór haber: lo he leído."},"tip":{"es":"Marca los lugares permitidos con ejemplos completos. No prometas dos posiciones para cualquier pareja de verbos.","nl":"Markeer mogelijke plaatsen met hele voorbeelden. Beloof geen twee posities voor elke werkwoordcombinatie."},"task":{"es":"Reescriban un mensaje con voy a entregar y estoy preparando usando las dos posiciones posibles, sin cambiar el mensaje.","nl":"Laat een bericht met voy a entregar en estoy preparando in beide volgordes herschrijven zonder de betekenis te veranderen."},"nl":{"es":"Los pronombres españoles se unen por escrito al infinitivo, a diferencia de «het lezen».","nl":"Spaanse voornaamwoorden worden aan de infinitief vastgeschreven, anders dan in «het lezen»."},"check":{"es":"Une leer + lo en una instrucción afirmativa con tú.","nl":"Voeg leer en lo samen tot een bevestigende instructie met tú."},"answer":{"es":"Léelo. La tilde mantiene el acento de la instrucción.","nl":"Léelo. Het accent bewaart de klemtoon van de instructie."},"prereq":["F38","F39","F44","F53"],"exercises":[{"stem":"El texto está aquí. Voy a ___. (leer + lo)","answers":["leerlo"],"why":{"es":"El pronombre se une al infinitivo.","nl":"Het voornaamwoord wordt aan de infinitief vastgeschreven."},"mode":"word","instruction":null,"id":"F54_1"},{"stem":"Esta es la instrucción para ti: ___. (leer + lo, imperativo afirmativo, tú)","answers":["léelo"],"why":{"es":"Léelo une verbo y pronombre y necesita tilde.","nl":"Léelo schrijft werkwoord en voornaamwoord samen en krijgt een accent."},"mode":"word","instruction":null,"id":"F54_2"},{"stem":"La llave debe volver a recepción. Hay que ___. (devolver + la)","answers":["devolverla"],"why":{"es":"Con hay que mantenemos el pronombre unido al infinitivo.","nl":"Bij hay que blijft het voornaamwoord aan de infinitief vast."},"mode":"word","instruction":null,"id":"F54_3"}]},{"id":"F55","block":8,"p":[{"es":"Después de muchas preposiciones usamos mí y ti: para mí, de ti. Las otras formas coinciden con las de sujeto: para ella, con nosotros, sin ustedes. Mí lleva tilde; ti no. Con vos usamos para vos, con vos.","nl":"Na veel voorzetsels gebruiken we mí en ti: para mí, de ti. De andere vormen lijken op het onderwerp: para ella, con nosotros, sin ustedes. Mí krijgt een accent; ti niet. Bij vos: para vos, con vos."},{"es":"Con + mí y con + ti forman conmigo y contigo. Algunas combinaciones mantienen yo y tú: entre tú y yo, según tú. Aprende estas excepciones como grupos completos. Con gustar, a mí acompaña al pronombre corto: a mí me gusta.","nl":"Con + mí en con + ti worden conmigo en contigo. Sommige combinaties behouden yo en tú: entre tú y yo, según tú. Leer die als complete groepen. Bij gustar staat a mí naast de korte vorm: a mí me gusta."}],"ex":[{"es":"Esta carpeta es para ti. ¿Puedes venir conmigo a buscar las otras?","nl":"Deze map is voor jou. Kun je met mij de andere gaan zoeken?"},{"es":"Entre tú y yo podemos preparar la sala. Después Ana viene con nosotros.","nl":"Samen kunnen jij en ik de ruimte klaarmaken. Daarna komt Ana met ons mee."}],"refs":["tonicos","voseo","pcic"],"related":["F13","F37","A01"],"title":{"es":"Pronombres tras preposición","nl":"Voornaamwoorden na een voorzetsel"},"goal":{"es":"Usar mí, ti y otras formas después de preposición.","nl":"Mí, ti en andere vormen na voorzetsels gebruiken."},"error":{"es":"Ante «con mí» recupera conmigo. Ante «para yo» contrasta yo trabajo y esto es para mí.","nl":"Haal bij «con mí» conmigo terug. Vergelijk bij «para yo» yo trabajo en esto es para mí."},"tip":{"es":"Presenta las preposiciones con su pareja frecuente: para mí, contigo, entre tú y yo.","nl":"Leer voorzetsels met hun gebruikelijke combinatie: para mí, contigo, entre tú y yo."},"task":{"es":"Organicen un viaje en tres grupos y expliquen quién va con quién y para quién es cada billete.","nl":"Laat een reis in drie groepen organiseren: wie reist met wie en voor wie is elk kaartje?"},"nl":{"es":"Voor mij y met jou ayudan a reconocer formas distintas de ik/jij, pero conmigo es una sola palabra.","nl":"Voor mij en met jou helpen bij vormen anders dan ik/jij, maar conmigo is één woord."},"check":{"es":"Completa: «El regalo es para ...», hablando de ti mismo.","nl":"Vul aan over jezelf: «El regalo es para ...»."},"answer":{"es":"Mí. Es un pronombre tras preposición y lleva tilde.","nl":"Mí. Het is een voornaamwoord na een voorzetsel en krijgt een accent."},"prereq":["F21","F22"],"exercises":[{"stem":"Este regalo es para ___. (yo)","answers":["mí"],"why":{"es":"Después de para usamos mí, con tilde.","nl":"Na para gebruiken we mí, met accent."},"mode":"word","instruction":null,"id":"F55_1"},{"stem":"¿Quieres venir ___ al centro? (con + yo)","answers":["conmigo"],"why":{"es":"Con y mí se unen en conmigo.","nl":"Con en mí worden conmigo."},"mode":"word","instruction":null,"id":"F55_2"}]},{"id":"F56","block":9,"p":[{"es":"En indica ubicación general. Entre sitúa respecto a varios elementos; sobre puede indicar una posición superior o una superficie. Otras expresiones llevan de: debajo de, delante de, detrás de, cerca de, lejos de, al lado de. Con el: cerca del centro.","nl":"En geeft een algemene locatie. Entre plaatst iets tussen meerdere elementen; sobre kan boven of op een oppervlak betekenen. Andere uitdrukkingen hebben de: debajo de, delante de, detrás de, cerca de, lejos de, al lado de. Met el: cerca del centro."},{"es":"Aquí, ahí y allí señalan lugares desde el contexto del hablante. También se usan acá y allá, con preferencias regionales. Si no nombramos el punto de referencia, puede omitirse de y su complemento: las sillas están delante.","nl":"Aquí, ahí en allí wijzen plaatsen aan vanuit de context. Ook acá en allá komen voor, met regionale voorkeuren. Zonder genoemd referentiepunt kan de met aanvulling weg: las sillas están delante."}],"ex":[{"es":"El proyector está sobre la mesa y los cables están debajo de ella. La pantalla está delante del grupo.","nl":"De projector staat op tafel en de kabels liggen eronder. Het scherm staat vóór de groep."},{"es":"La biblioteca está entre la cafetería y la entrada. Hay una parada de autobús cerca del centro.","nl":"De bibliotheek ligt tussen de kantine en de ingang. Er is een bushalte vlak bij het centrum."}],"refs":["delante","detras","pcic"],"related":["F07","F30","F57"],"title":{"es":"Lugar y posición","nl":"Plaats en positie"},"goal":{"es":"Localizar algo usando un punto de referencia.","nl":"Iets lokaliseren met een referentiepunt."},"error":{"es":"Ante «delante la puerta», recupera delante de. Con en no se añade de: en la sala.","nl":"Herstel bij «delante la puerta» delante de. Bij en komt geen de: en la sala."},"tip":{"es":"Para ubicar, identifica primero el objeto y luego el punto de referencia.","nl":"Bepaal eerst het voorwerp en daarna het referentiepunt."},"task":{"es":"Dos parejas tienen planos distintos de un aula. Se describen la posición de cinco objetos y buscan las diferencias.","nl":"Twee tweetallen hebben verschillende lokaalplattegronden. Ze beschrijven vijf voorwerpen en zoeken verschillen."},"nl":{"es":"Voor puede ser delante de para posición o para para finalidad. La traducción aislada no decide.","nl":"Voor kan delante de voor positie of para voor doel zijn. Een los woord bepaalt de vertaling niet."},"check":{"es":"Completa: «La mochila está debajo ... mesa».","nl":"Vul aan: «La mochila está debajo ... mesa»."},"answer":{"es":"De la. Debajo de necesita el punto de referencia, aquí la mesa.","nl":"De la. Debajo de krijgt hier la mesa als referentiepunt."},"prereq":["F30"],"exercises":[{"stem":"Las cajas están debajo ___ mesa. (de + la)","answers":["de la"],"why":{"es":"Debajo de introduce el punto de referencia.","nl":"Debajo de introduceert het referentiepunt."},"mode":"word","instruction":null,"id":"F56_1"},{"stem":"El centro está cerca ___ parque. (de + el)","answers":["del"],"why":{"es":"Cerca de + el se convierte en cerca del.","nl":"Cerca de + el wordt cerca del."},"mode":"word","instruction":null,"id":"F56_2"}]},{"id":"F57","block":9,"p":[{"es":"De o desde indican origen, a destino, hasta límite, hacia dirección y por recorrido: salgo de casa, voy al centro, camino hasta el puente, voy hacia la estación, paso por el parque. En suele situar, no marcar destino: estoy en el centro.","nl":"De of desde geeft herkomst, a bestemming, hasta grens, hacia richting en por route: salgo de casa, voy al centro, camino hasta el puente, voy hacia la estación, paso por el parque. En geeft meestal plaats, geen bestemming: estoy en el centro."},{"es":"Venir orienta el movimiento hacia quien habla o su punto de referencia: ven aquí. Ir suele orientar a otro lugar: voy a tu casa. En español general respondemos ya voy cuando alguien nos llama desde otro lugar.","nl":"Venir richt de beweging naar de spreker of diens referentiepunt: ven aquí. Ir gaat meestal naar een andere plaats: voy a tu casa. Gewoonlijk zeggen we ya voy als iemand ons van elders roept."}],"ex":[{"es":"Salimos de la escuela, pasamos por el parque y caminamos hasta la biblioteca.","nl":"We vertrekken van school, lopen door het park en gaan tot de bibliotheek."},{"es":"Estoy en casa y Ana me llama desde el centro. Le digo: «Ya voy; llego en diez minutos».","nl":"Ik ben thuis en Ana belt vanuit het centrum. Ik zeg: «Ya voy; llego en diez minutos»."}],"refs":["a","ir","venir","pcic"],"related":["F07","F40","F60"],"title":{"es":"Origen, destino, recorrido, ir y venir","nl":"Herkomst, bestemming, route, ir en venir"},"goal":{"es":"Explicar un desplazamiento desde un punto de vista claro.","nl":"Een verplaatsing vanuit een duidelijk standpunt uitleggen."},"error":{"es":"Ante «voy en Madrid» pregunta si la persona se mueve hacia Madrid o se encuentra allí.","nl":"Vraag bij «voy en Madrid» of iemand naar Madrid gaat of daar is."},"tip":{"es":"Dibuja origen, camino y destino; añade dónde está quien habla para elegir ir o venir.","nl":"Teken begin, route en bestemming; geef aan waar de spreker is om ir of venir te kiezen."},"task":{"es":"Una persona está en un centro y guía por teléfono a otra desde la estación. Deben acordar dónde encontrarse.","nl":"De een is in een centrum en begeleidt de ander telefonisch vanaf het station. Laat een ontmoetingspunt afspreken."},"nl":{"es":"Ik kom naar je toe suele corresponder a voy hacia ti o voy a tu casa. Komen no siempre es venir.","nl":"Ik kom naar je toe wordt vaak voy hacia ti of voy a tu casa. Komen is niet altijd venir."},"check":{"es":"Alguien te llama desde otra habitación. ¿Qué respuesta general usas para indicar que te acercas?","nl":"Iemand roept je vanuit een andere kamer. Welke gewone reactie geeft aan dat je eraan komt?"},"answer":{"es":"Ya voy. Adoptas tu punto de partida como hablante.","nl":"Ya voy. Je spreekt vanuit je eigen vertrekpunt."},"prereq":["F28","F56"],"exercises":[{"stem":"Salgo de casa y voy ___ centro. (a + el)","answers":["al"],"why":{"es":"A marca destino y se une con el.","nl":"A geeft de bestemming en wordt met el samen al."},"mode":"word","instruction":null,"id":"F57_1"},{"stem":"Estoy en casa. Ana me llama desde el centro: «¡Te esperamos!». Respondo «Ya ___». (ir, presente)","answers":["voy"],"why":{"es":"Desde mi punto de partida respondo ya voy.","nl":"Vanuit mijn vertrekpunt antwoord ik ya voy."},"mode":"word","instruction":null,"id":"F57_2"}]},{"id":"F58","block":9,"p":[{"es":"Usamos a para horas, en para meses o años y por en expresiones como por la mañana: a las ocho, en mayo, en 2026. Los días pueden llevar artículo: el lunes, los lunes. Mañana, hoy y ayer suelen ir sin preposición.","nl":"A staat bij tijden, en bij maanden of jaren en por in uitdrukkingen zoals por la mañana: a las ocho, en mayo, en 2026. Dagen kunnen een lidwoord krijgen: el lunes, los lunes. Mañana, hoy en ayer staan meestal zonder voorzetsel."},{"es":"De ... a y desde ... hasta marcan un intervalo. Antes de y después de sitúan respecto a otra actividad. Siempre, normalmente, a veces, nunca y dos veces por semana expresan frecuencia. Nunca puede requerir no según su posición.","nl":"De ... a en desde ... hasta geven een periode. Antes de en después de plaatsen iets ten opzichte van een activiteit. Siempre, normalmente, a veces, nunca en dos veces por semana geven frequentie. Bij nunca hangt no van de positie af."}],"ex":[{"es":"Los miércoles tengo clase de nueve a doce. Después de comer reviso mis notas.","nl":"Op woensdag heb ik les van negen tot twaalf. Na het eten bekijk ik mijn aantekeningen."},{"es":"Normalmente estudio por la tarde. A veces voy a la biblioteca y mañana estudio en casa.","nl":"Meestal studeer ik 's middags. Soms ga ik naar de bibliotheek en morgen studeer ik thuis."}],"refs":["pcic","nociones"],"related":["F19","F20","F59"],"title":{"es":"Tiempo y frecuencia","nl":"Tijd en frequentie"},"goal":{"es":"Situar actividades y decir con qué frecuencia ocurren.","nl":"Activiteiten in de tijd plaatsen en de frequentie aangeven."},"error":{"es":"Ante «en lunes», ofrece el lunes o los lunes según si se habla de una ocasión o de un hábito.","nl":"Geef bij «en lunes» el lunes of los lunes, afhankelijk van één keer of een gewoonte."},"tip":{"es":"Organiza una agenda por hora, día, mes y frecuencia, con una expresión modelo por categoría.","nl":"Orden een agenda naar uur, dag, maand en frequentie, met één model per categorie."},"task":{"es":"Dos personas comparan horarios para encontrar una hora de estudio semanal que funcione para ambas.","nl":"Laat twee personen roosters vergelijken om een gezamenlijk wekelijks studiemoment te vinden."},"nl":{"es":"Op maandag y in mei necesitan preposiciones o artículos distintos en español. No traslades op literalmente.","nl":"Op maandag en in mei krijgen andere voorzetsels of lidwoorden in het Spaans. Neem op niet letterlijk over."},"check":{"es":"Expresa una rutina de lunes con «tengo clase».","nl":"Beschrijf een maandagse routine met «tengo clase»."},"answer":{"es":"Los lunes tengo clase. El plural ayuda a indicar repetición.","nl":"Los lunes tengo clase. Het meervoud geeft de herhaling aan."},"prereq":["F20","F26"],"exercises":[{"stem":"La clase empieza ___ las nueve. (a / en)","answers":["a"],"why":{"es":"A introduce una hora.","nl":"A introduceert een tijdstip."},"mode":"word","instruction":null,"id":"F58_1"},{"stem":"La visita es ___ mayo. (a / en)","answers":["en"],"why":{"es":"En introduce aquí un mes.","nl":"En introduceert hier een maand."},"mode":"word","instruction":null,"id":"F58_2"}]},{"id":"F59","block":9,"p":[{"es":"Hace + duración sitúa un hecho anterior: llegué hace dos años. Desde + punto de inicio indica comienzo: vivo aquí desde 2024. Desde hace + duración mide una situación que continúa: vivo aquí desde hace dos años. Hace permanece en singular.","nl":"Hace + duur plaatst iets eerder: llegué hace dos años. Desde + beginpunt: vivo aquí desde 2024. Desde hace + duur meet een situatie die voortduurt: vivo aquí desde hace dos años. Hace blijft enkelvoud."},{"es":"Ya indica que algo ha ocurrido o es válido ahora: ya está listo. Todavía indica continuidad: todavía trabajo aquí. Todavía no indica que algo esperado no ha ocurrido; ya no, que una situación ha dejado de ser válida.","nl":"Ya geeft aan dat iets al gebeurd of nu geldig is: ya está listo. Todavía geeft voortgang: todavía trabajo aquí. Todavía no betekent nog niet; ya no betekent niet meer."}],"ex":[{"es":"Llegué a Tilburg hace tres años y vivo aquí desde entonces. Estudio español desde hace un año.","nl":"Ik kwam drie jaar geleden in Tilburg aan en woon hier sindsdien. Ik studeer sinds een jaar Spaans."},{"es":"La sala ya está preparada, pero el grupo todavía no ha llegado. Ya no necesitamos más sillas.","nl":"De ruimte is al klaar, maar de groep is nog niet gekomen. We hebben geen extra stoelen meer nodig."}],"refs":["hacer","pcic"],"related":["F43","F46","F58"],"title":{"es":"Hace, desde, desde hace, ya y todavía","nl":"Hace, desde, desde hace, ya en todavía"},"goal":{"es":"Expresar duración y cambios respecto al presente.","nl":"Duur en veranderingen ten opzichte van nu uitdrukken."},"error":{"es":"Ante «desde tres años», pregunta si se expresa fecha o duración; para duración aquí corresponde desde hace.","nl":"Vraag bij «desde tres años» of het om een datum of duur gaat; bij duur past hier desde hace."},"tip":{"es":"Un punto es desde 2024; una medida es desde hace dos años; un hecho anterior es hace dos años.","nl":"Een punt is desde 2024; een maat desde hace dos años; een eerdere gebeurtenis hace dos años."},"task":{"es":"Creen una línea de tiempo de un personaje y expliquen qué continúa, qué ya terminó y qué todavía no ocurrió.","nl":"Laat een tijdlijn voor een personage maken: wat duurt voort, wat is voorbij en wat is nog niet gebeurd?"},"nl":{"es":"Geleden corresponde a hace; sinds puede ser desde o desde hace según vaya con fecha o duración.","nl":"Geleden wordt hace; sinds wordt desde of desde hace, afhankelijk van datum of duur."},"check":{"es":"Completa: «Trabajo aquí ... hace seis meses».","nl":"Vul aan: «Trabajo aquí ... hace seis meses»."},"answer":{"es":"Desde. La actividad empezó antes y continúa ahora.","nl":"Desde. De activiteit begon eerder en duurt nu voort."},"prereq":["F47","F58"],"exercises":[{"stem":"Vivo aquí ___ 2024. (desde / desde hace)","answers":["desde"],"why":{"es":"2024 es un punto de inicio, no una duración.","nl":"2024 is een beginpunt, geen duur."},"mode":"word","instruction":null,"id":"F59_1"},{"stem":"Vivo aquí ___ dos años. (desde / desde hace)","answers":["desde hace"],"why":{"es":"Dos años mide la duración de una situación que continúa.","nl":"Dos años meet de duur van een situatie die voortduurt."},"mode":"word","instruction":null,"id":"F59_2"}]},{"id":"F60","block":9,"p":[{"es":"Para puede indicar destinatario, finalidad o plazo: es para Ana, estudio para aprender, lo necesito para el viernes. Por puede expresar causa, intercambio, medio o recorrido: por el ruido, diez euros por el libro, por correo, por el parque.","nl":"Para kan ontvanger, doel of termijn aangeven: es para Ana, estudio para aprender, lo necesito para el viernes. Por kan reden, ruil, middel of route aangeven: por el ruido, diez euros por el libro, por correo, por el parque."},{"es":"No basta traducir «voor» ni memorizar por = causa y para = objetivo para todos los casos. Aprende usos con contexto: gracias por ayudar; una sala para trabajar. Algunas elecciones cambian el significado: trabajo por Ana puede indicar que la sustituyo; trabajo para Ana, que es destinataria de mi trabajo.","nl":"Voor vertalen of alleen reden tegenover doel onthouden is niet genoeg voor alle gevallen. Leer context: gracias por ayudar; una sala para trabajar. De keuze kan betekenis veranderen: trabajo por Ana kan betekenen dat ik haar vervang; trabajo para Ana dat ik voor haar werk."}],"ex":[{"es":"Envío las instrucciones por correo para preparar la visita. El mensaje es para los participantes.","nl":"Ik stuur de instructies per mail om het bezoek voor te bereiden. Het bericht is voor de deelnemers."},{"es":"Pasamos por la biblioteca para recoger un libro. Pagamos cinco euros por una copia especial.","nl":"We gaan langs de bibliotheek om een boek op te halen. We betalen vijf euro voor een speciale kopie."}],"refs":["nl_porpara","pcic"],"related":["F57","F61","F65"],"title":{"es":"Por y para en usos básicos","nl":"Por en para in basisgebruik"},"goal":{"es":"Expresar causa, recorrido, destinatario y finalidad.","nl":"Reden, route, ontvanger en doel aangeven."},"error":{"es":"Ante una elección dudosa pregunta qué relación se quiere expresar, no solo qué palabra neerlandesa aparece.","nl":"Vraag bij twijfel welke relatie bedoeld wordt, niet alleen welk Nederlands woord er staat."},"tip":{"es":"Relaciona para con destinatario o propósito cuando corresponda, y aprende por en grupos como por correo y gracias por.","nl":"Koppel para waar passend aan ontvanger of doel en leer por in combinaties zoals por correo en gracias por."},"task":{"es":"Organicen un envío: para quién es, para cuándo se necesita, por qué medio va y para qué se usa.","nl":"Laat een verzending regelen: voor wie, voor wanneer, via welk middel en met welk doel?"},"nl":{"es":"Voor y door no tienen una correspondencia fija con para y por. La función dentro del mensaje decide.","nl":"Voor en door komen niet vast overeen met para en por. De functie in de boodschap bepaalt de keuze."},"check":{"es":"Completa: «Este cuaderno es ... Ana», indicando destinataria.","nl":"Vul aan met Ana als ontvanger: «Este cuaderno es ... Ana»."},"answer":{"es":"Para. Indica a quién va destinado el cuaderno.","nl":"Para. Het geeft aan voor wie het schrift bestemd is."},"prereq":["F38","F57"],"exercises":[{"stem":"Este libro es ___ Marta. Es un regalo para ella. (por / para)","answers":["para"],"why":{"es":"Para indica la destinataria.","nl":"Para geeft de ontvanger aan."},"mode":"word","instruction":null,"id":"F60_1"},{"stem":"Envío el documento ___ correo electrónico. (por / para)","answers":["por"],"why":{"es":"Por introduce el medio de envío.","nl":"Por geeft het verzendmiddel aan."},"mode":"word","instruction":null,"id":"F60_2"}]},{"id":"F61","block":9,"p":[{"es":"Con expresa compañía o instrumento: con Ana, con un lápiz. Sin expresa ausencia: sin azúcar, sin ayuda. Con y sin también pueden formar grupos más largos: con mucho cuidado, sin hablar.","nl":"Con geeft gezelschap of een instrument aan: con Ana, con un lápiz. Sin geeft afwezigheid: sin azúcar, sin ayuda. Ook langere groepen zijn mogelijk: con mucho cuidado, sin hablar."},{"es":"De relaciona nombres: material, mesa de madera; contenido, vaso de agua; pertenencia, carpeta de Ana; tema, libro de historia. No se puede sustituir de siempre por una única traducción.","nl":"De verbindt naamwoorden: materiaal, mesa de madera; inhoud, vaso de agua; bezit, carpeta de Ana; onderwerp, libro de historia. De heeft niet één vaste vertaling."}],"ex":[{"es":"Preparamos el cartel con rotuladores y una hoja de papel. Trabajamos con otra pareja.","nl":"We maken de poster met stiften en een vel papier. We werken met een ander tweetal."},{"es":"Pido un café sin azúcar y un vaso de agua. La taza de cerámica está sobre la mesa.","nl":"Ik bestel koffie zonder suiker en een glas water. De keramische kop staat op tafel."}],"refs":["pcic","nociones"],"related":["F01","F55","F60"],"title":{"es":"Con, sin y de","nl":"Con, sin en de"},"goal":{"es":"Expresar compañía, instrumento, ausencia y material.","nl":"Gezelschap, middel, afwezigheid en materiaal uitdrukken."},"error":{"es":"En «un vaso agua», recupera la relación de contenido: un vaso de agua.","nl":"Herstel bij «un vaso agua» de inhoudsrelatie: un vaso de agua."},"tip":{"es":"Pregunta qué une la preposición: persona acompañante, instrumento, elemento ausente o relación entre nombres.","nl":"Vraag wat het voorzetsel verbindt: gezelschap, instrument, afwezig element of relatie tussen naamwoorden."},"task":{"es":"Una pareja hace un pedido con necesidades distintas, por ejemplo sin leche, y otra confirma ingredientes y recipientes.","nl":"Het ene tweetal bestelt met verschillende wensen, bijvoorbeeld zonder melk; het andere controleert ingrediënten en verpakkingen."},"nl":{"es":"Een glas water no lleva van; un vaso de agua sí necesita de.","nl":"Een glas water heeft geen van; un vaso de agua heeft wel de nodig."},"check":{"es":"Expresa el material de una mesa hecha de madera.","nl":"Geef het materiaal aan van een tafel van hout."},"answer":{"es":"Una mesa de madera. De introduce aquí el material.","nl":"Una mesa de madera. De introduceert hier het materiaal."},"prereq":["F01","F38"],"exercises":[{"stem":"Pido un café ___ azúcar porque no quiero azúcar. (con / sin)","answers":["sin"],"why":{"es":"Sin expresa ausencia.","nl":"Sin geeft afwezigheid aan."},"mode":"word","instruction":null,"id":"F61_1"},{"stem":"Necesitamos un litro ___ leche para la receta.","answers":["de"],"why":{"es":"De relaciona la medida con su contenido.","nl":"De verbindt de maat met de inhoud."},"mode":"word","instruction":null,"id":"F61_2"}]},{"id":"F62","block":9,"p":[{"es":"Bien y mal describen cómo se hace una acción: explica bien, duerme mal. Despacio indica poca velocidad; rápido puede usarse como adverbio: habla rápido. En estos usos no concuerdan: ellas hablan rápido.","nl":"Bien en mal beschrijven hoe iets gebeurt: explica bien, duerme mal. Despacio betekent langzaam; rápido kan bijwoord zijn: habla rápido. In deze gebruiken passen ze zich niet aan: ellas hablan rápido."},{"es":"Muchos adverbios se forman con la forma femenina del adjetivo + mente: clara → claramente, lenta → lentamente. Si no hay forma femenina distinta: fácil → fácilmente. Conservan la tilde del adjetivo. Bueno describe un nombre; bien suele describir una acción: una buena explicación, explica bien.","nl":"Veel bijwoorden krijgen de vrouwelijke vorm van het bijvoeglijk naamwoord + mente: clara → claramente, lenta → lentamente. Zonder aparte vrouwelijke vorm: fácil → fácilmente. Ze behouden het oorspronkelijke accent. Bueno beschrijft een naamwoord; bien meestal een handeling: una buena explicación, explica bien."}],"ex":[{"es":"La profesora habla despacio y explica claramente las instrucciones. El grupo la entiende bien.","nl":"De docent spreekt langzaam en legt de instructies duidelijk uit. De groep begrijpt haar goed."},{"es":"Hoy escribimos rápido porque tenemos poco tiempo. Después revisamos el texto cuidadosamente.","nl":"Vandaag schrijven we snel, want we hebben weinig tijd. Daarna bekijken we de tekst zorgvuldig."}],"refs":["bien","pcic","tilde"],"related":["F08","F11","A01"],"title":{"es":"Bien, mal, despacio, rápido y adverbios en mente","nl":"Bien, mal, despacio, rápido en bijwoorden op mente"},"goal":{"es":"Explicar cómo se hace algo.","nl":"Vertellen hoe iets gebeurt."},"error":{"es":"Ante «explica buena», pregunta si se describe una explicación o la manera de explicar.","nl":"Vraag bij «explica buena» of de uitleg of de manier van uitleggen beschreven wordt."},"tip":{"es":"Usa dos preguntas: ¿cómo es la explicación? y ¿cómo explica?","nl":"Gebruik twee vragen: ¿cómo es la explicación? en ¿cómo explica?."},"task":{"es":"Una persona da instrucciones a dos velocidades. La pareja indica cuándo entiende mejor y propone una mejora.","nl":"Laat iemand instructies op twee snelheden geven. De ander vertelt wanneer het duidelijker is en stelt een verbetering voor."},"nl":{"es":"Goed puede ser bueno o bien: een goede uitleg frente a goed uitleggen.","nl":"Goed kan bueno of bien zijn: een goede uitleg tegenover goed uitleggen."},"check":{"es":"Forma el adverbio de fácil.","nl":"Maak het bijwoord van fácil."},"answer":{"es":"Fácilmente. Conserva la tilde de fácil.","nl":"Fácilmente. Het behoudt het accent van fácil."},"prereq":["F08"],"exercises":[{"stem":"La profesora explica muy ___. (bien / bueno)","answers":["bien"],"why":{"es":"Bien describe cómo explica, no cómo es una cosa.","nl":"Bien beschrijft hoe zij uitlegt, niet hoe iets is."},"mode":"word","instruction":null,"id":"F62_1"},{"stem":"El grupo entiende las instrucciones ___. (fácil, adverbio en mente)","answers":["fácilmente"],"why":{"es":"Fácilmente conserva la tilde de fácil.","nl":"Fácilmente behoudt het accent van fácil."},"mode":"word","instruction":null,"id":"F62_2"}]},{"id":"F63","block":10,"p":[{"es":"Y añade información; o ofrece alternativas; pero marca contraste. Ni une elementos negativos: no tengo lápiz ni bolígrafo. También ni ... ni: no viene ni Ana ni Luis.","nl":"Y voegt informatie toe; o geeft alternatieven; pero geeft contrast. Ni verbindt ontkende delen: no tengo lápiz ni bolígrafo. Ook ni ... ni: no viene ni Ana ni Luis."},{"es":"Y cambia a e ante el sonido inicial i: español e inglés. No cambia ante el sonido de hielo: agua y hielo. O cambia a u ante el sonido o: siete u ocho. Decide el sonido, incluso con h muda: minutos u horas.","nl":"Y wordt e vóór een beginklank i: español e inglés. Niet vóór de beginklank van hielo: agua y hielo. O wordt u vóór de klank o: siete u ocho. De klank bepaalt de keuze, ook met een stille h: minutos u horas."}],"ex":[{"es":"El taller es corto, pero necesita preparación. Podemos hacerlo el martes o el jueves.","nl":"De workshop is kort, maar vraagt voorbereiding. Hij kan op dinsdag of donderdag."},{"es":"El grupo habla español e inglés. Necesitamos siete u ocho mesas y no tenemos ni sillas ni proyector.","nl":"De groep spreekt Spaans en Engels. We hebben zeven of acht tafels nodig en hebben stoelen noch projector."}],"refs":["y","o","pcic"],"related":["F23","F64","F65"],"title":{"es":"Y, e, o, u, ni y pero","nl":"Y, e, o, u, ni en pero"},"goal":{"es":"Añadir, ofrecer alternativas y contrastar.","nl":"Toevoegen, alternatieven geven en contrasteren."},"error":{"es":"Ante «agua e hielo», escucha el inicio de hielo: no empieza por una i vocálica independiente.","nl":"Luister bij «agua e hielo» naar het begin van hielo: het begint niet met een zelfstandige klinker i."},"tip":{"es":"Primero elige la relación; después revisa si el sonido exige e o u.","nl":"Kies eerst de relatie; controleer daarna of de klank e of u vraagt."},"task":{"es":"Dos equipos comparan recursos y horarios para acordar una actividad. Deben añadir información, ofrecer una alternativa y señalar un límite.","nl":"Laat teams materialen en tijden vergelijken. Ze voegen informatie toe, geven een alternatief en noemen een beperking."},"nl":{"es":"En y of no cambian por el sonido siguiente; y y o sí pueden cambiar.","nl":"En en of veranderen niet door de volgende klank; y en o soms wel."},"check":{"es":"Completa: «siete ... ocho participantes».","nl":"Vul aan: «siete ... ocho participantes»."},"answer":{"es":"U. Ocho empieza por el sonido o.","nl":"U. Ocho begint met de klank o."},"prereq":["F23"],"exercises":[{"stem":"En el taller usamos español ___ inglés. (y / e)","answers":["e"],"why":{"es":"Inglés empieza por el sonido vocálico i.","nl":"Inglés begint met de klinker i."},"mode":"word","instruction":null,"id":"F63_1"},{"stem":"Necesitamos siete ___ ocho mesas. (o / u)","answers":["u"],"why":{"es":"O cambia a u delante del sonido o.","nl":"O wordt u vóór de klank o."},"mode":"word","instruction":null,"id":"F63_2"}]},{"id":"F64","block":10,"p":[{"es":"Primero introduce el comienzo de una secuencia, luego y después indican pasos posteriores, al final presenta el último paso o resultado. Estas palabras orientan al lector; no sustituyen una relación temporal clara entre las acciones.","nl":"Primero geeft het begin van een reeks, luego en después volgende stappen, al final de laatste stap of uitkomst. Deze woorden helpen de lezer; de tijdsvolgorde moet ook inhoudelijk kloppen."},{"es":"Después puede usarse solo: después comemos. Para nombrar otra actividad: después de la clase, después de comer. Luego no necesita de en luego comemos.","nl":"Después kan alleen staan: después comemos. Met een genoemde activiteit: después de la clase, después de comer. Luego krijgt geen de in luego comemos."}],"ex":[{"es":"Primero leemos el anuncio. Después comparamos las opciones y al final elegimos una visita.","nl":"Eerst lezen we de aankondiging. Daarna vergelijken we opties en uiteindelijk kiezen we een bezoek."},{"es":"Llegué al centro y preparé la sala. Luego hablé con el grupo. Al final recogimos los materiales.","nl":"Ik kwam in het centrum en maakte de ruimte klaar. Daarna sprak ik de groep. Ten slotte ruimden we de materialen op."}],"refs":["pcic","funciones"],"related":["F58","F68"],"title":{"es":"Primero, luego, después y al final","nl":"Primero, luego, después en al final"},"goal":{"es":"Ordenar un proceso o un relato.","nl":"Een proces of verhaal ordenen."},"error":{"es":"Si cada frase empieza con después, pide señalar qué pasos se pueden agrupar y dónde termina el proceso.","nl":"Laat bij steeds después bekijken welke stappen samen kunnen en waar het proces eindigt."},"tip":{"es":"Usa tarjetas movibles de acciones y coloca conectores solo cuando la secuencia ya tenga sentido.","nl":"Gebruik verplaatsbare actiekaartjes en voeg verbindingswoorden pas toe als de volgorde logisch is."},"task":{"es":"Una pareja escribe instrucciones para otra. La segunda las ejecuta y marca dónde faltó una relación temporal.","nl":"Laat een tweetal instructies schrijven en een ander ze uitvoeren. Waar ontbreekt tijdsinformatie?"},"nl":{"es":"Eerst, daarna y uiteindelijk ayudan a entender la secuencia, pero después de requiere de ante un nombre o infinitivo.","nl":"Eerst, daarna en uiteindelijk helpen bij de volgorde, maar después de krijgt de vóór een naamwoord of infinitief."},"check":{"es":"Completa: «Después ... leer, comentamos el texto».","nl":"Vul aan: «Después ... leer, comentamos el texto»."},"answer":{"es":"De. Después de + infinitivo introduce la actividad anterior.","nl":"De. Después de + infinitief noemt de eerdere activiteit."},"prereq":["F38"],"exercises":[{"stem":"Primero leemos; ___ comparamos respuestas. (luego / antes)","answers":["luego"],"why":{"es":"Luego indica un paso posterior en esta secuencia.","nl":"Luego geeft hier een volgende stap."},"mode":"word","instruction":null,"id":"F64_1"},{"stem":"Después ___ la clase recogemos las sillas.","answers":["de"],"why":{"es":"Después de necesita de ante el nombre de la actividad.","nl":"Vóór de naam van de activiteit krijgt después de."},"mode":"word","instruction":null,"id":"F64_2"}]},{"id":"F65","block":10,"p":[{"es":"Porque introduce una causa: estudio porque me interesa. Por eso presenta una consecuencia: me interesa; por eso estudio. Entonces puede introducir una conclusión: no hay tren, entonces vamos en autobús.","nl":"Porque introduceert een reden: estudio porque me interesa. Por eso geeft een gevolg: me interesa; por eso estudio. Entonces kan een conclusie geven: no hay tren, entonces vamos en autobús."},{"es":"Para + infinitivo presenta finalidad: estudio para enseñar. Por qué pregunta por la causa; porque responde. Cambiar el conector puede cambiar la relación entre las frases.","nl":"Para + infinitief geeft een doel: estudio para enseñar. Por qué vraagt naar de reden; porque antwoordt. Een ander verbindingswoord kan de relatie veranderen."}],"ex":[{"es":"La sala está ocupada, por eso trabajamos en la biblioteca. Elegimos una mesa grande para compartir el material.","nl":"De ruimte is bezet, daarom werken we in de bibliotheek. We kiezen een grote tafel om het materiaal te delen."},{"es":"¿Por qué llegas temprano? Porque necesito preparar el proyector. Entonces podemos empezar a tiempo.","nl":"Waarom kom je vroeg? Omdat ik de projector moet klaarzetten. Dan kunnen we op tijd beginnen."}],"refs":["porque","pcic"],"related":["F24","F38","F60"],"title":{"es":"Porque, por eso, entonces y para","nl":"Porque, por eso, entonces en para"},"goal":{"es":"Explicar causas, consecuencias y objetivos.","nl":"Redenen, gevolgen en doelen uitleggen."},"error":{"es":"Si se confunden porque y por eso, pregunta cuál es la causa y cuál el resultado antes de corregir la forma.","nl":"Vraag bij verwarring tussen porque en por eso eerst wat reden en wat gevolg is."},"tip":{"es":"Reescribe el mismo hecho en dos órdenes: llueve, por eso entro / entro porque llueve.","nl":"Schrijf hetzelfde in twee volgordes: llueve, por eso entro / entro porque llueve."},"task":{"es":"Presenta un problema de aula. Cada pareja propone una decisión, explica su causa y nombra su objetivo.","nl":"Geef een klasprobleem. Elk tweetal stelt een besluit voor, legt de reden uit en noemt het doel."},"nl":{"es":"Omdat cambia el orden verbal neerlandés. Porque no obliga a colocar el verbo español al final.","nl":"Omdat verandert de Nederlandse woordvolgorde. Porque zet het Spaanse werkwoord niet verplicht achteraan."},"check":{"es":"Une la causa «hace frío» con el resultado «cierro la ventana», empezando por la causa.","nl":"Verbind «hace frío» met het gevolg «cierro la ventana», met de reden eerst."},"answer":{"es":"Hace frío, por eso cierro la ventana. También puede separarse con punto: hace frío. Por eso cierro la ventana.","nl":"Hace frío, por eso cierro la ventana. Ook mogelijk met een punt tussen de zinnen."},"prereq":["F38","F63"],"exercises":[{"stem":"Cierro la ventana ___ hace frío. (porque / por eso)","answers":["porque"],"why":{"es":"La segunda parte explica la causa.","nl":"Het tweede deel geeft de reden."},"mode":"word","instruction":null,"id":"F65_1"},{"stem":"Hace frío. ___ cierro la ventana. (Porque / Por eso)","answers":["por eso"],"why":{"es":"Por eso introduce el resultado de la causa anterior.","nl":"Por eso introduceert het gevolg van de genoemde reden."},"mode":"word","instruction":null,"id":"F65_2"}]},{"id":"F66","block":10,"p":[{"es":"Creo que y pienso que presentan una opinión; sé que presenta información como conocida. En las afirmaciones básicas de esta ficha usamos indicativo: creo que es útil, sé que viene. Que se escribe sin tilde y no lleva de en estas construcciones.","nl":"Creo que en pienso que geven een mening; sé que presenteert informatie als bekend. In de basisbevestigingen hier gebruiken we indicativo: creo que es útil, sé que viene. Que heeft geen accent en krijgt hier geen de ervoor."},{"es":"Después de que puede aparecer otro sujeto: pienso que Ana tiene razón. No basta añadir no al principio para mantener siempre la misma forma verbal; las opiniones negadas pueden requerir subjuntivo y quedan para una ampliación.","nl":"Na que kan een ander onderwerp komen: pienso que Ana tiene razón. Alleen no toevoegen behoudt niet altijd dezelfde werkwoordsvorm; ontkende meningen kunnen subjuntivo vragen en komen later."}],"ex":[{"es":"Creo que esta actividad es útil porque todos necesitan intercambiar información.","nl":"Ik denk dat deze activiteit nuttig is, want iedereen moet informatie uitwisselen."},{"es":"Sé que la biblioteca abre a las nueve. Pienso que podemos reunirnos allí a las diez.","nl":"Ik weet dat de bibliotheek om negen uur opent. Ik denk dat we daar om tien uur kunnen afspreken."}],"refs":["que_rel","pcic"],"related":["F65","F67"],"title":{"es":"Creo que, pienso que y sé que","nl":"Creo que, pienso que en sé que"},"goal":{"es":"Introducir una opinión o información.","nl":"Een mening of informatie introduceren."},"error":{"es":"Ante «pienso de que», pide comprobar el marco pienso que + información.","nl":"Laat bij «pienso de que» het kader pienso que + informatie controleren."},"tip":{"es":"Distingue cómo presenta el hablante su mensaje: como opinión o como conocimiento. No afirmes que sé garantiza la verdad.","nl":"Onderscheid hoe de spreker iets presenteert: als mening of kennis. Sé garandeert niet dat iets waar is."},"task":{"es":"Comparen dos actividades y elijan una usando creo que con una razón. Separan esa valoración de un dato conocido con sé que.","nl":"Laat twee activiteiten vergelijken en kiezen met creo que en een reden. Scheid dat oordeel van een bekend gegeven met sé que."},"nl":{"es":"Ik denk dat y ik weet dat llevan el verbo al final de la subordinada; en español conservamos normalmente sujeto + verbo.","nl":"Ik denk dat en ik weet dat hebben het werkwoord achteraan in de bijzin; het Spaans behoudt meestal onderwerp + werkwoord."},"check":{"es":"Introduce «la actividad es útil» con pienso.","nl":"Leid «la actividad es útil» in met pienso."},"answer":{"es":"Pienso que la actividad es útil. No añadimos de.","nl":"Pienso que la actividad es útil. Er komt geen de bij."},"prereq":["F21","F26"],"exercises":[{"stem":"Pienso ___ esta actividad es útil.","answers":["que"],"why":{"es":"Pienso que introduce una opinión, sin de.","nl":"Pienso que introduceert een mening, zonder de."},"mode":"word","instruction":null,"id":"F66_1"},{"stem":"Sé que Ana ___ los martes. (venir, presente)","answers":["viene"],"why":{"es":"En esta afirmación usamos indicativo.","nl":"In deze bevestiging gebruiken we indicativo."},"mode":"word","instruction":null,"id":"F66_2"}]},{"id":"F67","block":10,"p":[{"es":"Que puede unir un nombre a una frase que lo identifica: el libro que leo, la profesora que trabaja aquí. Sirve para personas y cosas, no cambia por género o número y no lleva tilde.","nl":"Que kan een naamwoord verbinden met een zin die het identificeert: el libro que leo, la profesora que trabaja aquí. Het kan bij personen en dingen, verandert niet naar geslacht of getal en krijgt geen accent."},{"es":"En «las personas que trabajan aquí», el verbo va en plural porque que se refiere a las personas. En «el libro que leo», yo es quien lee. No repetimos el objeto dentro de esta frase básica: el libro que leo, no el libro que lo leo.","nl":"In «las personas que trabajan aquí» staat het werkwoord in het meervoud, omdat que naar las personas verwijst. In «el libro que leo» leest yo. Herhaal het voorwerp in dit basismodel niet: el libro que leo, niet el libro que lo leo."}],"ex":[{"es":"Necesito la carpeta que está sobre la mesa. La carpeta que tiene Ana es de otro grupo.","nl":"Ik heb de map op tafel nodig. De map van Ana is van een andere groep."},{"es":"Los estudiantes que trabajan por la mañana vienen al taller de la tarde.","nl":"Studenten die 's ochtends werken komen naar de middagworkshop."}],"refs":["que_rel","pcic"],"related":["F08","F66"],"title":{"es":"Identificar con que","nl":"Identificeren met que"},"goal":{"es":"Añadir información para reconocer a alguien o algo.","nl":"Informatie toevoegen om iemand of iets te herkennen."},"error":{"es":"Ante «la profesora quien trabaja aquí», ofrece el relativo básico que con antecedente expreso en esta identificación sin comas.","nl":"Geef bij «la profesora quien trabaja aquí» het basismodel met que voor deze identificatie zonder komma's."},"tip":{"es":"Parte de dos frases y une la información repetida: hay una sala; la sala tiene proyector → una sala que tiene proyector.","nl":"Begin met twee zinnen en verbind herhaalde informatie: een ruimte; die heeft een projector → una sala que tiene proyector."},"task":{"es":"Una pareja tiene tres objetos parecidos y la otra identifica el necesario mediante una frase con que.","nl":"Laat bij drie vergelijkbare voorwerpen het juiste met een zin met que identificeren."},"nl":{"es":"Die y dat relativos pueden corresponder a que. No elijas una forma distinta de que por el género del nombre.","nl":"Betrekkelijk die en dat kunnen allebei que worden. Het geslacht vraagt geen andere vorm van que."},"check":{"es":"Une: «Busco un libro. El libro explica los pasados».","nl":"Verbind: «Busco un libro. El libro explica los pasados»."},"answer":{"es":"Busco un libro que explica los pasados. Que enlaza el nombre y su descripción.","nl":"Busco un libro que explica los pasados. Que verbindt het naamwoord en de beschrijving."},"prereq":["F21","F26"],"exercises":[{"stem":"Busco el libro ___ está sobre la mesa.","answers":["que"],"why":{"es":"Que identifica el libro mediante una descripción.","nl":"Que identificeert het boek met een beschrijving."},"mode":"word","instruction":null,"id":"F67_1"},{"stem":"Las personas que ___ aquí tienen una llave. (trabajar, presente)","answers":["trabajan"],"why":{"es":"Que se refiere a las personas, plural.","nl":"Que verwijst naar las personas, meervoud."},"mode":"word","instruction":null,"id":"F67_2"}]},{"id":"F68","block":10,"p":[{"es":"Cuando + presente puede expresar una situación habitual: cuando llego, preparo la sala. Desde que + indicativo señala un comienzo: desde que estudio aquí, practico más. Aquí trabajamos hechos y hábitos; las referencias futuras con cuando requieren otros usos que se estudian después.","nl":"Cuando + tegenwoordige tijd kan een gewoonte geven: cuando llego, preparo la sala. Desde que + indicativo geeft een begin: desde que estudio aquí, practico más. Hier gaat het om feiten en gewoonten; toekomstig cuando komt later met andere vormen."},{"es":"Antes de y después de llevan nombre o infinitivo: antes de clase, después de comer. En nuestros ejemplos con infinitivo, la misma persona realiza ambas acciones: me lavo las manos antes de cocinar.","nl":"Antes de en después de krijgen een naamwoord of infinitief: antes de clase, después de comer. In onze infinitiefvoorbeelden doet dezelfde persoon beide handelingen: me lavo las manos antes de cocinar."}],"ex":[{"es":"Cuando tengo clase por la mañana, preparo la mochila la noche anterior. Después de desayunar salgo de casa.","nl":"Als ik 's ochtends les heb, pak ik de avond ervoor mijn tas. Na het ontbijt vertrek ik."},{"es":"Desde que trabajo con este grupo, uso más imágenes. Antes de empezar, compruebo que todos entienden la tarea.","nl":"Sinds ik met deze groep werk, gebruik ik meer beelden. Voor ik begin, controleer ik of iedereen de taak begrijpt."}],"refs":["pcic","funciones"],"related":["F38","F58","F64"],"title":{"es":"Cuando, desde que, antes y después de","nl":"Cuando, desde que, antes en después de"},"goal":{"es":"Relacionar acciones en el tiempo.","nl":"Handelingen in de tijd verbinden."},"error":{"es":"Ante «después de como», distingue después de comer de después de que + frase, que no es el modelo de esta práctica.","nl":"Onderscheid bij «después de como» después de comer en después de que + bijzin; het laatste is hier niet het oefenmodel."},"tip":{"es":"Dibuja dos acciones y pide indicar cuál va antes y quién realiza cada una.","nl":"Teken twee handelingen en laat aanwijzen welke eerst komt en wie elke handeling doet."},"task":{"es":"Comparen rutinas de llegada a clase y formulen un proceso común con cuando, antes de y después de.","nl":"Laat aankomstroutines vergelijken en een gezamenlijke werkwijze met cuando, antes de en después de maken."},"nl":{"es":"Wanneer y toen pueden corresponder a cuando, pero el tiempo y el contexto determinan la construcción española.","nl":"Wanneer en toen kunnen cuando worden, maar tijd en context bepalen de Spaanse constructie."},"check":{"es":"Expresa una rutina con «cuando», «llego» y «abro la ventana».","nl":"Beschrijf een routine met «cuando», «llego» en «abro la ventana»."},"answer":{"es":"Cuando llego, abro la ventana. El presente expresa aquí una rutina.","nl":"Cuando llego, abro la ventana. De tegenwoordige tijd geeft hier een routine."},"prereq":["F26","F38"],"exercises":[{"stem":"Después de ___ reviso mis notas. (comer)","answers":["comer"],"why":{"es":"Después de lleva aquí infinitivo y la misma persona hace ambas acciones.","nl":"Hier volgt een infinitief; dezelfde persoon doet beide handelingen."},"mode":"word","instruction":null,"id":"F68_1"},{"stem":"Cuando ___ al centro, abro el aula. (yo, llegar, presente habitual)","answers":["llego"],"why":{"es":"El presente expresa una rutina.","nl":"De tegenwoordige tijd geeft een routine."},"mode":"word","instruction":null,"id":"F68_2"}]},{"id":"F69","block":10,"p":[{"es":"Si introduce una condición: si tengo tiempo, voy a la biblioteca. Aquí usamos presente de indicativo en la condición y presente o ir a + infinitivo en el resultado. Puede referirse a ahora, a un hábito o a una posibilidad futura.","nl":"Si introduceert een voorwaarde: si tengo tiempo, voy a la biblioteca. Hier gebruiken we de tegenwoordige indicativo in de voorwaarde en tegenwoordige tijd of ir a + infinitief in het gevolg. Het kan gaan om nu, een gewoonte of een toekomstige mogelijkheid."},{"es":"Si condicional no lleva tilde; sí afirmativo la lleva. Si la condición va primero, normalmente la separamos con coma. También puede ir después: voy a la biblioteca si tengo tiempo. No añadimos futuro simple después de este si.","nl":"Voorwaardelijk si heeft geen accent; bevestigend sí wel. Staat de voorwaarde vooraan, dan volgt meestal een komma. Achteraan kan ook: voy a la biblioteca si tengo tiempo. Na dit si komt geen eenvoudige
