const tr=(es,nl)=>lang==='es'?es:nl, t=o=>o[lang], esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const cardBy=id=>D.cards.find(c=>c.id===id), route=()=>location.hash.slice(1).split('/'), state=e=>{if(!states.has(e.id))states.set(e.id,{value:'',result:null});return states.get(e.id);};
const link=c=>`<a href="#${c.id}">${c.id} · ${esc(t(c.title))}</a>`;
function chrome(){document.documentElement.lang=lang;document.querySelector('.skip').textContent=tr('Ir al contenido','Naar de inhoud');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));sidebar.innerHTML=`<a href="#">${tr('← Índice general','← Alle onderwerpen')}</a><a href="#editar">${tr('Editar biblioteca','Bibliotheek bewerken')}</a><p class="nav-title">${tr('Explorar por bloque','Bladeren per blok')}</p><nav aria-label="${tr('Bloques','Blokken')}">${D.groups.map((g,i)=>`<a href="#bloque${i+1}" ${((cardBy(route()[0])?.block===i+1)||route()[0]==='bloque'+(i+1))?'aria-current="page"':''}>${String(i+1).padStart(2,'0')} · ${esc(t(g))}</a>`).join('')}</nav>`;document.querySelector('footer').textContent=tr('Lerarenopleiding Spaans · Biblioteca para docentes · A1 → B2','Lerarenopleiding Spaans · Kennisbibliotheek voor docenten · A1 → B2');}
function results(){const filtered=D.cards.filter(c=>(!group||c.block===Number(group))&&(!level||c.level===level)&&P.matches(c,query));document.querySelector('#result-count').textContent=tr(`${filtered.length} fichas encontradas`,`${filtered.length} onderwerpen gevonden`);document.querySelector('#results').innerHTML=filtered.length?D.groups.map((g,i)=>{const cards=filtered.filter(c=>c.block===i+1);return cards.length?`<section class="block"><h2><span class="block-number">${String(i+1).padStart(2,'0')}</span>${esc(t(g))}</h2><div class="cards">${cards.map(c=>`<a class="card-link" href="#${c.id}"><span class="code">${c.level} · ${c.id}</span><strong>${esc(t(c.title))}</strong><span class="goal">${esc(t(c.goal))}</span></a>`).join('')}</div></section>`:'';}).join(''):`<p class="empty">${tr('No hay coincidencias. Prueba otra palabra o elige todos los bloques.','Geen resultaten. Probeer een ander woord of kies alle blokken.')}</p>`;}
function home(){document.title='Biblioteca de gramática · Docentenbril';main.innerHTML=`<div class="eyebrow">${tr('Para docentes de ELE, en formación y en ejercicio','Voor docenten Spaans in opleiding en in de praktijk')}</div><h1 tabindex="-1">${tr('Biblioteca de gramática','Grammaticabibliotheek')}</h1><p class="lead">${tr('Consulta la gramática de A1 a B2 y prepara su enseñanza. Teoría, contrastes ES/NL, propuestas de aula y práctica con feedback.','Raadpleeg grammatica van A1 tot B2 en bereid je onderwijs voor. Uitleg, ES/NL-vergelijking, lesvoorstellen en oefeningen met feedback.')}</p><div class="searchbox"><label for="search">${tr('¿Qué quieres consultar?','Wat wil je opzoeken?')}</label><div class="searchrow"><input id="search" type="search" value="${esc(query)}" placeholder="${tr('ser o estar, gustar, pronombres, F32…','zijn, verleden tijd, voornaamwoorden, F32…')}"><button id="clear">${tr('Limpiar','Wissen')}</button></div><label class="meta" for="group">${tr('Bloque','Blok')}</label><select id="group"><option value="">${tr('Todos los bloques','Alle blokken')}</option>${D.groups.map((g,i)=>`<option value="${i+1}" ${group===String(i+1)?'selected':''}>${i+1}. ${esc(t(g))}</option>`).join('')}</select><label for="level">${tr('Nivel de entrada al tema','Instapniveau van het onderwerp')}</label><select id="level"><option value="">${tr('Todos los niveles','Alle niveaus')}</option>${['A1','A2','B1','B2','Apoyo'].map(l=>`<option value="${l}" ${level===l?'selected':''}>${l==='Apoyo'?tr('Apoyos transversales','Ondersteuning'):l}</option>`).join('')}</select></div><p id="result-count" class="count" role="status"></p><div class="quicklinks" aria-label="${tr('Consultas habituales','Vaak opgezocht')}">${['F31','F32','F37','F50','F53'].map(id=>link(cardBy(id))).join('')}</div><details class="orientation"><summary>${tr('Cómo usar esta biblioteca para preparar una clase','Deze bibliotheek gebruiken om een les voor te bereiden')}</summary><p>${tr('Empieza por la duda, no por el orden del índice. Lee la teoría y su alcance, compara los ejemplos y el contraste con el neerlandés. Después elige una propuesta de enseñanza. No necesitas utilizar las tres en la misma clase.','Begin bij je vraag, niet bij de volgorde van het overzicht. Lees de uitleg en de grenzen ervan, vergelijk de voorbeelden en het Nederlands. Kies daarna een lesvoorstel. Je hoeft ze niet alle drie in dezelfde les te gebruiken.')}</p><p>${tr('La etiqueta de nivel indica una entrada didáctica orientativa, con el PCIC como referencia; no asigna un nivel único a todos los usos de un fenómeno. El futuro docente necesita además comprender el porqué y tomar decisiones. La selección para el onderbouw depende del punto de partida, las horas de español y los objetivos de tu grupo; B1 y B2 requieren seleccionar tareas para grupos con esa base, también en bovenbouw. El material no equivale a un programa obligatorio para todo el VO.','Het niveau geeft een didactisch instappunt, met het PCIC als referentie; niet elk gebruik van een verschijnsel heeft hetzelfde niveau. Als toekomstige docent moet je ook het waarom begrijpen en keuzes maken. De selectie voor de onderbouw hangt af van voorkennis, lesuren Spaans en groepsdoelen; B1 en B2 vragen taken voor groepen met die basis, ook in de bovenbouw. Dit is geen verplicht programma voor het hele VO.')}</p><p>${tr('Las propuestas son diseños propios para adaptar y probar, no actividades cuya eficacia se haya medido en tu clase. Ajusta la ayuda según lo que observas, no solo según vmbo, havo o vwo. Utiliza situaciones ficticias cuando hablar de familia, cuerpo o experiencias pueda resultar incómodo.','De voorstellen zijn eigen ontwerpen om aan te passen en uit te proberen, geen activiteiten waarvan de werking in jouw klas al is gemeten. Pas steun aan op basis van wat je ziet, niet alleen op vmbo, havo of vwo. Gebruik fictieve situaties als familie, lichaam of ervaringen gevoelig kunnen liggen.')}</p><p>${tr('La estructura conecta objetivos, actividad y evidencia de aprendizaje, siguiendo los Ontwerpprincipes Lerarenopleiding Spaans 2026 aportados y la Visie van de Lerarenopleiding Spaans.','De structuur verbindt doelen, activiteit en zicht op leren, aansluitend bij de aangeleverde Ontwerpprincipes Lerarenopleiding Spaans 2026 en de Visie van de Lerarenopleiding Spaans.')}</p><a href="https://www.slo.nl/vakportalen/mvt/" target="_blank" rel="noopener noreferrer">${tr('SLO: contexto curricular de lenguas extranjeras','SLO: curriculumcontext moderne vreemde talen')}</a></details><div id="results"></div><details><summary>${tr('Sobre el recurso y sus fuentes','Over dit materiaal en de bronnen')}</summary><p>${tr('El recorrido reúne contenidos de A1 a B2, con el Plan curricular del Instituto Cervantes como referencia para el español. Es un recurso para futuros docentes, no una nueva norma de evaluación de Fontys. Los criterios adjuntos de Taal en ik sitúan LUK 1 en A1+; esta biblioteca permite profundizar hasta B2.','De bibliotheek bevat onderwerpen van A1 tot B2, met het Plan curricular van het Instituto Cervantes als referentie voor het Spaans. Dit is materiaal voor toekomstige docenten, geen nieuwe beoordelingsnorm van Fontys. De aangeleverde criteria van Taal en ik plaatsen LUK 1 op A1+; met deze bibliotheek kun je verder tot B2.')}</p><p>${tr('Las explicaciones son originales. Las fuentes normativas sirven para verificar la gramática; los recursos neerlandeses ayudan a contrastar las lenguas. Las propuestas de aula son propias. Cada ficha enlaza sus referencias. Las variantes regionales se explican cuando afectan al uso.','De uitleg is in eigen woorden geschreven. Normatieve bronnen helpen de grammatica te controleren; Nederlandstalige bronnen helpen bij taalvergelijking. De lesactiviteiten zijn eigen voorstellen. Elk onderwerp bevat bronverwijzingen. Regionale varianten worden toegelicht waar ze het gebruik beïnvloeden.')}</p><p>${tr('Las respuestas se conservan mientras esta página siga abierta. No se envían datos ni calificaciones a Canvas.','Je antwoorden blijven bewaard zolang deze pagina open blijft. Er worden geen gegevens of cijfers naar Canvas verstuurd.')}</p></details>`;results();document.querySelector('#search').addEventListener('input',e=>{query=e.target.value;results();});document.querySelector('#group').addEventListener('change',e=>{group=e.target.value;results();});document.querySelector('#level').addEventListener('change',e=>{level=e.target.value;results();});document.querySelector('#clear').onclick=()=>{query='';group='';level='';home();document.querySelector('#search').focus();};}
const section=(id,n,title,body,cls='')=>`<section class="sheet-section ${cls}" id="${id}"><h2><span class="num">${n}</span>${title}</h2>${body}</section>`;
function feedback(ex){const s=state(ex);if(!s.result)return '';let title={correct:tr('Correcto','Goed'),wrong:tr('Todavía no','Nog niet goed'),accent:tr('Revisa las tildes','Controleer de accenten'),empty:tr('Escribe una respuesta primero','Vul eerst een antwoord in'),revealed:tr('Respuesta consultada','Antwoord bekeken')}[s.result];return `<strong>${title}</strong>${s.result==='empty'?'':`<p>${tr('Respuesta','Antwoord')}: <span lang="es">${esc(ex.answers.join(' / '))}</span></p><p>${rich(t(ex.why))}</p>`}`;}
function updateFeedback(c){c.exercises.forEach(ex=>{const out=document.getElementById('feedback-'+ex.id);if(out){out.className='feedback '+(state(ex).result||'');out.innerHTML=feedback(ex);document.getElementById(ex.id).setAttribute('aria-invalid',String(['wrong','accent'].includes(state(ex).result)));}});const n=c.exercises.filter(e=>state(e).result==='correct').length;document.getElementById('score').textContent=tr(`${n} de ${c.exercises.length} respuestas correctas.`,`${n} van ${c.exercises.length} antwoorden goed.`);}
function check(c,ex){state(ex).result=P.grade(ex,state(ex).value);updateFeedback(c);}
function sheet(c){document.title=t(c.title)+' · Biblioteca ELE A1–B2';const labels=[tr('Teoría','Uitleg'),tr('Ejemplos','Voorbeelden'),'Docentenbril',tr('Propuestas de aula','Lesvoorstellen'),tr('Practicar','Oefenen')],ids=['teoria','ejemplos','docentenbril','aula','practica'];let theory=c.p.map((p,i)=>`<div class="theory-part"><h3>${i===0?tr('La idea central','De kern'):i===1?tr('Formas, usos y límites','Vormen, gebruik en grenzen'):tr('Un paso más','Een stap verder')}</h3><p>${rich(t(p))}</p></div>`).join('');theory+=`<details class="depth" open><summary>${tr('Profundizar: comprender el porqué','Verdieping: het waarom begrijpen')}</summary><p>${rich(t(B.depth(c)))}</p><p class="meta">${tr('Para conectar este punto con otros temas','Om dit punt met andere onderwerpen te verbinden')}: ${(c.related||[]).map(id=>cardBy(id)).filter(Boolean).map(link).join(', ')||c.prereq.map(id=>link(cardBy(id))).join(', ')||tr('Consulta el glosario','Bekijk de woordenlijst')}.</p></details>`;if(c.table)theory+=`<div class="table-wrap" role="region" tabindex="0" aria-label="${tr('Tabla de formas','Tabel met vormen')}"><table><thead><tr>${c.table[0].map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${c.table.slice(1).map(row=>`<tr>${row.map(x=>`<td lang="es">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const docNames={start:tr('Punto de partida','Startpunt'),error:tr('Anticipar errores','Fouten voor zijn'),tip:tr('Un truco para explicarlo','Een tip voor je uitleg'),nl:tr('Contraste con el neerlandés','Vergelijking met het Nederlands'),precision:tr('Precisión para el docente','Precisie voor de docent'),model:tr('Modelar la explicación','De uitleg voordoen'),adapt:tr('Adaptar la actividad','De activiteit aanpassen')};
const doc=Object.entries(docNames).filter(([key])=>c[key]).map(([key,title])=>`<div><h3>${title}</h3><p>${rich(t(c[key]))}</p></div>`).join('');
const exercises=`<p>${tr('Completa los huecos. Comprueba tu respuesta y lee la explicación. Las tildes cuentan.','Vul de ontbrekende woorden in. Controleer je antwoord en lees de uitleg. Accenten tellen mee.')}</p><p class="meta">${tr('Caracteres de ayuda: selecciona primero una casilla.','Hulptekens: selecteer eerst een antwoordveld.')}</p><div class="keyboard" aria-label="${tr('Caracteres españoles','Spaanse tekens')}">${Array.from('áéíóúüñ¿¡').map(ch=>`<button type="button" data-char="${ch}" aria-label="${tr('Insertar','Invoegen')} ${ch}">${ch}</button>`).join('')}</div>${c.exercises.map((ex,i)=>`<form class="exercise" data-ex="${ex.id}"><p class="instruction">${i+1}. ${ex.instruction?esc(t(ex.instruction)):tr('Completa con la palabra o las palabras necesarias.','Vul het juiste woord of de juiste woorden in.')}</p><label for="${ex.id}" lang="es">${esc(ex.stem)}</label><div class="answer-row"><input id="${ex.id}" name="answer" lang="es" aria-describedby="feedback-${ex.id}" value="${esc(state(ex).value)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit">${tr('Comprobar','Controleren')}</button></div><div id="feedback-${ex.id}" class="feedback" aria-live="polite"></div></form>`).join('')}<div class="actions"><button class="primary" id="check-all">${tr('Comprobar todo','Alles controleren')}</button><button id="reset">${tr('Volver a intentar','Opnieuw proberen')}</button><button id="reveal">${tr('Ver soluciones','Antwoorden bekijken')}</button></div><p class="score" id="score" role="status"></p><p class="meta">${tr('Práctica personal. Las respuestas consultadas no suman aciertos. Al cerrar o recargar la página se borran los intentos.','Persoonlijke oefening. Bekeken antwoorden tellen niet als goed. Als je de pagina sluit of vernieuwt, worden je pogingen gewist.')}</p>`;
const activities=B.activities(c).map((a,i)=>`<details class="lesson" ${i===0?'open':''}><summary><span class="lesson-index">0${i+1}</span><span>${esc(t(a.title))}<small>${a.time} · ${esc(t(a.mode))}</small></span><span class="expand" aria-hidden="true">+</span></summary><div class="lesson-body"><h3>${tr('Objetivo observable','Zichtbaar leerdoel')}</h3><p>${rich(t(a.goal))}</p><h3>${tr('Preparación y materiales','Voorbereiding en materiaal')}</h3><p>${rich(t(a.materials))}</p>${a.samples?a.samples.map(ex=>`<blockquote><p lang="es">${rich(ex.es)}</p>${lang==='nl'?`<p lang="nl" class="translation">${rich(ex.nl)}</p>`:''}</blockquote>`).join(''):''}${a.focus?`<p class="focus-note">${rich(t(a.focus))}</p>`:''}<h3>${tr('Desarrollo','Uitvoering')}</h3>${a.steps.map((p,j)=>`<p class="lesson-step"><span>${j+1}</span>${rich(t(p))}</p>`).join('')}<div class="differentiation"><div><h3>${tr('Más apoyo','Meer steun')}</h3><p>${rich(t(a.support))}</p></div><div><h3>${tr('Más reto','Meer uitdaging')}</h3><p>${rich(t(a.stretch))}</p></div></div><h3>${tr('Qué observar y cómo responder','Wat je observeert en hoe je reageert')}</h3><p>${rich(t(a.evidence))}</p></div></details>`).join('');
const pos=D.cards.indexOf(c);main.innerHTML=`<div class="breadcrumb"><a href="#">${tr('Índice','Overzicht')}</a> / ${esc(t(D.groups[c.block-1]))}</div><p class="eyebrow" style="margin-top:24px">${c.level} · ${c.id}</p><h1 tabindex="-1">${esc(t(c.title))}</h1><p class="lead">${esc(t(c.goal))}</p>${c.prereq.length?`<p class="meta">${tr('Antes de empezar','Voorkennis')}: ${c.prereq.map(id=>link(cardBy(id))).join(', ')}</p>`:''}<nav class="section-nav" aria-label="${tr('En esta ficha','In dit onderwerp')}">${labels.map((label,i)=>`<a href="#${c.id}/${ids[i]}">${i+1}. ${label}</a>`).join('')}</nav>${section('teoria',1,labels[0],theory)}${section('ejemplos',2,labels[1],c.ex.map(ex=>`<article><p lang="es">${rich(ex.es)}</p>${lang==='nl'?`<p class="translation" lang="nl">${rich(ex.nl)}</p>`:''}</article>`).join(''),'examples')}${section('docentenbril',3,'Docentenbril',`<div class="teacher-grid">${doc}</div><details><summary>${tr('Comprueba tu explicación como docente','Controleer je uitleg als docent')}</summary><p>${rich(t(c.check))}</p><details><summary>${tr('Ver una respuesta posible','Een mogelijk antwoord bekijken')}</summary><p>${rich(t(c.answer))}</p></details></details>`,'teacher')}${section('aula',4,labels[3],`<p>${tr('Propuestas para enseñar este tema. Elige según el nivel real del grupo, el objetivo y los apoyos necesarios. B1 y B2 no se proponen automáticamente para principiantes del onderbouw. Los tiempos son orientativos.','Lesvoorstellen bij dit onderwerp. Kies op basis van taalniveau, doel en benodigde steun. B1 en B2 zijn niet automatisch bedoeld voor beginnende leerlingen in de onderbouw. De tijden zijn indicaties.')}</p><p class="context-label">${esc(t(B.context(c)))}</p>${activities}`,'classroom')}${section('practica',5,labels[4],exercises)}<details class="sources"><summary>${tr('Fuentes de esta ficha','Bronnen bij dit onderwerp')}</summary><p class="meta">${tr('Referencias de la teoría. Las propuestas didácticas son de elaboración propia. Se abren en otra pestaña.','Bronnen voor de uitleg. De lesvoorstellen zijn eigen ontwerpen. Links openen in een nieuw tabblad.')}</p>${[...new Set(c.refs)].map(key=>D.sources[key]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`).join('')}</details><nav class="adjacent" aria-label="${tr('Fichas contiguas','Vorige en volgende onderwerpen')}">${pos>0?link(D.cards[pos-1]):'<span></span>'}${pos<D.cards.length-1?link(D.cards[pos+1]):''}</nav>`;
main.querySelectorAll('.exercise').forEach(form=>{const ex=c.exercises.find(e=>e.id===form.dataset.ex),input=form.querySelector('input');input.addEventListener('focus',()=>{lastInput=input;});input.addEventListener('input',()=>{state(ex).value=input.value;state(ex).result=null;updateFeedback(c);});form.addEventListener('submit',ev=>{ev.preventDefault();check(c,ex);});});main.querySelectorAll('[data-char]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.onclick=()=>{if(!lastInput||!main.contains(lastInput))lastInput=main.querySelector('.exercise input');const start=lastInput.selectionStart??lastInput.value.length,end=lastInput.selectionEnd??start;lastInput.setRangeText(b.dataset.char,start,end,'end');lastInput.dispatchEvent(new Event('input',{bubbles:true}));lastInput.focus();};});document.getElementById('check-all').onclick=()=>{c.exercises.forEach(ex=>{state(ex).result=P.grade(ex,state(ex).value);});updateFeedback(c);};document.getElementById('reset').onclick=()=>{c.exercises.forEach(ex=>{states.delete(ex.id);});sheet(c);document.getElementById(c.exercises[0].id).focus();};document.getElementById('reveal').onclick=()=>{c.exercises.forEach(ex=>{if(state(ex).result!=='correct')state(ex).result='revealed';});updateFeedback(c);};updateFeedback(c);}
function render(move=true){if(route()[0]!=='editar'){try{window.LibraryEditor.beforeLeave();}catch(e){alert(e.message);location.hash='editar';return;}}chrome();const [id,sectionId]=route();if(id==='editar'){window.LibraryEditor.render(main,lang);}else if(!id||(/^bloque\d+$/.test(id)&&Number(id.slice(6))<=D.groups.length)){group=id?id.slice(6):'';home();}else{const c=cardBy(id);if(c)sheet(c);else{main.innerHTML=`<h1 tabindex="-1">${tr('Ficha no encontrada','Onderwerp niet gevonden')}</h1><p><a href="#">${tr('Volver al índice','Terug naar het overzicht')}</a></p>`;}}if(move)requestAnimationFrame(()=>{const target=['teoria','ejemplos','docentenbril','aula','practica'].includes(sectionId)?document.getElementById(sectionId):main.querySelector('h1');if(target){target.scrollIntoView({block:'start'});if(target.tagName==='H1')target.focus({preventScroll:true});}});}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'});});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const y=window.scrollY;lang=b.dataset.lang;try{localStorage.setItem('gramatica-language',lang);}catch(_){}render(false);window.scrollTo(0,y);});window.addEventListener('hashchange',()=>render());render(false);
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{document.modelContext.registerTool({name:'check_grammar_practice',title:'Check grammar practice',description:'Submit answers to the practice exercises of a grammar card and display feedback.',inputSchema:{type:'object',properties:{card_id:{type:'string'},answers:{type:'array',items:{type:'string'}}},required:['card_id','answers'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async input=>{const c=cardBy(input.card_id);if(!c||!Array.isArray(input.answers)||input.answers.length!==c.exercises.length||input.answers.some(v=>typeof v!=='string'))throw new Error('Provide one answer per exercise in a valid card.');c.exercises.forEach((ex,i)=>{state(ex).value=input.answers[i];state(ex).result=P.grade(ex,input.answers[i]);});location.hash=c.id+'/practica';render();return {content:[{type:'text',text:JSON.stringify(c.exercises.map(ex=>({exercise:ex.id,result:state(ex).result,feedback:t(ex.why)})))}]};}},{signal:lifecycle.signal});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}catch(_){} }
})();
</script></body></html>
