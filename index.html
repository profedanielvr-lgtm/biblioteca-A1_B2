tps://www.rae.es/dpd/venir","kind":"norma","checked":"2026-09-11"},"voseo":{"title":"RAE / ASALE · DPD · voseo","url":"https://www.rae.es/dpd/voseo","kind":"norma","checked":"2026-09-11"},"y":{"title":"RAE / ASALE · DPD · y","url":"https://www.rae.es/dpd/y","kind":"norma","checked":"2026-09-11"},"perfecto":{"title":"RAE / ASALE · GTG · pretérito perfecto compuesto","url":"https://www.rae.es/gtg/pret%C3%A9rito-perfecto-compuesto-de-indicativo","kind":"norma","checked":"2026-09-11"},"indefinido":{"title":"RAE / ASALE · GTG · pretérito perfecto simple","url":"https://www.rae.es/gtg/pret%C3%A9rito-perfecto-simple","kind":"norma","checked":"2026-09-11"},"imperfecto":{"title":"RAE / ASALE · GTG · pretérito imperfecto","url":"https://www.rae.es/gtg/pret%C3%A9rito-imperfecto-de-indicativo","kind":"norma","checked":"2026-09-11"},"gtg_sujeto":{"title":"RAE / ASALE · GTG · sujeto","url":"https://www.rae.es/gtg/sujeto","kind":"norma","checked":"2026-09-11"},"pcic":{"title":"Instituto Cervantes · Gramática A1 y A2","url":"https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/02_gramatica_inventario_a1-a2.htm","kind":"ele","checked":"2026-09-11"},"funciones":{"title":"Instituto Cervantes · Funciones A1 y A2","url":"https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/05_funciones_inventario_a1-a2.htm","kind":"ele","checked":"2026-09-11"},"nociones":{"title":"Instituto Cervantes · Nociones generales A1 y A2","url":"https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/08_nociones_generales_inventario_a1-a2.htm","kind":"ele","checked":"2026-09-11"},"ortografia":{"title":"Instituto Cervantes · Ortografía A1 y A2","url":"https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/04_ortografia_inventario_a1-a2.htm","kind":"ele","checked":"2026-09-11"},"nl_genero":{"title":"Espaans · Mannelijk en vrouwelijk","url":"https://www.espaans.nl/spaans-leren/mannelijk-en-vrouwelijk","kind":"nl","checked":"2026-09-11"},"nl_plural":{"title":"Espaans · Enkelvoud en meervoud","url":"https://www.espaans.nl/spaans-leren/enkelvoud-en-meervoud","kind":"nl","checked":"2026-09-11"},"nl_preguntas":{"title":"Espaans · Vraagwoorden","url":"https://www.espaans.nl/spaans-leren/vraagwoorden","kind":"nl","checked":"2026-09-11"},"nl_negacion":{"title":"Espaans · Ontkenningen","url":"https://www.espaans.nl/spaans-leren/ontkenningen","kind":"nl","checked":"2026-09-11"},"nl_obligacion":{"title":"Espaans · Tener que, hay que, deber","url":"https://www.espaans.nl/spaans-leren/tener-que-hay-que-deber","kind":"nl","checked":"2026-09-11"},"nl_porpara":{"title":"Espaans · Por en para","url":"https://www.espaans.nl/spaans-leren/por-para","kind":"nl","checked":"2026-09-11"},"nl_serestar":{"title":"Espaans · Ser, estar en hay","url":"https://www.espaans.nl/spaans-leren/ser-estar-hay","kind":"nl","checked":"2026-09-11"},"nl_andar":{"title":"Espaans · andar","url":"https://www.espaans.nl/andar","kind":"nl","checked":"2026-09-11"},"nl_estar":{"title":"Espaans · estar","url":"https://www.espaans.nl/estar","kind":"nl","checked":"2026-09-11"},"nl_comparacion":{"title":"Overal Spaans · Vergelijkingen","url":"https://www.overalspaans.nl/blog/vergelijkingen-maken-in-het-spaans","kind":"nl","checked":"2026-09-11"},"nl_ordinales":{"title":"Overal Spaans · Rangtelwoorden","url":"https://www.overalspaans.nl/blog/rangtelwoorden-in-het-spaans","kind":"nl","checked":"2026-09-11"},"nl_indefinidos":{"title":"Overal Spaans · Onbepaalde voornaamwoorden","url":"https://www.overalspaans.nl/blog/onbepaalde-voornaamwoorden-spaans","kind":"nl","checked":"2026-09-11"},"gustar":{"title":"RAE / ASALE · DPD · concordancia","url":"https://www.rae.es/dpd/concordancia","kind":"norma","checked":"2026-09-11"}},"cards":[{"id":"F01","block":1,"p":[{"es":"Un nombre común señala una clase: ciudad, profesora, café. Un nombre propio identifica: Utrecht, Ana. Los nombres propios llevan mayúscula.","nl":"Een soortnaam noemt een soort: ciudad, profesora, café. Een eigennaam identificeert: Utrecht, Ana. Eigennamen krijgen een hoofdletter."},{"es":"Podemos contar libros: un libro, dos libros. Para cantidades de agua usamos medidas: un vaso de agua. A veces cambia la forma de entender la palabra: dos cafés significa dos tazas o pedidos de café.","nl":"Boeken kun je tellen: un libro, dos libros. Bij water gebruik je een maat: un vaso de agua. De betekenis kan veranderen: dos cafés betekent twee kopjes of bestellingen koffie."}],"ex":[{"es":"En la biblioteca de Utrecht hay libros de cocina. Ana busca uno para preparar la cena.","nl":"In de bibliotheek van Utrecht staan kookboeken. Ana zoekt er een om het avondeten te bereiden."},{"es":"Para la reunión necesitamos agua y seis vasos. En la cafetería pedimos dos cafés.","nl":"Voor de vergadering hebben we water en zes glazen nodig. In het café bestellen we twee koffie."}],"refs":["pcic","genero"],"related":["F03","F17"],"title":{"es":"Nombres y tipos de sustantivos","nl":"Namen en soorten zelfstandige naamwoorden"},"goal":{"es":"Nombrar personas, lugares y cosas, y expresar cantidades.","nl":"Personen, plaatsen en dingen benoemen en hoeveelheden uitdrukken."},"error":{"es":"Si aparece «dos aguas», pregunta por el contexto: puede ser un pedido de dos botellas, no necesariamente un error.","nl":"Vraag bij «dos aguas» naar de context: het kan een bestelling van twee flesjes zijn en hoeft geen fout te zijn."},"tip":{"es":"Usa la imagen de una cesta con objetos y otra con recipientes. Contamos objetos o unidades de una sustancia.","nl":"Gebruik een mand met voorwerpen en een mand met verpakkingen. We tellen voorwerpen of eenheden van een stof."},"task":{"es":"En parejas, preparen una compra para cuatro personas. Una persona propone productos y la otra pregunta cuánto o cuántos.","nl":"Laat tweetallen boodschappen voor vier personen plannen. De een stelt producten voor, de ander vraagt cuánto of cuántos."},"nl":{"es":"El neerlandés también distingue boek y water. La traducción no decide siempre si una palabra se cuenta.","nl":"Ook het Nederlands onderscheidt boek en water. De vertaling bepaalt niet altijd of een woord telbaar is."},"check":{"es":"¿Cómo pides pan para tres personas sin contar «panes»?","nl":"Hoe vraag je om brood voor drie personen zonder «panes» te tellen?"},"answer":{"es":"Una posibilidad: «Necesitamos seis rebanadas de pan». La unidad hace clara la cantidad.","nl":"Bijvoorbeeld: «Necesitamos seis rebanadas de pan». De eenheid maakt de hoeveelheid duidelijk."},"prereq":[],"exercises":[{"stem":"Para la reunión necesitamos dos vasos ___ agua.","answers":["de"],"why":{"es":"Contamos vasos y expresamos su contenido con de.","nl":"We tellen glazen en geven de inhoud aan met de."},"mode":"word","instruction":null,"id":"F01_1"},{"stem":"En la cafetería pido dos ___, uno para Ana y otro para mí. (café)","answers":["cafés"],"why":{"es":"Aquí contamos dos consumiciones, no la sustancia sin medida.","nl":"Hier tellen we twee consumpties, niet de stof zonder maat."},"mode":"word","instruction":null,"id":"F01_2"}]},{"id":"F02","block":1,"p":[{"es":"Los sustantivos son masculinos o femeninos. Muchas palabras en o son masculinas y muchas en a, femeninas. Es una ayuda, no una regla completa: el día, el problema, la mano, la foto. Aprende cada palabra con su artículo.","nl":"Zelfstandige naamwoorden zijn mannelijk of vrouwelijk. Veel woorden op o zijn mannelijk en veel op a vrouwelijk. Dat helpt, maar geldt niet altijd: el día, el problema, la mano, la foto. Leer het lidwoord erbij."},{"es":"En nombres de persona puede cambiar la forma: profesor, profesora. Otros mantienen la misma palabra: el estudiante, la estudiante. Persona siempre es femenino: Luis es una persona simpática.","nl":"Bij personen kan de vorm veranderen: profesor, profesora. Andere woorden blijven gelijk: el estudiante, la estudiante. Persona is altijd vrouwelijk: Luis es una persona simpática."}],"ex":[{"es":"Mi hermana es profesora. Su pareja también trabaja en el colegio, como estudiante en prácticas.","nl":"Mijn zus is docent. Haar partner werkt ook op school, als stagiair."},{"es":"Tenemos un problema con la puerta. Marta nos ayuda; es una persona muy práctica.","nl":"We hebben een probleem met de deur. Marta helpt ons; ze is een praktisch persoon."}],"refs":["genero","nl_genero","pcic"],"related":["F08","F06"],"title":{"es":"Género del sustantivo","nl":"Geslacht van het zelfstandig naamwoord"},"goal":{"es":"Elegir el género y reconocer excepciones frecuentes.","nl":"Het geslacht kiezen en veelvoorkomende uitzonderingen herkennen."},"error":{"es":"Ante «la problema», pide recuperar el grupo completo «el problema» y ajustar las palabras que lo acompañan.","nl":"Laat bij «la problema» de hele combinatie «el problema» ophalen en de bijbehorende woorden aanpassen."},"tip":{"es":"Guarda vocabulario en parejas de artículo y nombre, con un ejemplo, sin asociar colores a estereotipos de personas.","nl":"Bewaar woordenschat als lidwoord plus naamwoord, met een voorbeeld, zonder kleuren aan stereotypen over personen te koppelen."},"task":{"es":"Repartan tarjetas de objetos para organizar una exposición. Cada pareja escribe etiquetas con artículo y una descripción.","nl":"Geef kaartjes met voorwerpen voor een tentoonstelling. Tweetallen schrijven etiketten met een lidwoord en beschrijving."},"nl":{"es":"De y het no corresponden a masculino y femenino: de tafel es la mesa, de stoel es el asiento.","nl":"De en het komen niet overeen met mannelijk en vrouwelijk: de tafel is la mesa, de stoel is el asiento."},"check":{"es":"¿Qué forma necesitas en «Luis es una persona muy simpático/simpática»?","nl":"Welke vorm past in «Luis es una persona muy simpático/simpática»?"},"answer":{"es":"Simpática, porque acompaña al nombre femenino persona.","nl":"Simpática, omdat het bij het vrouwelijke woord persona hoort."},"prereq":["F01"],"exercises":[{"stem":"Necesito ___ mano para mover esta mesa. (un / una)","answers":["una"],"why":{"es":"Mano es femenino, aunque termine en o.","nl":"Mano is vrouwelijk, ook al eindigt het op o."},"mode":"word","instruction":null,"id":"F02_1"},{"stem":"Hoy tenemos ___ problema con la impresora. (un / una)","answers":["un"],"why":{"es":"Problema es masculino. Aprende el problema como grupo.","nl":"Problema is mannelijk. Leer el problema als combinatie."},"mode":"word","instruction":null,"id":"F02_2"}]},{"id":"F03","block":1,"p":[{"es":"Normalmente añadimos s tras vocal sin acento fuerte: mesa, mesas. Tras muchas consonantes añadimos es: profesor, profesores. Si termina en z, escribimos ces: luz, luces. Hay palabras que no cambian: el lunes, los lunes.","nl":"Meestal komt er s na een onbeklemtoonde klinker: mesa, mesas. Na veel medeklinkers komt es: profesor, profesores. Een z wordt ces: luz, luces. Sommige woorden blijven gelijk: el lunes, los lunes."},{"es":"También cambian artículo y adjetivo: una luz azul, unas luces azules. Revisa las tildes: joven, jóvenes; canción, canciones. Café forma cafés. Para otras terminaciones poco frecuentes, consulta un diccionario.","nl":"Ook lidwoord en bijvoeglijk naamwoord veranderen: una luz azul, unas luces azules. Controleer de accenten: joven, jóvenes; canción, canciones. Café wordt cafés. Zoek minder gewone uitgangen op."}],"ex":[{"es":"Para el taller tenemos una mesa grande, pero necesitamos tres mesas grandes.","nl":"Voor de workshop hebben we één grote tafel, maar we hebben er drie nodig."},{"es":"El lunes trabajo en casa. Los otros días voy al centro y enciendo las luces de mi despacho.","nl":"Op maandag werk ik thuis. De andere dagen ga ik naar het centrum en doe ik de lampen in mijn kantoor aan."}],"refs":["plural","nl_plural","pcic"],"related":["F08","A01"],"title":{"es":"Singular y plural","nl":"Enkelvoud en meervoud"},"goal":{"es":"Pasar de una cosa a varias y mantener la concordancia.","nl":"Van één naar meer gaan en woorden bij elkaar laten passen."},"error":{"es":"En «los estudiante nuevo», haz que el alumno busque todas las palabras del grupo, no solo el nombre.","nl":"Laat bij «los estudiante nuevo» alle woorden van de woordgroep zoeken, niet alleen het naamwoord."},"tip":{"es":"Piensa en una cadena: artículo, nombre y adjetivo comparten el número.","nl":"Denk aan een ketting: lidwoord, naamwoord en bijvoeglijk naamwoord delen het getal."},"task":{"es":"Una pareja prepara una lista para una clase de una persona y otra la adapta para seis. Comparan qué cantidades cambian.","nl":"Een tweetal maakt een materialenlijst voor één cursist; een ander past die aan voor zes. Ze vergelijken de hoeveelheden."},"nl":{"es":"El plural neerlandés suele llevar en o s. No traslades en al español. El adjetivo español también puede marcar plural.","nl":"Het Nederlandse meervoud krijgt vaak en of s. Neem en niet over in het Spaans. Ook het Spaanse bijvoeglijk naamwoord kan meervoud aangeven."},"check":{"es":"Transforma «una canción fácil» para hablar de dos.","nl":"Verander «una canción fácil» zodat het over twee gaat."},"answer":{"es":"Dos canciones fáciles. Cambia el número y revisa las tildes.","nl":"Dos canciones fáciles. Het getal verandert; controleer ook de accenten."},"prereq":["F02"],"exercises":[{"stem":"Para el taller hacen falta tres ___. (lápiz)","answers":["lápices"],"why":{"es":"Z cambia a c en lápices y aparece la tilde.","nl":"Z wordt c in lápices; ook het accent is nodig."},"mode":"word","instruction":null,"id":"F03_1"},{"stem":"Tenemos clase todos los ___. (lunes)","answers":["lunes"],"why":{"es":"Lunes mantiene la misma forma en singular y plural.","nl":"Lunes blijft gelijk in enkelvoud en meervoud."},"mode":"word","instruction":null,"id":"F03_2"}]},{"id":"F04","block":1,"p":[{"es":"Usamos un, una, unos, unas para presentar algo o alguien: una vecina. El, la, los, las ayudan a identificar: la vecina del tercero. Algo puede ser identificable por la situación, aunque no se haya mencionado antes: cierra la puerta.","nl":"Met un, una, unos, unas introduceer je iets of iemand: una vecina. El, la, los, las helpen herkennen: la vecina del tercero. De situatie kan al duidelijk maken wat je bedoelt: cierra la puerta."},{"es":"El artículo concuerda con el nombre: un cuaderno, unas carpetas. Unos también puede indicar una cantidad aproximada: unos veinte minutos.","nl":"Het lidwoord past bij het naamwoord: un cuaderno, unas carpetas. Unos kan ook een benadering aangeven: unos veinte minutos."}],"ex":[{"es":"En el tren conozco a una profesora. La profesora trabaja en una escuela cerca de mi casa.","nl":"In de trein ontmoet ik een docent. Die docent werkt op een school vlak bij mijn huis."},{"es":"Entramos en el aula. La ventana está abierta y hay unas carpetas sobre la mesa.","nl":"We komen het lokaal binnen. Het raam staat open en er liggen enkele mappen op tafel."}],"refs":["el","pcic"],"related":["F05","F32"],"title":{"es":"Artículos definidos e indefinidos","nl":"Bepaalde en onbepaalde lidwoorden"},"goal":{"es":"Presentar algo y ayudar a identificarlo.","nl":"Iets introduceren en helpen herkennen."},"error":{"es":"Evita la regla absoluta «primera mención = un». Pregunta si el interlocutor puede identificar la cosa por el contexto.","nl":"Vermijd de absolute regel «eerste keer = un». Vraag of de ander uit de context kan herkennen wat bedoeld wordt."},"tip":{"es":"Un presenta una tarjeta nueva; el señala una tarjeta que podemos reconocer.","nl":"Un introduceert een nieuwe kaart; el wijst een kaart aan die we kunnen herkennen."},"task":{"es":"Una persona describe un objeto perdido. La otra dispone de tres objetos parecidos y debe identificar el correcto con preguntas.","nl":"De een beschrijft een verloren voorwerp. De ander heeft drie vergelijkbare voorwerpen en zoekt met vragen het juiste."},"nl":{"es":"Een ayuda a entender un/una. De/het no indican el género español y sus usos no coinciden siempre con el/la.","nl":"Een helpt bij un/una. De/het geven het Spaanse geslacht niet aan en worden niet altijd zoals el/la gebruikt."},"check":{"es":"Al entrar en una casa, ¿por qué puede decirse «¿Dónde está el baño?»?","nl":"Waarom kan iemand bij binnenkomst zeggen: «¿Dónde está el baño?»?"},"answer":{"es":"La situación permite identificar el baño de esa casa; no hace falta mencionarlo antes.","nl":"De situatie maakt duidelijk dat het om de badkamer van dat huis gaat; vooraf noemen is niet nodig."},"prereq":["F02","F03"],"exercises":[{"stem":"Conozco a ___ profesora nueva; todavía no sé su nombre. (un / una)","answers":["una"],"why":{"es":"Presentamos una persona con nombre femenino: una profesora.","nl":"We introduceren iemand met een vrouwelijk naamwoord: una profesora."},"mode":"word","instruction":null,"id":"F04_1"},{"stem":"En esta sala solo hay una puerta. Por favor, cierra ___ puerta. (la / una)","answers":["la"],"why":{"es":"El contexto permite identificar la única puerta de la sala.","nl":"De context identificeert de enige deur in de ruimte."},"mode":"word","instruction":null,"id":"F04_2"}]},{"id":"F05","block":1,"p":[{"es":"Con ser y una profesión sin más descripción normalmente no usamos artículo: soy profesora. Para valorar a alguien sí puede aparecer: es una profesora excelente. En generalizaciones es frecuente el definido: me gusta el café; los perros necesitan atención.","nl":"Bij ser en een beroep zonder verdere beschrijving staat meestal geen lidwoord: soy profesora. Bij een oordeel kan dat wel: es una profesora excelente. Bij algemene uitspraken staat vaak een bepaald lidwoord: me gusta el café."},{"es":"Con partes del cuerpo suele bastar el artículo cuando está claro de quién son: me lavo las manos. También hay nombres sin artículo para cantidades no precisadas: compro pan y tomates.","nl":"Bij lichaamsdelen volstaat vaak het lidwoord als de eigenaar duidelijk is: me lavo las manos. Bij niet bepaalde hoeveelheden staat soms geen lidwoord: compro pan y tomates."}],"ex":[{"es":"Mi vecino es enfermero. Es un enfermero muy atento y trabaja por las noches.","nl":"Mijn buurman is verpleegkundige. Hij is heel zorgzaam en werkt 's nachts."},{"es":"Antes de preparar la comida me lavo las manos. Hoy preparo arroz porque me gusta el arroz.","nl":"Voor het koken was ik mijn handen. Vandaag maak ik rijst, want ik houd van rijst."}],"refs":["el","pcic"],"related":["F04","F36","F37"],"title":{"es":"Cuándo usar el artículo","nl":"Wanneer gebruik je een lidwoord?"},"goal":{"es":"Hablar de profesiones, gustos generales y partes del cuerpo.","nl":"Praten over beroepen, algemene voorkeuren en lichaamsdelen."},"error":{"es":"Si aparece «me gusta café», recupera un contraste: compro café, pero me gusta el café.","nl":"Gebruik bij «me gusta café» een contrast: compro café, maar me gusta el café."},"tip":{"es":"Trabaja expresiones completas, no una regla de «poner» o «quitar» artículos para toda la lengua.","nl":"Werk met complete uitdrukkingen, niet met één regel om overal lidwoorden toe te voegen of weg te laten."},"task":{"es":"En una entrevista sobre trabajo y hábitos, cada persona explica su profesión, una preferencia y una rutina de cuidado.","nl":"Laat cursisten elkaar interviewen over werk, een voorkeur en een verzorgingsroutine."},"nl":{"es":"Ik hou van koffie no lleva artículo; me gusta el café sí. Ik was mijn handen suele ser me lavo las manos.","nl":"Ik hou van koffie heeft geen lidwoord; me gusta el café wel. Ik was mijn handen wordt meestal me lavo las manos."},"check":{"es":"Completa: «Soy ... profesor. Antes de cocinar me lavo ... manos».","nl":"Vul in: «Soy ... profesor. Antes de cocinar me lavo ... manos»."},"answer":{"es":"Soy profesor. Me lavo las manos. En la primera frase no hace falta artículo.","nl":"Soy profesor. Me lavo las manos. In de eerste zin is geen lidwoord nodig."},"prereq":["F04"],"exercises":[{"stem":"Antes de comer me lavo ___ manos. (las / mis, uso habitual)","answers":["las"],"why":{"es":"Con el pronombre me, la relación con el cuerpo está clara.","nl":"Door me is duidelijk van wie de lichaamsdelen zijn."},"mode":"word","instruction":null,"id":"F05_1"},{"stem":"Me gusta ___ música que ponen en esta cafetería. (la / una)","answers":["la"],"why":{"es":"Se identifica la música mediante la frase que la describe.","nl":"De bijzin identificeert welke muziek bedoeld wordt."},"mode":"word","instruction":null,"id":"F05_2"}]},{"id":"F06","block":1,"p":[{"es":"Ante un nombre femenino singular que empieza por a fuerte usamos normalmente el si están juntos: el agua, el aula, el hambre. La h no cambia esta pauta. Estas palabras siguen siendo femeninas: el agua fría.","nl":"Voor een vrouwelijk enkelvoudig naamwoord dat met een beklemtoonde a begint, staat meestal el als de woorden naast elkaar staan: el agua, el aula, el hambre. De h verandert dat niet. Het woord blijft vrouwelijk: el agua fría."},{"es":"En plural decimos las aulas. Con una palabra entre artículo y nombre: la nueva aula. Los demostrativos conservan el femenino: esta agua. No se aplica a cualquier a inicial: la amiga.","nl":"In het meervoud zeggen we las aulas. Met een woord ertussen: la nueva aula. Aanwijzende woorden blijven vrouwelijk: esta agua. Het geldt niet voor elke beginnende a: la amiga."}],"ex":[{"es":"El aula está preparada. Las otras aulas todavía están cerradas.","nl":"Het lokaal is klaar. De andere lokalen zijn nog gesloten."},{"es":"Después de caminar bebo agua. Esta agua está muy fría; prefiero la de la otra botella.","nl":"Na de wandeling drink ik water. Dit water is erg koud; ik heb liever dat uit de andere fles."}],"refs":["el","pcic"],"related":["F02","F08","F12"],"title":{"es":"El agua y el aula","nl":"El agua en el aula"},"goal":{"es":"Usar el artículo sin cambiar el género femenino.","nl":"Het lidwoord gebruiken zonder het vrouwelijke geslacht te veranderen."},"error":{"es":"En «el agua frío», separa forma del artículo y género del nombre: el no convierte agua en masculino.","nl":"Maak bij «el agua frío» onderscheid tussen de vorm van het lidwoord en het geslacht: el maakt agua niet mannelijk."},"tip":{"es":"Pronuncia agua y amiga marcando la sílaba fuerte. Después cambia singular por plural para recuperar las.","nl":"Spreek agua en amiga uit met nadruk op de beklemtoonde lettergreep. Maak daarna het meervoud met las."},"task":{"es":"Dos parejas organizan las aulas de un curso y comparan «el aula pequeña», «la nueva aula» y «las aulas grandes».","nl":"Laat tweetallen lokalen voor een cursus verdelen en de drie beschrijvingen vergelijken."},"nl":{"es":"La explicación es sonora y gramatical, no una equivalencia con het. El nombre español sigue siendo femenino.","nl":"De verklaring heeft met klank en grammatica te maken, niet met het. Het Spaanse naamwoord blijft vrouwelijk."},"check":{"es":"¿«Este aula nuevo» o «esta aula nueva»?","nl":"«Este aula nuevo» of «esta aula nueva»?"},"answer":{"es":"Esta aula nueva. Solo el artículo la adopta aquí la forma el cuando precede directamente al nombre.","nl":"Esta aula nueva. Alleen het lidwoord la krijgt hier de vorm el wanneer het direct voor het naamwoord staat."},"prereq":["F02","F04"],"exercises":[{"stem":"El agua del grifo está ___. (frío)","answers":["fría"],"why":{"es":"Agua sigue siendo femenino aunque lleve el.","nl":"Agua blijft vrouwelijk ondanks el."},"mode":"word","instruction":null,"id":"F06_1"},{"stem":"___ aula es muy luminosa. (Esta / Este)","answers":["esta"],"why":{"es":"Aula es femenino y el demostrativo conserva esa concordancia.","nl":"Aula is vrouwelijk en het aanwijzende woord past daarbij."},"mode":"word","instruction":null,"id":"F06_2"}]},{"id":"F07","block":1,"p":[{"es":"A + el se escribe al. De + el se escribe del: voy al centro, salgo del centro. No juntamos a la, a los, de la ni de las. La contracción también aparece en al aula y del agua.","nl":"A + el schrijf je als al. De + el wordt del: voy al centro, salgo del centro. A la, a los, de la en de las blijven los. Ook al aula en del agua hebben een samentrekking."},{"es":"Él, pronombre de persona, lleva tilde y no se une: hablo de él. Si El forma parte de un nombre propio escrito con mayúscula, se conserva separado: viajo a El Salvador.","nl":"Het persoonlijk voornaamwoord él heeft een accent en blijft los: hablo de él. Als El bij een eigennaam hoort, blijft het apart staan: viajo a El Salvador."}],"ex":[{"es":"Voy al mercado y después a la biblioteca. Al salir, paso por la casa del profesor.","nl":"Ik ga naar de markt en daarna naar de bibliotheek. Op de terugweg kom ik langs het huis van de docent."},{"es":"Marta habla de su hermano. Yo también hablo de él porque viajamos juntos a El Salvador.","nl":"Marta praat over haar broer. Ik praat ook over hem, want we reisden samen naar El Salvador."}],"refs":["el","pcic"],"related":["F06","F55","F57"],"title":{"es":"Al y del","nl":"Al en del"},"goal":{"es":"Unir a o de con el artículo el.","nl":"A of de verbinden met het lidwoord el."},"error":{"es":"Para corregir «a el centro», pide unir las dos piezas. Comprueba antes que el sea artículo, no él.","nl":"Laat bij «a el centro» de twee delen samenvoegen. Controleer eerst of el een lidwoord is, niet él."},"tip":{"es":"Usa dos tarjetas que se pueden juntar: a + el → al, de + el → del.","nl":"Gebruik twee kaartjes die samen kunnen: a + el → al, de + el → del."},"task":{"es":"Cada persona propone un recorrido por tres lugares del barrio. Otra lo dibuja y confirma de dónde sale y adónde va.","nl":"Ieder beschrijft een route langs drie plekken in de wijk. De ander tekent en controleert vertrek en bestemming."},"nl":{"es":"Naar de y van de tienen dos palabras. En español hay que reconocer cuándo aparece precisamente el.","nl":"Naar de en van de hebben twee woorden. In het Spaans moet je herkennen wanneer juist el volgt."},"check":{"es":"Completa: «Vengo ... aula y hablo ... él».","nl":"Vul in: «Vengo ... aula y hablo ... él»."},"answer":{"es":"Vengo del aula y hablo de él. El segundo él es un pronombre.","nl":"Vengo del aula y hablo de él. Het tweede él is een voornaamwoord."},"prereq":["F04"],"exercises":[{"stem":"Mañana voy ___ centro para una reunión. (a + el)","answers":["al"],"why":{"es":"A y el artículo el se unen en al.","nl":"A en het lidwoord el worden al."},"mode":"word","instruction":null,"id":"F07_1"},{"stem":"La llave ___ armario está en recepción. (de + el)","answers":["del"],"why":{"es":"De y el artículo el se unen en del.","nl":"De en het lidwoord el worden del."},"mode":"word","instruction":null,"id":"F07_2"}]},{"id":"F08","block":2,"p":[{"es":"El adjetivo se adapta al nombre: un libro nuevo, unas revistas nuevas. Muchos cambian o por a; otros tienen una forma para ambos géneros: un curso interesante, una clase interesante. El plural también cuenta: clases interesantes.","nl":"Het bijvoeglijk naamwoord past bij het naamwoord: un libro nuevo, unas revistas nuevas. Vaak wordt o een a; andere hebben één vorm voor beide geslachten: un curso interesante, una clase interesante. Ook het meervoud telt: clases interesantes."},{"es":"Los gentilicios indican origen y llevan minúscula: español, española, españoles, españolas; belga, belgas. No todos siguen el mismo patrón: neerlandés, neerlandesa. Aprende las formas junto al nombre de una persona o un lugar.","nl":"Woorden voor herkomst krijgen een kleine letter: español, española, españoles, españolas; belga, belgas. Niet alle vormen volgen hetzelfde patroon: neerlandés, neerlandesa. Leer ze met de naam van een persoon of plaats."}],"ex":[{"es":"En el intercambio participan dos estudiantes belgas y una profesora guatemalteca. El grupo es pequeño.","nl":"Aan de uitwisseling doen twee Belgische studenten en een Guatemalteekse docent mee. De groep is klein."},{"es":"Buscamos una sala tranquila con mesas grandes. Las sillas también tienen que ser cómodas.","nl":"We zoeken een rustige ruimte met grote tafels. De stoelen moeten ook prettig zitten."}],"refs":["concordancia","genero","pcic"],"related":["F02","F03","F09"],"title":{"es":"Adjetivos y gentilicios","nl":"Bijvoeglijke naamwoorden en herkomst"},"goal":{"es":"Describir personas y cosas con concordancia.","nl":"Personen en dingen beschrijven met passende vormen."},"error":{"es":"Ante «las mesas grande», pide señalar el nombre y comprobar género y número por separado.","nl":"Laat bij «las mesas grande» het naamwoord aanwijzen en geslacht en getal apart controleren."},"tip":{"es":"El nombre da instrucciones al adjetivo. Una terminación igual para dos géneros no significa que no exista plural.","nl":"Het naamwoord geeft het bijvoeglijk naamwoord aanwijzingen. Eén vorm voor twee geslachten betekent niet dat er geen meervoud is."},"task":{"es":"Cada pareja elige una sala para una actividad con tres necesidades. Debe justificar la elección con descripciones.","nl":"Elk tweetal kiest een ruimte voor een activiteit met drie eisen en onderbouwt de keuze met beschrijvingen."},"nl":{"es":"En «de tafels zijn groot», groot no cambia; en «las mesas son grandes», sí.","nl":"In «de tafels zijn groot» verandert groot niet; in «las mesas son grandes» wel."},"check":{"es":"Describe dos clases con «interesante».","nl":"Beschrijf twee lessen met «interesante»."},"answer":{"es":"Dos clases interesantes. Interesante no cambia por género, pero sí por número.","nl":"Dos clases interesantes. Interesante verandert niet naar geslacht, maar wel naar getal."},"prereq":["F02","F03"],"exercises":[{"stem":"Las estudiantes ___ presentan su proyecto. (neerlandés)","answers":["neerlandesas"],"why":{"es":"El gentilicio concuerda con estudiantes en femenino plural.","nl":"Het herkomstwoord past bij het vrouwelijke meervoud estudiantes."},"mode":"word","instruction":null,"id":"F08_1"},{"stem":"Buscamos dos actividades ___. (interesante)","answers":["interesantes"],"why":{"es":"Interesante no cambia por género, pero sí por número.","nl":"Interesante verandert niet naar geslacht, wel naar getal."},"mode":"word","instruction":null,"id":"F08_2"}]},{"id":"F09","block":2,"p":[{"es":"Muchos adjetivos descriptivos van después del nombre: una mesa redonda, una profesora chilena. Algunos aparecen delante para valorar o destacar: una buena idea. No todos pueden cambiar de lugar con el mismo significado.","nl":"Veel beschrijvende bijvoeglijke naamwoorden staan achter het naamwoord: una mesa redonda, una profesora chilena. Sommige staan ervoor als beoordeling: una buena idea. Verplaatsen kan de betekenis veranderen."},{"es":"Bueno se convierte en buen delante de un nombre masculino singular: un buen libro. Grande suele ser gran delante de un nombre singular masculino o femenino: un gran amigo, una gran profesora. Un hombre grande habla de tamaño; un gran hombre expresa una valoración.","nl":"Bueno wordt buen vóór een mannelijk enkelvoudig naamwoord: un buen libro. Grande wordt meestal gran vóór een enkelvoudig naamwoord: un gran amigo, una gran profesora. Un hombre grande gaat over grootte; un gran hombre geeft een oordeel."}],"ex":[{"es":"Para el proyecto buscamos una mesa redonda. Lucía propone una buena solución para colocarla.","nl":"Voor het project zoeken we een ronde tafel. Lucía stelt een goede oplossing voor om die neer te zetten."},{"es":"La biblioteca es grande. Allí trabaja una gran profesora que organiza buenos talleres.","nl":"De bibliotheek is groot. Er werkt een geweldige docent die goede workshops organiseert."}],"refs":["bueno","grande","pcic"],"related":["F08","F10"],"title":{"es":"Posición del adjetivo, buen y gran","nl":"Plaats van het bijvoeglijk naamwoord, buen en gran"},"goal":{"es":"Describir y reconocer formas frecuentes delante del nombre.","nl":"Beschrijven en veelvoorkomende vormen vóór het naamwoord herkennen."},"error":{"es":"En «una gran mesa» pregunta si se quiere destacar calidad o tamaño. Una posición posible puede cambiar la intención.","nl":"Vraag bij «una gran mesa» of kwaliteit of grootte bedoeld wordt. Een mogelijke woordvolgorde kan de bedoeling veranderen."},"tip":{"es":"Presenta pares con contexto, como amigo viejo y viejo amigo, sin convertirlos en una regla para todos los adjetivos.","nl":"Toon paren met context, zoals amigo viejo en viejo amigo, zonder er een regel voor alle bijvoeglijke naamwoorden van te maken."},"task":{"es":"Escriban dos anuncios de una biblioteca: uno describe el espacio y otro recomienda sus actividades. Comparen los adjetivos.","nl":"Laat twee bibliotheekadvertenties schrijven: één beschrijft de ruimte, één beveelt de activiteiten aan. Vergelijk de beschrijvingen."},"nl":{"es":"Een ronde tafel coloca rond delante; una mesa redonda lo coloca detrás. No copies automáticamente el orden neerlandés.","nl":"Een ronde tafel heeft rond vóór tafel; una mesa redonda heeft redonda erachter. Neem de Nederlandse volgorde niet automatisch over."},"check":{"es":"Completa: «Es un ... profesor y una ... persona», con bueno y grande.","nl":"Vul aan met bueno en grande: «Es un ... profesor y una ... persona»."},"answer":{"es":"Es un buen profesor y una gran persona. Buen se limita aquí al masculino singular; gran sirve para ambos géneros.","nl":"Es un buen profesor y una gran persona. Buen hoort hier bij mannelijk enkelvoud; gran kan bij beide geslachten."},"prereq":["F08"],"exercises":[{"stem":"Este es un ___ libro para empezar. (bueno)","answers":["buen"],"why":{"es":"Bueno se acorta delante de nombre masculino singular.","nl":"Bueno wordt korter vóór mannelijk enkelvoud."},"mode":"word","instruction":null,"id":"F09_1"},{"stem":"Ana es una ___ profesora y explica muy bien. (grande)","answers":["gran"],"why":{"es":"Gran puede preceder a un nombre singular femenino o masculino.","nl":"Gran kan vóór vrouwelijk of mannelijk enkelvoud staan."},"mode":"word","instruction":null,"id":"F09_2"}]},{"id":"F10","block":2,"p":[{"es":"Para diferencias usamos más o menos + adjetivo + que. Para igualdad, tan + adjetivo + como. Con cantidades: más libros que, tantos libros como. Tanto cambia con el nombre; tan no cambia. Con acciones: trabajo tanto como tú.","nl":"Bij verschil gebruik je más of menos + bijvoeglijk naamwoord + que. Bij gelijkheid: tan + bijvoeglijk naamwoord + como. Voor hoeveelheden: más libros que, tantos libros como. Tanto past zich aan; tan niet. Bij handelingen: trabajo tanto como tú."},{"es":"Mejor y peor comparan calidad; mayor y menor pueden comparar edad. No añadimos más a mejor: este libro es mejor que aquel. Para tamaño es frecuente más grande o más pequeño.","nl":"Mejor en peor vergelijken kwaliteit; mayor en menor kunnen leeftijd vergelijken. Voeg geen más aan mejor toe: este libro es mejor que aquel. Voor grootte zijn más grande en más pequeño gebruikelijk."}],"ex":[{"es":"El tren cuesta más que el autobús, pero es más rápido. El autobús no es tan cómodo como el tren.","nl":"De trein kost meer dan de bus, maar is sneller. De bus is niet zo comfortabel als de trein."},{"es":"Clara tiene tantos libros como yo. Su hermana es menor que ella y lee más novelas.","nl":"Clara heeft evenveel boeken als ik. Haar zus is jonger dan zij en leest meer romans."}],"refs":["bueno","mayor","nl_comparacion","pcic"],"related":["F11","F17"],"title":{"es":"Comparaciones","nl":"Vergelijkingen"},"goal":{"es":"Comparar cualidades, cantidades y edades.","nl":"Eigenschappen, hoeveelheden en leeftijden vergelijken."},"error":{"es":"Ante «más mejor» recupera mejor como una comparación completa. En «tan libros» falta tanto con concordancia.","nl":"Behandel bij «más mejor» mejor als een complete vergelijking. Bij «tan libros» is tanto met aanpassing nodig."},"tip":{"es":"Dos marcos: tan ... como para cualidad, tanto/a/os/as ... como para cantidad.","nl":"Gebruik twee kaders: tan ... como voor een eigenschap, tanto/a/os/as ... como voor hoeveelheid."},"task":{"es":"Ofrece dos transportes con precio y duración. Cada pareja elige uno y justifica la elección con dos comparaciones.","nl":"Geef twee vervoersmiddelen met prijs en reistijd. Tweetallen kiezen en onderbouwen met twee vergelijkingen."},"nl":{"es":"Dan corresponde aquí a que; even ... als a tan ... como. No traduzcas als siempre con como.","nl":"Dan wordt hier que; even ... als wordt tan ... como. Vertaal als niet altijd met como."},"check":{"es":"Compara dos grupos con ocho personas cada uno usando tanto.","nl":"Vergelijk twee groepen met elk acht personen met tanto."},"answer":{"es":"Este grupo tiene tantas personas como el otro. Tantas concuerda con personas.","nl":"Este grupo tiene tantas personas como el otro. Tantas past bij personas."},"prereq":["F08"],"exercises":[{"stem":"El tren es más rápido ___ el autobús.","answers":["que"],"why":{"es":"Más ... que compara dos elementos.","nl":"Más ... que vergelijkt twee elementen."},"mode":"word","instruction":null,"id":"F10_1"},{"stem":"Tenemos tantas carpetas ___ estudiantes.","answers":["como"],"why":{"es":"Tantas ... como expresa igualdad de cantidad.","nl":"Tantas ... como geeft een gelijke hoeveelheid."},"mode":"word","instruction":null,"id":"F10_2"}]},{"id":"F11","block":2,"p":[{"es":"Muy intensifica una cualidad: muy fácil. Bastante puede indicar un grado considerable; demasiado indica que se supera lo adecuado: demasiado difícil para empezar. Ante un adjetivo estas palabras no cambian: clases muy claras, tareas bastante útiles.","nl":"Muy versterkt een eigenschap: muy fácil. Bastante kan behoorlijk betekenen; demasiado geeft aan dat iets meer is dan passend: demasiado difícil para empezar. Vóór een bijvoeglijk naamwoord veranderen deze woorden niet."},{"es":"Para destacar un elemento dentro de un grupo usamos el/la/los/las más + adjetivo + de: la sala más grande del centro. También el mejor, la mejor, los mejores, las mejores. Trabajamos aquí estos usos frecuentes.","nl":"Om één element binnen een groep te kiezen gebruik je el/la/los/las más + bijvoeglijk naamwoord + de: la sala más grande del centro. Ook mogelijk: el mejor, la mejor, los mejores, las mejores. Hier oefenen we deze gewone toepassingen."}],"ex":[{"es":"La actividad es bastante corta, pero las instrucciones son demasiado largas para este grupo.","nl":"De activiteit is vrij kort, maar de instructies zijn te lang voor deze groep."},{"es":"De las tres salas, esta es la más luminosa. Para nuestro taller es la mejor opción.","nl":"Van de drie ruimtes is deze het lichtst. Voor onze workshop is dit de beste optie."}],"refs":["bueno","pcic","nl_comparacion"],"related":["F10","F17"],"title":{"es":"Grado, el más y el mejor","nl":"Graad, el más en el mejor"},"goal":{"es":"Expresar intensidad y elegir dentro de un grupo.","nl":"Intensiteit aangeven en binnen een groep kiezen."},"error":{"es":"Distingue «muy caro» de «demasiado caro»: lo segundo añade un límite, por ejemplo el presupuesto.","nl":"Onderscheid «muy caro» en «demasiado caro»: het tweede noemt een grens, bijvoorbeeld het budget."},"tip":{"es":"Usa una escala con un límite marcado. Muy indica intensidad; demasiado cruza el límite de esa situación.","nl":"Gebruik een schaal met een grens. Muy geeft intensiteit aan; demasiado gaat in die situatie over de grens."},"task":{"es":"Presenta tres tareas con duración y dificultad. Cada pareja elige la mejor para un grupo con diez minutos disponibles.","nl":"Geef drie taken met duur en moeilijkheid. Tweetallen kiezen de beste voor een groep met tien minuten tijd."},"nl":{"es":"Heel suele corresponder a muy y te a demasiado. De beste necesita concordancia en español: la mejor actividad.","nl":"Heel komt vaak overeen met muy en te met demasiado. De beste past zich in het Spaans aan: la mejor actividad."},"check":{"es":"Una tarea tarda veinte minutos y solo tienes cinco. ¿Qué expresa mejor el problema?","nl":"Een taak duurt twintig minuten en je hebt er vijf. Welke formulering benoemt het probleem?"},"answer":{"es":"Es demasiado larga para el tiempo disponible. Muy larga solo indica intensidad.","nl":"Es demasiado larga para el tiempo disponible. Muy larga geeft alleen de mate aan."},"prereq":["F08","F10"],"exercises":[{"stem":"Esta tarea dura una hora y solo tenemos cinco minutos. Es ___ larga. (muy / demasiado)","answers":["demasiado"],"why":{"es":"Demasiado expresa que supera el tiempo adecuado aquí.","nl":"Demasiado zegt dat het hier langer is dan passend."},"mode":"word","instruction":null,"id":"F11_1"},{"stem":"De las tres opciones, esta es ___ mejor para el grupo. (el / la)","answers":["la"],"why":{"es":"La concuerda con la opción, femenino singular.","nl":"La past bij la opción, vrouwelijk enkelvoud."},"mode":"word","instruction":null,"id":"F11_2"}]},{"id":"F12","block":2,"p":[{"es":"Este suele señalar algo cercano a quien habla, ese algo próximo al interlocutor o ya mencionado, y aquel algo más alejado. Son relaciones con el contexto, no distancias fijas. Cambian con el nombre: esta carpeta, esos libros, aquellas mesas.","nl":"Este wijst vaak op iets bij de spreker, ese op iets bij de ander of iets eerder genoemd, aquel op iets verder weg. De context telt, niet een vaste afstand. Ze passen zich aan: esta carpeta, esos libros, aquellas mesas."},{"es":"Esto, eso y aquello no acompañan a un nombre. Sirven para algo sin nombre identificado o una situación: ¿qué es esto?; eso es importante. No tienen plural. Escribimos los demostrativos normalmente sin tilde.","nl":"Esto, eso en aquello staan niet vóór een naamwoord. Ze verwijzen naar iets nog niet benoemds of een situatie: ¿qué es esto?; eso es importante. Ze hebben geen meervoud. Aanwijzende woorden schrijven we normaal zonder accent."}],"ex":[{"es":"Tengo esta carpeta. ¿Me pasas ese libro que tienes delante? El diccionario está en aquella mesa junto a la puerta.","nl":"Ik heb deze map. Geef je me dat boek vóór je? Het woordenboek ligt op die tafel bij de deur."},{"es":"La clase quiere organizar un intercambio. Eso me parece una buena idea.","nl":"De klas wil een uitwisseling organiseren. Dat lijkt me een goed idee."}],"refs":["pcic","tilde"],"related":["F04","F06","A01"],"title":{"es":"Este, ese, aquel, esto, eso, aquello","nl":"Este, ese, aquel, esto, eso, aquello"},"goal":{"es":"Señalar cosas y referirse a situaciones.","nl":"Dingen aanwijzen en naar situaties verwijzen."},"error":{"es":"Ante «esto libro», pide elegir entre señalar sin nombre, esto, y acompañar libro, este libro.","nl":"Laat bij «esto libro» kiezen tussen aanwijzen zonder naamwoord, esto, en met naamwoord, este libro."},"tip":{"es":"Cambia la posición de hablante y oyente: la distancia se interpreta desde su punto de vista.","nl":"Verplaats spreker en luisteraar: de afstand wordt vanuit hun standpunt bekeken."},"task":{"es":"En una mesa de materiales, una persona pide tres objetos sin tocarlos y la otra debe identificarlos.","nl":"De een vraagt om drie materialen op een tafel zonder ze aan te raken; de ander zoekt de bedoelde voorwerpen."},"nl":{"es":"Deze/dit y die/dat no dan una correspondencia exacta con tres series españolas. Esto no equivale a cualquier dit.","nl":"Deze/dit en die/dat passen niet precies bij drie Spaanse reeksen. Esto is niet voor elk gebruik van dit geschikt."},"check":{"es":"¿Cómo preguntas por un objeto cuyo nombre desconoces?","nl":"Hoe vraag je naar een voorwerp waarvan je de naam niet kent?"},"answer":{"es":"¿Qué es esto? Si nombras el objeto: ¿De quién es este libro?","nl":"¿Qué es esto? Met een naamwoord: ¿De quién es este libro?"},"prereq":["F02","F03"],"exercises":[{"stem":"¿Qué es ___? No conozco el nombre de ese objeto. (esto / este)","answers":["esto"],"why":{"es":"Sin nombre, esto puede señalar un objeto por identificar.","nl":"Zonder naamwoord kan esto een nog onbekend voorwerp aanwijzen."},"mode":"word","instruction":null,"id":"F12_1"},{"stem":"¿Me pasas ___ carpeta que tienes ahí? (ese / esa)","answers":["esa"],"why":{"es":"Carpeta es femenino singular.","nl":"Carpeta is vrouwelijk enkelvoud."},"mode":"word","instruction":null,"id":"F12_2"}]},{"id":"F13","block":2,"p":[{"es":"Mi/mis, tu/tus y su/sus cambian según el número de cosas: mi libro, mis libros. Nuestro y vuestro también cambian por género: nuestra clase, nuestros grupos. El posesivo concuerda con lo que nombramos, no con el género de la persona.","nl":"Mi/mis, tu/tus en su/sus veranderen naar het aantal dingen: mi libro, mis libros. Nuestro en vuestro veranderen ook naar geslacht: nuestra clase, nuestros grupos. De vorm past bij wat we benoemen, niet bij het geslacht van de eigenaar."},{"es":"Su puede referirse a él, ella, usted, ellos, ellas o ustedes. Si no está claro, usa de + persona: el libro de Ana. Vos usa tu/tus; ustedes usa su/sus. En el uso general decimos mi casa, sin artículo delante.","nl":"Su kan naar él, ella, usted, ellos, ellas of ustedes verwijzen. Maak het zo nodig duidelijk: el libro de Ana. Bij vos hoort tu/tus; bij ustedes su/sus. In algemeen gebruik zeggen we mi casa, zonder lidwoord ervoor."}],"ex":[{"es":"Ana trae sus libros y Pablo trae su carpeta. Los dos preparan nuestra actividad.","nl":"Ana neemt haar boeken mee en Pablo zijn map. Samen bereiden ze onze activiteit voor."},{"es":"Profesora, ¿esta es su llave? La mía está en casa y no puedo abrir el aula.","nl":"Mevrouw, is dit uw sleutel? Die van mij ligt thuis en ik kan het lokaal niet openen."}],"refs":["pcic","concordancia"],"related":["F14","F22"],"title":{"es":"Mi, tu, su, nuestro y vuestro","nl":"Mi, tu, su, nuestro en vuestro"},"goal":{"es":"Expresar pertenencia y relaciones delante del nombre.","nl":"Bezit en relaties uitdrukken vóór het naamwoord."},"error":{"es":"Si el alumno elige su porque el dueño es hombre, contrasta su libro y su mochila de la misma persona.","nl":"Als iemand su kiest omdat de eigenaar een man is, vergelijk dan su libro en su mochila van dezelfde persoon."},"tip":{"es":"Primero identifica la persona; después mira el nombre que sigue para elegir singular, plural y, cuando procede, género.","nl":"Bepaal eerst de persoon; kijk daarna naar het volgende naamwoord voor enkelvoud, meervoud en eventueel geslacht."},"task":{"es":"Organicen materiales de dos equipos. Una persona explica qué lleva su equipo y otra confirma qué falta en el suyo.","nl":"Laat twee teams materialen verdelen. De een vertelt wat zijn team meeneemt; de ander controleert wat zijn eigen team nog mist."},"nl":{"es":"Zijn y haar distinguen al poseedor; su no lo distingue. Ons/onze no siguen la misma clasificación que nuestro/nuestra.","nl":"Zijn en haar onderscheiden de eigenaar; su doet dat niet. Ons/onze volgen niet dezelfde indeling als nuestro/nuestra."},"check":{"es":"Ana tiene dos carpetas. ¿Cómo completas «Ana trae ... carpetas»?","nl":"Ana heeft twee mappen. Hoe vul je «Ana trae ... carpetas» aan?"},"answer":{"es":"Sus carpetas. El plural indica varias carpetas, aunque la dueña sea una sola persona.","nl":"Sus carpetas. Het meervoud verwijst naar meerdere mappen, ook met één eigenaar."},"prereq":["F02","F03"],"exercises":[{"stem":"Ana trae ___ libros, no los de Marta. (su / sus)","answers":["sus"],"why":{"es":"El plural depende de los libros, no del número de dueños.","nl":"Het meervoud hangt van de boeken af, niet van het aantal eigenaars."},"mode":"word","instruction":null,"id":"F13_1"},{"stem":"Nosotras preparamos ___ presentación. (nuestro)","answers":["nuestra"],"why":{"es":"Presentación es femenino singular.","nl":"Presentación is vrouwelijk enkelvoud."},"mode":"word","instruction":null,"id":"F13_2"}]},{"id":"F14","block":2,"p":[{"es":"Mío, tuyo y suyo tienen formas femeninas y plurales: mía, míos, mías. Nuestro y vuestro mantienen sus formas. Concuerdan con la cosa: esta mochila es mía; estos libros son míos.","nl":"Mío, tuyo en suyo hebben vrouwelijke vormen en meervoud: mía, míos, mías. Nuestro en vuestro behouden hun vormen. Ze passen bij het bezit: esta mochila es mía; estos libros son míos."},{"es":"Con ser expresamos pertenencia: es mío. Con artículo identificamos algo entre varias cosas: el mío está aquí. También aparecen después del nombre: una amiga mía. Si suyo es ambiguo, aclara con de ella, de ustedes o un nombre.","nl":"Met ser druk je bezit uit: es mío. Met een lidwoord wijs je iets tussen andere dingen aan: el mío está aquí. Ze kunnen ook achter het naamwoord: una amiga mía. Verduidelijk suyo zo nodig met de ella, de ustedes of een naam."}],"ex":[{"es":"¿Esta chaqueta es tuya? La mía es azul, así que esta no es mía.","nl":"Is dit jouw jas? Die van mij is blauw, dus deze is niet van mij."},{"es":"Una amiga nuestra organiza el taller. El material del centro ya está allí; el nuestro llega mañana.","nl":"Een vriendin van ons organiseert de workshop. Het materiaal van het centrum is er al; dat van ons komt morgen."}],"refs":["pcic","concordancia"],"related":["F13","F04"],"title":{"es":"Mío, tuyo, suyo, es mío y el mío","nl":"Mío, tuyo, suyo, es mío en el mío"},"goal":{"es":"Expresar posesión sin repetir siempre el nombre.","nl":"Bezit uitdrukken zonder steeds het naamwoord te herhalen."},"error":{"es":"Ante «es mi» recupera el contraste mi libro / el libro es mío. Mi necesita un nombre detrás.","nl":"Vergelijk bij «es mi» mi libro met el libro es mío. Mi heeft er een naamwoord achter nodig."},"tip":{"es":"Muestra dos preguntas: ¿de quién es? → es mío; ¿cuál? → el mío.","nl":"Toon twee vragen: ¿de quién es? → es mío; ¿cuál? → el mío."},"task":{"es":"Simulen una oficina de objetos perdidos con tres mochilas y tarjetas de propietarios. Deben devolver cada una.","nl":"Speel een loket voor gevonden voorwerpen met drie rugzakken en eigenaarskaartjes. Laat elke rugzak teruggeven."},"nl":{"es":"Van mij no cambia en «de tas is van mij» y «de boeken zijn van mij»; mía/míos sí cambian.","nl":"Van mij blijft gelijk bij een tas en boeken; mía/míos veranderen wel."},"check":{"es":"Hablas de tus dos llaves. Completa: «Estas son ...; ... están en la mesa».","nl":"Je bedoelt je twee sleutels. Vul aan: «Estas son ...; ... están en la mesa»."},"answer":{"es":"Estas son mías; las mías están en la mesa. La segunda frase incluye artículo para identificar las llaves.","nl":"Estas son mías; las mías están en la mesa. In de tweede zin identificeert het lidwoord de sleutels."},"prereq":["F13"],"exercises":[{"stem":"Estas dos llaves son ___. (mío)","answers":["mías"],"why":{"es":"Mías concuerda con llaves en femenino plural.","nl":"Mías past bij llaves, vrouwelijk meervoud."},"mode":"word","instruction":null,"id":"F14_1"},{"stem":"Tu carpeta es azul; la ___ es verde. (mío)","answers":["mía"],"why":{"es":"La mía sustituye la carpeta mía.","nl":"La mía vervangt la carpeta mía."},"mode":"word","instruction":null,"id":"F14_2"}]},{"id":"F15","block":3,"p":[{"es":"De 16 a 29 escribimos una palabra: dieciséis, veintidós. Desde treinta usamos normalmente decena + y + unidad: treinta y cuatro. Cien expresa 100; ciento aparece en 101 a 199: ciento cinco. Mil no lleva un delante.","nl":"Van 16 tot 29 schrijven we één woord: dieciséis, veintidós. Vanaf dertig gebruiken we meestal tiental + y + eenheid: treinta y cuatro. Cien is 100; ciento staat in 101 tot 199: ciento cinco. Vóór mil staat geen un."},{"es":"Uno pierde la o delante de nombre masculino: un libro, veintiún libros. Con femenino: una mesa, veintiuna mesas. Las centenas desde doscientos concuerdan: doscientas páginas. Formas importantes: quinientos, setecientos, novecientos.","nl":"Uno verliest de o vóór een mannelijk naamwoord: un libro, veintiún libros. Bij vrouwelijk: una mesa, veintiuna mesas. Honderdtallen vanaf doscientos passen zich aan: doscientas páginas. Belangrijke vormen: quinientos, setecientos, novecientos."}],"ex":[{"es":"Para el curso compramos veintiún cuadernos y veintiuna carpetas. En total son cuarenta y dos objetos.","nl":"Voor de cursus kopen we eenentwintig schriften en eenentwintig mappen. Samen zijn dat tweeënveertig voorwerpen."},{"es":"El libro tiene doscientas páginas. Hoy leemos de la cien a la ciento diez.","nl":"Het boek heeft tweehonderd pagina's. Vandaag lezen we pagina honderd tot honderdtien."}],"refs":["cardinales","pcic"],"related":["F16","F20"],"title":{"es":"Números cardinales","nl":"Hoofdtelwoorden"},"goal":{"es":"Decir cantidades con las formas adecuadas.","nl":"Hoeveelheden met de juiste vormen noemen."},"error":{"es":"En «uno libro», haz mirar la palabra siguiente. Al contar solo, uno conserva la o.","nl":"Laat bij «uno libro» naar het volgende woord kijken. Bij los tellen blijft uno intact."},"tip":{"es":"Para 34 piensa primero en treinta y después en cuatro. Haz visible el orden con dos tarjetas.","nl":"Denk bij 34 eerst aan treinta, daarna aan cuatro. Maak de volgorde zichtbaar met twee kaartjes."},"task":{"es":"Una persona dicta una compra con cantidades y otra prepara el pedido. Deben confirmar dos cifras que suenen parecidas.","nl":"De een dicteert aantallen voor een bestelling, de ander verwerkt die. Laat twee vergelijkbaar klinkende getallen controleren."},"nl":{"es":"Vierendertig coloca la unidad primero; treinta y cuatro empieza por la decena.","nl":"Vierendertig begint met de eenheid; treinta y cuatro met het tiental."},"check":{"es":"Escribe 21 delante de «sillas» y de «libros».","nl":"Schrijf 21 vóór «sillas» en vóór «libros»."},"answer":{"es":"Veintiuna sillas, veintiún libros. Cambian género y forma delante del nombre.","nl":"Veintiuna sillas, veintiún libros. Geslacht en vorm vóór het naamwoord bepalen de keuze."},"prereq":["F02","F03"],"exercises":[{"stem":"Necesitamos ___ libros para veintiún participantes. (21)","answers":["veintiún"],"why":{"es":"Veintiuno pierde o ante un nombre masculino.","nl":"Veintiuno verliest de o vóór een mannelijk naamwoord."},"mode":"word","instruction":null,"id":"F15_1"},{"stem":"La carpeta contiene ___ páginas. (200)","answers":["doscientas"],"why":{"es":"Las centenas concuerdan con el nombre femenino páginas.","nl":"De honderdtallen passen bij het vrouwelijke páginas."},"mode":"word","instruction":null,"id":"F15_2"}]},{"id":"F16","block":3,"p":[{"es":"Los ordinales indican posición: primero, segundo, tercero, cuarto, quinto, sexto, séptimo, octavo, noveno, décimo. Cambian con el nombre: primera planta, segundos premios. No expresan cuántas cosas hay.","nl":"Rangtelwoorden geven een positie aan: primero, segundo, tercero, cuarto, quinto, sexto, séptimo, octavo, noveno, décimo. Ze passen zich aan: primera planta, segundos premios. Ze zeggen niet hoeveel dingen er zijn."},{"es":"Primero y tercero se acortan delante de nombre masculino singular: primer día, tercer piso. Con femenino: primera clase, tercera puerta. En abreviaturas se escribe un punto antes de la letra elevada: 1.º, 1.ª.","nl":"Primero en tercero worden korter vóór mannelijk enkelvoud: primer día, tercer piso. Bij vrouwelijk: primera clase, tercera puerta. Afkortingen hebben een punt vóór de verhoogde letter: 1.º, 1.ª."}],"ex":[{"es":"Es mi primer día de prácticas. La primera clase empieza a las nueve en el tercer piso.","nl":"Het is mijn eerste stagedag. De eerste les begint om negen uur op de derde verdieping."},{"es":"Nuestro equipo termina en segundo lugar. Es la segunda vez que participamos.","nl":"Ons team eindigt op de tweede plaats. Het is de tweede keer dat we meedoen."}],"refs":["ordinales","nl_ordinales","pcic"],"related":["F09","F15"],"title":{"es":"Ordinales hasta décimo","nl":"Rangtelwoorden tot en met tien"},"goal":{"es":"Indicar posición y orden.","nl":"Positie en volgorde aangeven."},"error":{"es":"Ante «primero día», conserva primero al nombrar la posición sola y muestra la forma primer junto a día.","nl":"Gebruik bij «primero día» primero los voor de positie en toon primer samen met día."},"tip":{"es":"Cantidad pregunta ¿cuántos?; posición pregunta ¿en qué lugar? Usa una fila de diez tarjetas.","nl":"Hoeveelheid vraagt ¿cuántos?; positie vraagt ¿en qué lugar? Gebruik een rij van tien kaartjes."},"task":{"es":"Organiza un programa de diez presentaciones. Cada pareja recibe tres condiciones y acuerda el orden con otra.","nl":"Laat een programma van tien presentaties maken. Tweetallen krijgen drie voorwaarden en overleggen over de volgorde."},"nl":{"es":"Eerste cambia menos que primero/primera/primer. En edificios, comprueba además cómo se numeran las plantas allí.","nl":"Eerste verandert minder dan primero/primera/primer. Controleer in gebouwen ook hoe de verdiepingen daar worden geteld."},"check":{"es":"Completa con tercero: «la ... actividad del ... día».","nl":"Vul aan met tercero: «la ... actividad del ... día»."},"answer":{"es":"La tercera actividad del tercer día.","nl":"La tercera actividad del tercer día."},"prereq":["F08","F15"],"exercises":[{"stem":"La tutoría es en el ___ piso. (tercero)","answers":["tercer"],"why":{"es":"Tercero se acorta delante de piso, masculino singular.","nl":"Tercero wordt korter vóór piso, mannelijk enkelvoud."},"mode":"word","instruction":null,"id":"F16_1"},{"stem":"Es la ___ vez que preparo este taller. (primero)","answers":["primera"],"why":{"es":"Primera conserva la a con vez.","nl":"Primera behoudt de a bij vez."},"mode":"word","instruction":null,"id":"F16_2"}]},{"id":"F17","block":3,"p":[{"es":"Con nombres, mucho, poco y demasiado cambian: mucha agua, pocos libros, demasiadas tareas. Bastante tiene plural: bastantes sillas. Un poco de presenta una cantidad pequeña: un poco de leche. Poco suele destacar que la cantidad es escasa.","nl":"Bij naamwoorden veranderen mucho, poco en demasiado: mucha agua, pocos libros, demasiadas tareas. Bastante heeft meervoud: bastantes sillas. Un poco de geeft een kleine hoeveelheid: un poco de leche. Poco benadrukt vaak dat het weinig is."},{"es":"Con verbos decimos trabajo mucho, duermo poco. Muy va delante de adjetivos o adverbios: muy útil, muy bien. No cambia. Con comparativos usamos mucho: mucho mejor.","nl":"Bij werkwoorden zeggen we trabajo mucho, duermo poco. Muy staat vóór bijvoeglijke naamwoorden of bijwoorden: muy útil, muy bien. Het verandert niet. Bij vergelijkingen gebruiken we mucho: mucho mejor."}],"ex":[{"es":"Tenemos poco tiempo, pero hay bastantes materiales. Elegimos una actividad muy corta.","nl":"We hebben weinig tijd, maar genoeg materialen. We kiezen een erg korte activiteit."},{"es":"¿Quieres un poco de leche? Yo tomo poco café por la tarde porque después duermo mal.","nl":"Wil je een beetje melk? Ik drink 's middags weinig koffie, omdat ik daarna slecht slaap."}],"refs":["mucho","pcic"],"related":["F10","F11","F18"],"title":{"es":"Mucho, poco, muy y cantidades","nl":"Mucho, poco, muy en hoeveelheden"},"goal":{"es":"Distinguir cantidad e intensidad.","nl":"Hoeveelheid en intensiteit onderscheiden."},"error":{"es":"Ante «muy libros» pregunta qué sigue: un nombre necesita una cantidad, muchos libros.","nl":"Vraag bij «muy libros» wat er volgt: een naamwoord heeft een hoeveelheid nodig, muchos libros."},"tip":{"es":"Tres modelos de consulta: mucho café, trabajo mucho, muy interesante.","nl":"Gebruik drie vaste modellen: mucho café, trabajo mucho, muy interesante."},"task":{"es":"Con una lista de provisiones, organicen una merienda y expliquen qué sobra, qué falta y qué basta.","nl":"Laat met een voorraadlijst een tussendoortje plannen en vertellen waarvan er te veel, te weinig of genoeg is."},"nl":{"es":"Veel puede ser mucho o muchos; heel suele ser muy. Een beetje melk necesita de: un poco de leche.","nl":"Veel kan mucho of muchos zijn; heel is vaak muy. Een beetje melk krijgt de: un poco de leche."},"check":{"es":"Completa: «Tenemos ... preguntas y estamos ... interesados».","nl":"Vul aan: «Tenemos ... preguntas y estamos ... interesados»."},"answer":{"es":"Muchas preguntas y muy interesados. La cantidad concuerda; muy permanece igual.","nl":"Muchas preguntas en muy interesados. De hoeveelheid past zich aan; muy blijft gelijk."},"prereq":["F01","F08"],"exercises":[{"stem":"Después del viaje tenemos ___ hambre. (mucho)","answers":["mucha"],"why":{"es":"Hambre es femenino; mucha expresa cantidad.","nl":"Hambre is vrouwelijk; mucha geeft hoeveelheid."},"mode":"word","instruction":null,"id":"F17_1"},{"stem":"Las instrucciones son ___ claras. (muy / mucho)","answers":["muy"],"why":{"es":"Muy modifica al adjetivo claras y no cambia.","nl":"Muy versterkt claras en verandert niet."},"mode":"word","instruction":null,"id":"F17_2"}]},{"id":"F18","block":3,"p":[{"es":"Alguien y nadie se refieren a personas; algo y nada, a cosas o información. No cambian: ¿hay alguien?, no quiero nada. Si la palabra negativa va después del verbo, suele aparecer no delante: no viene nadie. Delante: nadie viene.","nl":"Alguien en nadie verwijzen naar personen; algo en nada naar dingen of informatie. Ze veranderen niet: ¿hay alguien?, no quiero nada. Een ontkennend woord achter het werkwoord gaat meestal samen met no ervoor: no viene nadie. Ervoor: nadie viene."},{"es":"Delante de un nombre usamos algún/alguna y ningún/ninguna: algún libro, ninguna pregunta. En usos básicos, ninguno se usa en singular. Sin nombre: ¿tienes un lápiz? No tengo ninguno.","nl":"Vóór een naamwoord gebruiken we algún/alguna en ningún/ninguna: algún libro, ninguna pregunta. In de basis gebruiken we ninguno in het enkelvoud. Zonder naamwoord: ¿tienes un lápiz? No tengo ninguno."}],"ex":[{"es":"Alguien llama a la puerta del aula. Pregunta si hay alguna actividad abierta al público.","nl":"Iemand klopt op de deur van het lokaal en vraagt of er een openbare activiteit is."},{"es":"Busco las instrucciones, pero no encuentro nada. Nadie sabe dónde están.","nl":"Ik zoek de instructies, maar vind niets. Niemand weet waar ze zijn."}],"refs":["ninguno","nl_indefinidos","pcic"],"related":["F23","F17"],"title":{"es":"Alguien, nadie, algo y nada","nl":"Alguien, nadie, algo en nada"},"goal":{"es":"Hablar de personas y cosas sin identificarlas.","nl":"Over personen en dingen praten zonder ze te benoemen."},"error":{"es":"No corrijas no ... nadie como doble negación incorrecta. Es una construcción normal del español.","nl":"Verbeter no ... nadie niet als foute dubbele ontkenning. Het is een gewone Spaanse constructie."},"tip":{"es":"Cruza dos preguntas: ¿persona o cosa?, ¿presencia o ausencia? Coloca las cuatro palabras.","nl":"Combineer twee vragen: persoon of ding, aanwezigheid of afwezigheid? Plaats de vier woorden."},"task":{"es":"Una persona pregunta por materiales disponibles. La otra tiene un inventario con elementos presentes y ausentes y propone una solución.","nl":"De een vraagt naar beschikbare materialen. De ander gebruikt een voorraadlijst met aanwezige en ontbrekende spullen en stelt een oplossing voor."},"nl":{"es":"Niemand y niets no exigen niet en neerlandés. En español la posición decide si hace falta no.","nl":"Niemand en niets vragen in het Nederlands geen niet erbij. In het Spaans bepaalt de positie of no nodig is."},"check":{"es":"Cambia «No viene nadie» poniendo nadie al principio.","nl":"Zet nadie vooraan in «No viene nadie»."},"answer":{"es":"Nadie viene. No se mantiene no después de nadie en esta estructura.","nl":"Nadie viene. In deze constructie blijft no niet staan na nadie."},"prereq":["F01","F04"],"exercises":[{"stem":"Hay un ruido en la puerta. Creo que hay ___. (alguien / algo, una persona)","answers":["alguien"],"why":{"es":"Alguien se refiere a una persona sin identificar.","nl":"Alguien verwijst naar een niet benoemde persoon."},"mode":"word","instruction":null,"id":"F18_1"},{"stem":"No tengo ___ pregunta sobre la actividad. (ninguno)","answers":["ninguna"],"why":{"es":"Ninguna concuerda con pregunta, femenino singular.","nl":"Ninguna past bij pregunta, vrouwelijk enkelvoud."},"mode":"word","instruction":null,"id":"F18_2"}]},{"id":"F19","block":3,"p":[{"es":"Todo concuerda: todo el día, toda la clase, todos los libros, todas las personas. Todos los días expresa repetición; todo el día expresa la jornada completa. Cada + nombre singular considera uno por uno: cada estudiante.","nl":"Todo past zich aan: todo el día, toda la clase, todos los libros, todas las personas. Todos los días geeft herhaling aan; todo el día een hele dag. Cada + enkelvoud bekijkt de leden afzonderlijk: cada estudiante."},{"es":"Otro expresa algo adicional o diferente: otro café, otra fecha. Normalmente no lleva un delante. Cada dos días expresa un intervalo de dos días.","nl":"Otro geeft iets extra's of anders aan: otro café, otra fecha. Gewoonlijk staat er geen un voor. Cada dos días geeft een interval van twee dagen aan."}],"ex":[{"es":"Cada estudiante trae una foto. Después todos los grupos preparan una pequeña exposición.","nl":"Elke student neemt een foto mee. Daarna maken alle groepen een kleine tentoonstelling."},{"es":"Trabajo todos los días por la mañana. Hoy tengo libre todo el día y busco otra actividad.","nl":"Ik werk elke ochtend. Vandaag ben ik de hele dag vrij en zoek ik een andere activiteit."}],"refs":["cada","pcic"],"related":["F17","F58"],"title":{"es":"Todo, cada y otro","nl":"Todo, cada en otro"},"goal":{"es":"Hablar del conjunto, de sus miembros y de una alternativa.","nl":"Over het geheel, de afzonderlijke delen en een alternatief praten."},"error":{"es":"Distingue «todo el día» y «todos los días» con una agenda antes de corregir solo las terminaciones.","nl":"Vergelijk «todo el día» en «todos los días» met een agenda voordat je alleen de uitgangen verbetert."},"tip":{"es":"Todo mira el conjunto; cada acerca la mirada a cada miembro.","nl":"Todo kijkt naar het geheel; cada zoomt in op elk afzonderlijk lid."},"task":{"es":"Planifiquen una semana de turnos: cada persona tiene una tarea, todos participan y nadie repite dos días seguidos.","nl":"Laat een weekrooster maken: ieder heeft een taak, iedereen doet mee en niemand is twee dagen achter elkaar aan de beurt."},"nl":{"es":"Een andere datum se expresa normalmente otra fecha, sin un. Elke dag no es todo el día.","nl":"Een andere datum wordt meestal otra fecha, zonder un. Elke dag is niet todo el día."},"check":{"es":"¿«Todo el día» significa cada día o un día completo?","nl":"Betekent «todo el día» elke dag of een hele dag?"},"answer":{"es":"Un día completo. Para repetición: todos los días o cada día.","nl":"Een hele dag. Voor herhaling: todos los días of cada día."},"prereq":["F04","F17"],"exercises":[{"stem":"Estudio español ___ los días. (todo)","answers":["todos"],"why":{"es":"Todos los días expresa repetición.","nl":"Todos los días geeft herhaling."},"mode":"word","instruction":null,"id":"F19_1"},{"stem":"Esta fecha no me viene bien. Necesito ___ fecha. (otro)","answers":["otra"],"why":{"es":"Otra concuerda con fecha y no necesita un delante.","nl":"Otra past bij fecha en krijgt geen un ervoor."},"mode":"word","instruction":null,"id":"F19_2"}]},{"id":"F20","block":3,"p":[{"es":"Para la hora: es la una, son las dos. Para una cita: a la una, a las dos. 2:30 es las dos y media; 2:45 puede ser las tres menos cuarto o las dos y cuarenta y cinco. Las formas cambian según la región.","nl":"Voor de tijd: es la una, son las dos. Voor een afspraak: a la una, a las dos. 2:30 is las dos y media; 2:45 kan las tres menos cuarto of las dos y cuarenta y cinco zijn. De gebruikelijke vormen verschillen per regio."},{"es":"Una fecha: el cinco de mayo de dos mil veintiséis. Los meses llevan minúscula. Para precios: cuesta doce euros; cuestan doce euros. Para medidas: mide dos metros, pesa tres kilos, un litro de leche.","nl":"Een datum: el cinco de mayo de dos mil veintiséis. Maanden krijgen een kleine letter. Prijzen: cuesta doce euros; cuestan doce euros. Maten: mide dos metros, pesa tres kilos, un litro de leche."}],"ex":[{"es":"El taller es el cinco de mayo a las dos y media. La entrada cuesta ocho euros.","nl":"De workshop is op vijf mei om half drie. De toegang kost acht euro."},{"es":"Para la receta compramos medio kilo de tomates y un litro de leche. Los tomates cuestan dos euros.","nl":"Voor het recept kopen we een halve kilo tomaten en een liter melk. De tomaten kosten twee euro."}],"refs":["cardinales","nociones","pcic"],"related":["F15","F58"],"title":{"es":"Horas, fechas, precios y medidas","nl":"Tijd, datum, prijzen en maten"},"goal":{"es":"Intercambiar datos para organizar la vida diaria.","nl":"Gegevens uitwisselen om dagelijkse zaken te regelen."},"error":{"es":"Ante una cita a las dos y media, pide escribir 14:30: permite detectar una interpretación equivocada de half.","nl":"Laat bij een afspraak a las dos y media 14:30 opschrijven: zo ontdek je een verkeerde interpretatie van half."},"tip":{"es":"Trabaja hora digital, expresión oral y evento juntos.","nl":"Combineer digitale tijd, gesproken vorm en gebeurtenis."},"task":{"es":"Dos agendas distintas deben encontrar una cita posible con hora, fecha y coste de la actividad.","nl":"Laat twee verschillende agenda's vergelijken om een afspraak te vinden met tijd, datum en kosten."},"nl":{"es":"Half drie es las dos y media. Cinco euros lleva plural, aunque en neerlandés se diga vijf euro.","nl":"Half drie is las dos y media. Cinco euros heeft meervoud, ook al zeg je in het Nederlands vijf euro."},"check":{"es":"Escribe en español la hora de una cita a las 13:30.","nl":"Schrijf de tijd van een afspraak om 13:30 in het Spaans."},"answer":{"es":"A la una y media. Para decir qué hora es: es la una y media.","nl":"A la una y media. Om de huidige tijd te noemen: es la una y media."},"prereq":["F15"],"exercises":[{"stem":"La reunión empieza a la una y ___. (13:30)","answers":["media"],"why":{"es":"13:30 es la una y media, half twee.","nl":"13:30 is la una y media, half twee."},"mode":"word","instruction":null,"id":"F20_1"},{"stem":"Estas dos entradas ___ doce euros en total. (costar, presente)","answers":["cuestan"],"why":{"es":"El sujeto plural entradas exige cuestan.","nl":"Het meervoud entradas vraagt cuestan."},"mode":"word","instruction":null,"id":"F20_2"}]},{"id":"F21","block":4,"p":[{"es":"Los pronombres sujeto son yo, tú, él, ella, usted, nosotros/nosotras, vosotros/vosotras, ellos/ellas y ustedes; también vos en las variedades que lo usan. El verbo concuerda: yo trabajo, ellas trabajan.","nl":"Onderwerpsvormen zijn yo, tú, él, ella, usted, nosotros/nosotras, vosotros/vosotras, ellos/ellas en ustedes; ook vos waar dat gebruikt wordt. Het werkwoord past erbij: yo trabajo, ellas trabajan."},{"es":"Podemos omitir el pronombre si la forma verbal o la situación lo aclaran: estudio español. Lo expresamos para aclarar o contrastar: yo estudio español y ella estudia francés. Un orden frecuente es sujeto + verbo + complemento, pero el español permite otros órdenes según el mensaje.","nl":"Het voornaamwoord kan weg als de werkwoordsvorm of situatie duidelijk genoeg is: estudio español. Het blijft voor verduidelijking of contrast: yo estudio español y ella estudia francés. Onderwerp + werkwoord + aanvulling is gebruikelijk, maar andere volgordes zijn mogelijk."}],"ex":[{"es":"Vivo en Tilburg y estudio en Fontys. Mi compañera vive en Breda y viene en tren.","nl":"Ik woon in Tilburg en studeer bij Fontys. Mijn medestudent woont in Breda en komt met de trein."},{"es":"Yo preparo el texto y ustedes buscan las imágenes. Después revisamos todo juntos.","nl":"Ik maak de tekst en jullie zoeken afbeeldingen. Daarna bekijken we alles samen."}],"refs":["concordancia","pcic"],"related":["F22","F26"],"title":{"es":"Sujeto, pronombres y orden de la frase","nl":"Onderwerp, voornaamwoorden en woordvolgorde"},"goal":{"es":"Construir frases e identificar quién hace la acción.","nl":"Zinnen maken en herkennen wie de handeling uitvoert."},"error":{"es":"Repetir yo no es siempre incorrecto. Pregunta qué contraste aporta y si hace falta en esa situación.","nl":"Yo herhalen is niet altijd fout. Vraag welk contrast het toevoegt en of dat hier nodig is."},"tip":{"es":"La terminación verbal suele funcionar como una etiqueta de persona; algunas etiquetas sirven para varias personas.","nl":"De werkwoordsuitgang werkt vaak als een persoonslabel; sommige labels passen bij meerdere personen."},"task":{"es":"Cada pareja reparte tres tareas y explica qué hace cada persona sin crear ambigüedad.","nl":"Laat tweetallen drie taken verdelen en helder vertellen wie wat doet."},"nl":{"es":"En neerlandés normalmente necesitamos ik: ik werk. En español trabajo puede ser suficiente.","nl":"In het Nederlands is ik meestal nodig: ik werk. In het Spaans kan trabajo voldoende zijn."},"check":{"es":"¿Por qué «ella» puede ser útil en «Ana y Luis colaboran; ella prepara el texto»?","nl":"Waarom kan «ella» nuttig zijn in «Ana y Luis colaboran; ella prepara el texto»?"},"answer":{"es":"Aclara que Ana prepara el texto. Prepara por sí solo no distingue entre Ana y Luis.","nl":"Het maakt duidelijk dat Ana de tekst maakt. Prepara alleen onderscheidt Ana niet van Luis."},"prereq":[],"exercises":[{"stem":"Mi compañera y yo ___ español. (estudiar, presente)","answers":["estudiamos"],"why":{"es":"Mi compañera y yo corresponde a nosotros/nosotras.","nl":"Mi compañera y yo komt overeen met nosotros/nosotras."},"mode":"word","instruction":null,"id":"F21_1"},{"stem":"Ana y Luis ___ juntos. (trabajar, presente)","answers":["trabajan"],"why":{"es":"El sujeto es de tercera persona plural.","nl":"Het onderwerp is derde persoon meervoud."},"mode":"word","instruction":null,"id":"F21_2"}]},{"id":"F22","block":4,"p":[{"es":"Tú y vos se usan para dirigirse a una persona en relaciones de confianza, según la comunidad. Usted suele expresar respeto o distancia, aunque también tiene usos cercanos en algunas comunidades. No existe una regla universal basada solo en la edad.","nl":"Tú en vos spreken één persoon aan in vertrouwde relaties, afhankelijk van de gemeenschap. Usted drukt vaak respect of afstand uit, maar kan in sommige gemeenschappen ook nabijheid uitdrukken. Leeftijd alleen geeft geen universele regel."},{"es":"Vosotros/vosotras es habitual en gran parte de España para varios interlocutores de confianza. Ustedes sirve para el plural general en América y Canarias, y para el trato formal en gran parte de España. Modelos: tú hablas, vos hablás, usted habla, vosotros habláis, ustedes hablan. El voseo tiene variantes regionales.","nl":"Vosotros/vosotras is in een groot deel van Spanje gebruikelijk voor meerdere vertrouwde gesprekspartners. Ustedes is algemeen meervoud in Amerika en op de Canarische Eilanden, en formeel in veel van Spanje. Modellen: tú hablas, vos hablás, usted habla, vosotros habláis, ustedes hablan. Voseo kent regionale varianten."}],"ex":[{"es":"En una conversación donde se usa vos: «¿Vos estudiás aquí? Sí, estudio español».","nl":"In een gesprek met vos: «¿Vos estudiás aquí? Sí, estudio español»."},{"es":"En una oficina: «¿Usted necesita una copia?». Ante un grupo: «¿Ustedes necesitan copias?».","nl":"Op een kantoor: «¿Usted necesita una copia?». Tegen een groep: «¿Ustedes necesitan copias?»."}],"refs":["voseo","usted","pcic"],"related":["F13","F28","F44"],"title":{"es":"Tú, vos, usted, vosotros y ustedes","nl":"Tú, vos, usted, vosotros en ustedes"},"goal":{"es":"Elegir un tratamiento adecuado al contexto.","nl":"Een passende aanspreekvorm kiezen."},"error":{"es":"Ustedes hablan se dirige a los oyentes aunque la forma verbal sea de tercera persona. No lo traduzcas como ellos.","nl":"Ustedes hablan spreekt de luisteraars aan, ook met een derde persoonsvorm. Vertaal het niet als ellos."},"tip":{"es":"Distingue destinatario, relación y forma verbal. No asignes una sola forma a todo un país.","nl":"Onderscheid aangesprokene, relatie en werkwoordsvorm. Ken niet één vorm aan een heel land toe."},"task":{"es":"Comparen tres diálogos con hablantes y contexto identificados. Adapten un saludo a una situación nueva y justifiquen el tratamiento.","nl":"Vergelijk drie dialogen met bekende sprekers en context. Pas een begroeting aan een nieuwe situatie aan en onderbouw de aanspreekvorm."},"nl":{"es":"Jij, u y jullie ayudan, pero no cubren toda la variación de tratamientos del español.","nl":"Jij, u en jullie helpen, maar dekken niet alle Spaanse aanspreekvormen en gebruiken."},"check":{"es":"Hablas directamente a tres personas con ustedes. ¿Necesita o necesitan?","nl":"Je spreekt drie mensen aan met ustedes. Necesita of necesitan?"},"answer":{"es":"Ustedes necesitan. El destinatario es plural y el verbo toma tercera persona plural.","nl":"Ustedes necesitan. Je spreekt meerdere mensen aan en gebruikt de derde persoon meervoud."},"prereq":["F21"],"exercises":[{"stem":"Profesora, ¿usted ___ una copia? (necesitar, presente)","answers":["necesita"],"why":{"es":"Usted se combina con tercera persona singular.","nl":"Usted krijgt de derde persoon enkelvoud."},"mode":"word","instruction":null,"id":"F22_1"},{"stem":"¿Ustedes ___ cerca del centro? (vivir, presente)","answers":["viven"],"why":{"es":"Ustedes requiere tercera persona plural.","nl":"Ustedes vraagt de derde persoon meervoud."},"mode":"word","instruction":null,"id":"F22_2"},{"stem":"¿Vos ___ aquí? (estudiar, modelo de voseo con hablás)","answers":["estudiás"],"why":{"es":"En este modelo, vos estudiás lleva el acento al final.","nl":"In dit model heeft vos estudiás de klemtoon achteraan."},"mode":"word","instruction":null,"id":"F22_3"}]},{"id":"F23","block":4,"p":[{"es":"No suele ir delante del verbo: no trabajo hoy. Si hay un pronombre de complemento, no va delante del conjunto: no lo sé. Para negar dos acciones: no leo ni escribo durante el viaje.","nl":"No staat meestal vóór het werkwoord: no trabajo hoy. Een objectvoornaamwoord komt ertussen: no lo sé. Twee handelingen ontkennen: no leo ni escribo durante el viaje."},{"es":"Nunca, nadie y nada pueden ir delante: nunca desayuno tarde, nadie viene, nada cambia. Si van después, usamos normalmente no: no desayuno nunca, no viene nadie, no cambia nada. No ... nunca no se convierte en afirmación.","nl":"Nunca, nadie en nada kunnen vooraan: nunca desayuno tarde, nadie viene, nada cambia. Achter het werkwoord komt meestal no erbij: no desayuno nunca, no viene nadie, no cambia nada. No ... nunca wordt geen bevestiging."}],"ex":[{"es":"Hoy no voy al centro porque no tengo clase. Tampoco trabajo por la tarde.","nl":"Vandaag ga ik niet naar het centrum, want ik heb geen les. Ik werk 's middags ook niet."},{"es":"Llamamos a la sala, pero no responde nadie. No hay ninguna actividad programada.","nl":"We bellen de ruimte, maar niemand antwoordt. Er is geen activiteit gepland."}],"refs":["nl_negacion","pcic","ninguno"],"related":["F18","F63","F70"],"title":{"es":"Negación y posición de no","nl":"Ontkenning en de plaats van no"},"goal":{"es":"Negar hechos y expresar ausencia.","nl":"Feiten ontkennen en afwezigheid uitdrukken."},"error":{"es":"Ante «nadie no viene», ensaya las dos posiciones básicas: nadie viene / no viene nadie.","nl":"Oefen bij «nadie no viene» de twee basisvolgordes: nadie viene / no viene nadie."},"tip":{"es":"No abre la negación si la palabra negativa todavía no ha aparecido antes del verbo.","nl":"No opent de ontkenning als het ontkennende woord nog niet vóór het werkwoord staat."},"task":{"es":"Dos personas comparan sus horarios para encontrar una actividad que ninguna haga todavía.","nl":"Laat twee personen hun roosters vergelijken om een activiteit te vinden die geen van beiden al doet."},"nl":{"es":"Geen boek no se traduce palabra por palabra: no tengo ningún libro. La negación española suele empezar antes.","nl":"Geen boek vertaal je niet woord voor woord: no tengo ningún libro. De Spaanse ontkenning begint vaak eerder."},"check":{"es":"Reordena «No viajo nunca en avión» empezando con nunca.","nl":"Begin «No viajo nunca en avión» met nunca."},"answer":{"es":"Nunca viajo en avión. Las dos frases niegan el hábito.","nl":"Nunca viajo en avión. Beide zinnen ontkennen de gewoonte."},"prereq":["F21"],"exercises":[{"stem":"Hoy ___ trabajo porque tengo el día libre. (negación)","answers":["no"],"why":{"es":"No se coloca delante del verbo conjugado.","nl":"No staat vóór het vervoegde werkwoord."},"mode":"word","instruction":null,"id":"F23_1"},{"stem":"No hay ___ en el aula; todas las personas están fuera. (nadie / nada)","answers":["nadie"],"why":{"es":"Nadie niega presencia de personas; no ... nadie es correcto.","nl":"Nadie ontkent de aanwezigheid van personen; no ... nadie is correct."},"mode":"word","instruction":null,"id":"F23_2"}]},{"id":"F24","block":4,"p":[{"es":"Usamos qué para información o tipo, quién/quiénes para personas, dónde para lugar, cuándo para tiempo, cómo para modo y por qué para causa. Cuánto concuerda ante un nombre: cuántas personas. Cu
