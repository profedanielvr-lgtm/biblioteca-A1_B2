goal: Dar instrucciones afirmativas y negativas coherentes con el tratamiento. || Positieve en negatieve instructies geven met een consistente aanspreekvorm.
p: En las órdenes negativas se usan formas del subjuntivo: no hables, no comas, no escribas. No basta añadir no al imperativo afirmativo: ven pasa a no vengas. || Negatieve opdrachten gebruiken subjuntivovormen: no hables, no comas, no escribas. Alleen no toevoegen is niet genoeg: ven wordt no vengas.
p: Los pronombres van delante en la negación: no lo abras. Con usted y ustedes, las formas afirmativas también coinciden con subjuntivo: abra, abran. En afirmativo: ábralo; en negativo: no lo abra. || Bij ontkenning staan voornaamwoorden ervoor: no lo abras. Bij usted en ustedes komen ook positieve vormen overeen met de subjuntivo: abra, abran. Positief: ábralo, negatief: no lo abra.
ex: Para jugar, abre la tarjeta azul, pero no abras la roja todavía. || Open voor het spel de blauwe kaart, maar de rode nog niet.
ex: Señora López, lea las instrucciones y no las tire. Las necesitamos después. || Mevrouw López, lees de instructies en gooi ze niet weg. We hebben ze later nodig.
nl: El neerlandés suele mantener la forma del verbo al negar una orden; el español cambia la forma y la posición del pronombre. || Het Nederlands behoudt de werkwoordsvorm vaker bij een ontkenning; het Spaans verandert ook de vorm en de plaats van het voornaamwoord.
error: Ante no abre dirigido a tú, contrasta abre/no abras y pregunta a quién se habla. || Vergelijk bij no abre gericht aan tú abre/no abras en vraag wie wordt aangesproken.
depth: Enseña juntos destinatario, polaridad y posición del pronombre. Son tres decisiones distintas; no presentes la tabla sin interlocutor. || Behandel ontvanger, positief/negatief en plaats van het voornaamwoord samen. Dat zijn drie afzonderlijke keuzes; geef geen tabel zonder gesprekspartner.
task: Diseñad instrucciones para abrir una caja con sobres: abre el azul, no abras el rojo, no lo muevas. Otra pareja ejecuta y señala instrucciones ambiguas. Reescribid después para usted. || Ontwerp instructies voor een doos met enveloppen. Een ander tweetal voert uit en wijst onduidelijke aanwijzingen aan. Herschrijf daarna voor usted.
q: No ___ (abrir, tú) esa puerta. :: abras :: La orden negativa de tú usa presente de subjuntivo. || De negatieve opdracht bij tú gebruikt presente de subjuntivo.
q: Señora, no ___ (tirar) las tarjetas. :: tire :: Usted requiere tercera persona: no tire. || Usted vraagt de derde persoon: no tire.
`);
add('B105','B1',13,'F27 F28',`
title: Presente de subjuntivo, formas y función || Presente de subjuntivo, vorm en functie
goal: Reconocer la forma sin reducir el subjuntivo a irrealidad. || De vorm herkennen zonder subjuntivo tot onwerkelijkheid te beperken.
p: En verbos regulares de ar usamos e, es, e, emos, éis, en; en er/ir usamos a, as, a, amos, áis, an. Formas frecuentes: sea, esté, vaya, tenga, pueda, haga, sepa, dé. || Bij regelmatige ar-werkwoorden gebruiken we e, es, e, emos, éis, en; bij er/ir a, as, a, amos, áis, an. Veelvoorkomend: sea, esté, vaya, tenga, pueda, haga, sepa, dé.
p: El modo se relaciona con la construcción y la intención. Me alegra que estés aquí puede hablar de un hecho real. La persona no afirma de nuevo el hecho, sino que expresa una reacción. || De wijs hangt samen met constructie en bedoeling. Me alegra que estés aquí kan over een echt feit gaan. De spreker stelt het feit niet opnieuw vast, maar reageert erop.
ex: Estás aquí y me alegra que estés aquí. Podemos empezar juntos. || Je bent hier en ik ben blij dat je hier bent. We kunnen samen beginnen.
ex: Quiero que el grupo tenga tiempo para revisar, así que terminamos antes. || Ik wil dat de groep tijd heeft om na te kijken, dus stoppen we eerder.
nl: El neerlandés suele usar una forma normal después de dat. La ausencia de un cambio visible no significa que el español tampoco lo marque. || Het Nederlands gebruikt na dat meestal een gewone vorm. Geen zichtbare verandering in het Nederlands betekent niet dat het Spaans niets markeert.
error: Rechaza la regla subjuntivo = falso con un ejemplo de emoción ante un hecho conocido. || Weerleg subjuntivo = onwaar met een emotie bij een bekend feit.
depth: Primero reconoce qué expresión organiza la segunda parte. Después elige modo y tiempo. Una lista de palabras disparadoras sin interpretación produce aciertos frágiles. || Herken eerst welke uitdrukking het tweede deel aanstuurt. Kies daarna wijs en tijd. Alleen signaalwoorden leren levert kwetsbare kennis op.
task: Reparte afirmaciones reales y reacciones: estás aquí, tenemos tiempo, la clase participa. Une cada dato con me alegra que y explica qué información se añade. || Verdeel echte vaststellingen en reacties. Verbind elk gegeven met me alegra que en leg uit welke informatie erbij komt.
q: Me alegra que ___ (estar, tú) aquí. :: estés :: La reacción emocional selecciona subjuntivo, aunque el hecho sea real. || De emotionele reactie vraagt subjuntivo, ook bij een echt feit.
q: Quiero que Ana ___ (tener) tiempo. :: tenga :: Querer que introduce lo deseado y requiere aquí subjuntivo. || Querer que introduceert het gewenste en vraagt hier subjuntivo.
`);
add('B106','B1',13,'B105 F38',`
title: Deseos, voluntad y cambio de sujeto || Wensen, wil en verandering van onderwerp
goal: Distinguir quiero hacer de quiero que hagas. || Quiero hacer van quiero que hagas onderscheiden.
p: Cuando quien desea realiza también la acción, usamos normalmente infinitivo: quiero participar. Si la acción deseada corresponde a otro sujeto, usamos que + subjuntivo: quiero que participes. || Als degene die iets wil ook de handeling uitvoert, gebruiken we meestal de infinitief: quiero participar. Bij een ander onderwerp: que + subjuntivo, quiero que participes.
p: Ojalá expresa un deseo y se combina con subjuntivo: ojalá venga. La presencia de que no es obligatoria con ojalá. No todas las frases con que expresan un deseo. || Ojalá drukt een wens uit en combineert met subjuntivo: ojalá venga. Que is daarbij niet verplicht. Niet elke zin met que drukt een wens uit.
ex: Quiero aprender más, pero también quiero que mi compañero participe. || Ik wil meer leren, maar ik wil ook dat mijn partner meedoet.
ex: Mañana jugamos la final. Ojalá haga buen tiempo. || Morgen spelen we de finale. Hopelijk wordt het mooi weer.
nl: Ik wil dat jij komt corresponde a quiero que vengas; observa el sujeto de cada acción. || Ik wil dat jij komt wordt quiero que vengas; bekijk het onderwerp van elke handeling.
error: En quiero que participar falta una forma personal; en quiero participo se conjuga donde hace falta infinitivo. || In quiero que participar ontbreekt een persoonsvorm; in quiero participo staat een vervoeging waar een infinitief nodig is.
depth: El cambio de sujeto orienta en esta construcción, pero no es una explicación general de todo el subjuntivo. Limita la regla a los verbos trabajados. || De verandering van onderwerp helpt bij deze constructie, maar verklaart niet alle subjuntivo. Beperk de regel tot de behandelde werkwoorden.
task: Cada alumno escribe un deseo propio y uno para un personaje ficticio que prepara un intercambio. La pareja identifica quién debe actuar y negocia un deseo común. || Iedereen schrijft een eigen wens en een wens voor een fictief uitwisselingspersonage. De partner bepaalt wie moet handelen en samen kiezen ze een gedeelde wens.
q: Quiero ___ (participar) yo también. :: participar :: El sujeto de querer y participar es el mismo. || Het onderwerp van querer en participar is hetzelfde.
q: Ojalá mañana ___ (hacer) sol. :: haga :: Ojalá introduce deseo con subjuntivo. || Ojalá introduceert een wens met subjuntivo.
`);
add('B107','B1',13,'B105 F37',`
title: Emociones y valoraciones con subjuntivo || Emoties en beoordelingen met subjuntivo
goal: Reaccionar ante una situación sin confundir hecho y valoración. || Op een situatie reageren en feit van beoordeling onderscheiden.
p: Me alegra que, me molesta que y es importante que suelen introducir subjuntivo. La segunda parte puede ser real: me molesta que hables durante la explicación. || Me alegra que, me molesta que en es importante que leiden doorgaans subjuntivo in. Het tweede deel kan echt zijn: me molesta que hables durante la explicación.
p: Para valorar una acción sin sujeto concreto se usa infinitivo: es importante escuchar. Con sujeto señalado: es importante que todos escuchen. Es evidente que presenta normalmente una afirmación y lleva indicativo. || Voor een beoordeling zonder concreet onderwerp gebruik je een infinitief: es importante escuchar. Met een genoemd onderwerp: es importante que todos escuchen. Es evidente que presenteert meestal een vaststelling met indicativo.
ex: Es importante que todos tengan una oportunidad. Hoy cambiamos los turnos. || Het is belangrijk dat iedereen een kans krijgt. Vandaag veranderen we de beurten.
ex: Es evidente que Ana participa; me alegra que participe tanto. || Het is duidelijk dat Ana meedoet; ik ben blij dat ze zo actief is.
nl: Het is belangrijk dat no muestra un modo especial en neerlandés; contrasta la función de importante y evidente. || Het is belangrijk dat toont in het Nederlands geen aparte wijs; vergelijk de functie van importante en evidente.
error: No generalices ser + adjetivo + que = subjuntivo. Contrasta valoración y afirmación de evidencia. || Maak van ser + bijvoeglijk naamwoord + que geen automatische subjuntivoregel. Vergelijk beoordeling en vaststelling.
depth: Pregunta qué hace el hablante con el dato: presentarlo como cierto o reaccionar ante él. Esa diferencia explica mejor el contraste que real/irreal. || Vraag wat de spreker met het gegeven doet: als waar presenteren of erop reageren. Dat verklaart het verschil beter dan echt/onecht.
task: Un grupo recibe datos de participación y otro propuestas de mejora. Redactad dos valoraciones y una afirmación comprobable para una reunión de clase. || Eén groep krijgt deelnamegegevens, een andere verbetervoorstellen. Schrijf twee beoordelingen en één controleerbare vaststelling voor een klassengesprek.
q: Es importante que todos ___ (escuchar). :: escuchen :: Se valora la acción de un sujeto plural. || De handeling van een meervoudig onderwerp wordt beoordeeld.
q: Es evidente que Ana ___ (participar) cada día. :: participa :: Evidente presenta aquí un hecho como afirmado. || Evidente presenteert hier een vaststaand feit.
`);
add('B108','B1',13,'B105 B103',`
title: Consejos, influencia y recomendaciones || Advies, invloed en aanbevelingen
goal: Elegir entre recomendar hacer y recomendar que alguien haga. || Kiezen tussen recomendar hacer en recomendar que iemand iets doet.
p: Recomiendo leer ofrece una recomendación general. Te recomiendo que leas se dirige a una persona y usa subjuntivo. Pedir que y aconsejar que funcionan de modo parecido en estos usos. || Recomiendo leer geeft een algemene aanbeveling. Te recomiendo que leas richt zich tot iemand en gebruikt subjuntivo. Pedir que en aconsejar que werken in deze toepassingen vergelijkbaar.
p: Decir puede informar o pedir una acción: dice que viene, dice que vengamos. El modo cambia con la intención, no solo con el verbo principal. || Decir kan informeren of tot een handeling aanzetten: dice que viene, dice que vengamos. De wijs verandert met de bedoeling, niet alleen met het hoofdwerkwoord.
ex: Te aconsejo que ensayes con un compañero antes de grabar el audio. || Ik raad je aan met een partner te oefenen voordat je de audio opneemt.
ex: La profesora dice que abramos el libro. Nos está dando una instrucción. || De docent zegt dat we het boek moeten openen. Ze geeft een instructie.
nl: Hij zegt dat puede introducir información o una orden. Aclara la intención antes de elegir la forma española. || Hij zegt dat kan een mededeling weergeven of een opdracht. Maak die bedoeling expliciet voordat je de Spaanse vorm kiest.
error: Si aparece dice que abrimos como orden pretendida, pregunta si informa de una rutina o quiere que actuemos. || Vraag bij dice que abrimos als bedoelde opdracht of iemand een gewoonte beschrijft of wil dat we handelen.
depth: No todas las recomendaciones necesitan una frase subordinada. El infinitivo permite instrucciones generales; que + subjuntivo identifica a quien debe actuar. || Niet elke aanbeveling heeft een bijzin nodig. De infinitief geeft algemene instructies, que + subjuntivo noemt degene die moet handelen.
task: Reparte perfiles ficticios: nervios al hablar, problemas de planificación, lectura lenta. Las parejas proponen dos consejos específicos y eligen cuál probar primero. || Verdeel fictieve profielen: spreekangst, planningsproblemen, langzaam lezen. Tweetallen geven twee concrete adviezen en kiezen wat eerst te proberen.
q: Te recomiendo que ___ (leer, tú) el ejemplo. :: leas :: Una recomendación dirigida a tú usa aquí subjuntivo. || Een aanbeveling aan tú gebruikt hier subjuntivo.
q: Nos pide que ___ (abrir, nosotros) el libro. :: abramos :: Pedir que expresa influencia sobre nuestra acción. || Pedir que stuurt onze handeling aan.
`);
add('B109','B1',13,'B105 F66',`
title: Opinión, duda y grado de compromiso || Mening, twijfel en stelligheid
goal: Distinguir afirmar una opinión de no asumir una afirmación. || Een mening bevestigen van een bewering niet onderschrijven onderscheiden.
p: Creo que viene presenta una opinión como afirmación. No creo que venga no asume ese contenido y suele llevar subjuntivo. Dudo que venga también expresa falta de seguridad. || Creo que viene presenteert een mening als bewering. No creo que venga onderschrijft die inhoud niet en krijgt meestal subjuntivo. Dudo que venga geeft ook onzekerheid.
p: Quizá y tal vez permiten indicativo o subjuntivo según el enfoque. A lo mejor se combina normalmente con indicativo. No conviertas cada expresión de duda en una regla idéntica. || Quizá en tal vez kunnen indicativo of subjuntivo krijgen afhankelijk van het perspectief. A lo mejor combineert normaal met indicativo. Maak niet van elke twijfeluitdrukking dezelfde regel.
ex: Creo que la propuesta funciona, pero no creo que todos la entiendan todavía. || Ik denk dat het voorstel werkt, maar niet dat iedereen het al begrijpt.
ex: A lo mejor Ana está en la biblioteca. Podemos buscarla allí. || Misschien is Ana in de bibliotheek. We kunnen daar kijken.
nl: Ik denk niet dat no exige un cambio visible de modo en neerlandés; el español presenta la información de otra manera. || Ik denk niet dat vraagt in het Nederlands geen zichtbare wijsverandering. De Spaanse zin organiseert het perspectief anders.
error: Evita explicar no creo que como una negación dentro de la segunda acción. Se niega creer, no necesariamente venir. || Leg no creo que niet uit als ontkenning van de tweede handeling. Geloven wordt ontkend, niet noodzakelijk komen.
depth: Una misma situación puede presentarse con distinto compromiso. Pide justificar la intención y acepta variantes posibles cuando el contexto no fija una única lectura. || Dezelfde situatie kan met verschillende stelligheid worden gepresenteerd. Laat de bedoeling toelichten en accepteer mogelijke varianten als de context geen unieke lezing vastlegt.
task: Reparte tres noticias ficticias con fuentes de distinta fiabilidad. Decidid qué creéis, qué dudáis y qué necesitáis comprobar, citando una pista de cada tarjeta. || Verdeel drie fictieve berichten met verschillend betrouwbare bronnen. Bespreek wat je gelooft, betwijfelt en wilt controleren met een aanwijzing per kaart.
q: No creo que Ana ___ (tener) la información. Usa la lectura habitual de duda. :: tenga :: Se niega la creencia; el contenido no se afirma. || Het geloof wordt ontkend; de inhoud wordt niet bevestigd.
q: A lo mejor Ana ___ (estar) en clase. :: está :: A lo mejor se construye normalmente con indicativo. || A lo mejor krijgt normaal indicativo.
`);
add('B110','B1',14,'B105 F68',`
title: Cuando y otras referencias futuras || Cuando en toekomstige situaties
goal: Contrastar un hábito con una situación pendiente. || Een gewoonte met een nog komende situatie vergelijken.
p: Cuando llego, saludo describe un hábito y usa indicativo. Cuando llegue, te llamaré presenta una llegada pendiente y usa subjuntivo. La forma del futuro no va después de cuando en este patrón. || Cuando llego, saludo beschrijft een gewoonte met indicativo. Cuando llegue, te llamaré presenteert een nog komende aankomst met subjuntivo. In dit patroon staat na cuando geen futuro.
p: Hasta que y en cuanto también pueden introducir una situación pendiente: espera hasta que termine. Elige primero el punto de vista temporal y después la forma verbal. || Ook hasta que en en cuanto kunnen een nog komende situatie inleiden: espera hasta que termine. Kies eerst het tijdsperspectief en daarna de werkwoordsvorm.
ex: Cuando llego al instituto, miro el horario. Lo hago cada mañana. || Als ik op school kom, bekijk ik het rooster. Dat doe ik elke ochtend.
ex: Cuando llegue el grupo mañana, empezaremos la visita. || Wanneer de groep morgen aankomt, beginnen we de rondleiding.
nl: Als ik aankom puede ser hábito o futuro. El contexto español obliga a distinguir esas lecturas. || Als ik aankom kan gewoonte of toekomst zijn. De Spaanse context vraagt onderscheid tussen die lezingen.
error: Ante cuando llegará, localiza si es una subordinada temporal o una pregunta indirecta: no sé cuándo llegará sí es posible. || Controleer bij cuando llegará of het een tijdsbijzin of indirecte vraag is: no sé cuándo llegará kan wel.
depth: Cuando sin tilde conecta momentos; cuándo con tilde pregunta por un momento. La diferencia afecta también a la selección del modo. || Cuando zonder accent verbindt momenten, cuándo met accent vraagt naar een moment. Dat verschil raakt ook de keuze van de wijs.
task: Planificad la llegada de una clase visitante. A conoce las horas, B las acciones pendientes. Escribid tres instrucciones con cuando, en cuanto y hasta que. || Plan de aankomst van een bezoekende klas. A kent de tijden, B de nog uit te voeren acties. Schrijf drie instructies met cuando, en cuanto en hasta que.
q: Cuando ___ (llegar, tú) mañana, avísame. :: llegues :: La llegada está pendiente y se usa subjuntivo. || De aankomst moet nog plaatsvinden en krijgt subjuntivo.
q: Cuando ___ (llegar, yo) cada día, saludo. :: llego :: Es un hábito, presentado con indicativo. || Dit is een gewoonte, met indicativo.
`);
add('B111','B1',14,'B106 F65',`
title: Finalidad con para y para que || Doel met para en para que
goal: Explicar para qué se hace algo y quién realiza cada acción. || Het doel en de uitvoerder van elke handeling aangeven.
p: Para + infinitivo expresa finalidad: estudio para aprender. Para que + subjuntivo permite introducir un sujeto propio: explico despacio para que me entiendas. || Para + infinitief geeft een doel: estudio para aprender. Para que + subjuntivo kan een eigen onderwerp introduceren: explico despacio para que me entiendas.
p: Una finalidad es lo que se busca conseguir, no la causa que ya explica una acción. Contrasta porque tengo un examen con para aprobar el examen. || Een doel is wat je wilt bereiken, niet de oorzaak die een handeling verklaart. Vergelijk porque tengo un examen en para aprobar el examen.
ex: Preparo un ejemplo para explicar la regla con claridad. || Ik bereid een voorbeeld voor om de regel duidelijk uit te leggen.
ex: Escribo más grande para que todos puedan leer desde el fondo. || Ik schrijf groter zodat iedereen het achterin kan lezen.
nl: Om te y zodat ayudan a comparar, pero comprueba siempre el sujeto y la intención. || Om te en zodat helpen bij het vergelijken, maar controleer altijd onderwerp en bedoeling.
error: No aceptes para que pueden en esta finalidad; pide señalar qué resultado se busca, todavía no afirmado. || Accepteer para que pueden niet bij dit doel; laat het gewenste, nog niet bevestigde resultaat aanwijzen.
depth: El resultado deseado puede no cumplirse. La finalidad explica la intención del agente, no garantiza el efecto. || Het gewenste resultaat hoeft niet uit te komen. Een doel verklaart de bedoeling van de handelende persoon, niet het gegarandeerde effect.
task: Diseñad tres apoyos para una tarea oral, cada uno con un destinatario y una finalidad. Otra pareja decide si el apoyo realmente facilita ese resultado. || Ontwerp drie hulpmiddelen bij een spreektaak, elk met ontvanger en doel. Een ander tweetal beoordeelt of de hulp het resultaat mogelijk maakt.
q: Hablo despacio para que me ___ (entender, tú). :: entiendas :: Para que introduce una finalidad con subjuntivo. || Para que introduceert een doel met subjuntivo.
q: Estudio para ___ (aprender) más. :: aprender :: Para va seguido de infinitivo cuando no se introduce una oración personal. || Na para volgt een infinitief als geen bijzin met persoonsvorm wordt ingevoerd.
`);
add('B112','B1',14,'F67 B105',`
title: Relativas, referente conocido o buscado || Betrekkelijke zinnen bij bekende of gezochte personen
goal: Distinguir describir un referente de poner una condición para encontrarlo. || Een referent beschrijven van een zoekvoorwaarde onderscheiden.
p: Busco al alumno que habla portugués puede identificar a un alumno concreto. Busco un alumno que hable portugués presenta una condición sin identificar necesariamente a una persona. || Busco al alumno que habla portugués kan een concrete leerling identificeren. Busco un alumno que hable portugués geeft een voorwaarde zonder noodzakelijk iemand te identificeren.
p: Indicativo y subjuntivo cambian cómo se presenta el referente. No equivale siempre a existe/no existe: puede existir alguien adecuado, aunque el hablante no lo haya identificado. || Indicativo en subjuntivo veranderen de presentatie van de referent. Dat is niet altijd bestaat/bestaat niet: iemand geschikts kan bestaan zonder dat de spreker die heeft geïdentificeerd.
ex: Necesitamos un aula que tenga proyector. Todavía no sabemos cuál. || We hebben een lokaal met projector nodig. We weten nog niet welk.
ex: Usamos el aula que tiene proyector, la del segundo piso. || We gebruiken het lokaal met projector, dat op de tweede verdieping.
nl: Die een projector heeft mantiene la forma en neerlandés. Pregunta si el hablante ya identifica el aula. || Die een projector heeft behoudt in het Nederlands dezelfde vorm. Vraag of de spreker het lokaal al identificeert.
error: No asocies automáticamente un con subjuntivo y el con indicativo. Son pistas, no sustituyen al contexto. || Koppel un niet automatisch aan subjuntivo en el aan indicativo. Het zijn aanwijzingen, geen vervanging voor de context.
depth: El modo aporta perspectiva sobre la referencia. Dos respuestas pueden ser gramaticales y construir situaciones distintas. || De wijs geeft perspectief op de verwijzing. Twee antwoorden kunnen correct zijn en toch verschillende situaties voorstellen.
task: A recibe requisitos para un aula, B un catálogo de tres aulas. Primero formula la búsqueda; después identifica cuál cumple los requisitos y explica la elección. || A krijgt lokaaleisen, B een catalogus met drie lokalen. Formuleer eerst de zoekvraag, wijs daarna het passende lokaal aan en licht toe.
q: Buscamos un aula que ___ (tener) proyector; no hemos elegido ninguna. :: tenga :: El referente se presenta como buscado, no identificado. || De referent wordt als gezocht en niet geïdentificeerd voorgesteld.
q: Usamos el aula que ___ (tener) proyector, la número 4. :: tiene :: Se identifica un aula concreta y se afirma su propiedad. || Een concreet lokaal wordt geïdentificeerd en de eigenschap bevestigd.
`);
add('B113','B1',15,'F36 F51',`
title: Se impersonal y pasiva refleja || Onpersoonlijk se en passief met se
goal: Describir acciones sin destacar quién las realiza. || Handelingen beschrijven zonder de uitvoerder centraal te zetten.
p: En se vive bien aquí no se nombra sujeto y el verbo va en singular. En se venden libros, libros es sujeto paciente y el verbo concuerda en plural. || In se vive bien aquí wordt geen onderwerp genoemd en staat het werkwoord in enkelvoud. In se venden libros is libros het ondergaande onderwerp en volgt meervoud.
p: Con personas introducidas por a suele aparecer la construcción impersonal: se atiende a los visitantes. No la conviertas en se atienden a los visitantes en el modelo normativo trabajado. || Bij personen met a verschijnt doorgaans een onpersoonlijke constructie: se atiende a los visitantes. Maak daar in het behandelde normatieve model niet se atienden a los visitantes van.
ex: En esta biblioteca se prestan libros y se trabaja en silencio. || In deze bibliotheek worden boeken uitgeleend en werkt men stil.
ex: En secretaría se atiende a las familias por la mañana. || Bij de administratie worden gezinnen in de ochtend geholpen.
nl: Men y worden pueden ayudar a traducir, pero no determinan por sí solos si hay un sujeto español. || Men en worden helpen bij vertalen, maar bepalen niet zelfstandig of er een Spaans onderwerp is.
error: Ante se vende libros, haz probar el singular y el plural del nombre. En se atiende a personas, conserva el análisis impersonal. || Laat bij se vende libros het naamwoord in enkelvoud en meervoud proberen. Behoud bij se atiende a personas de onpersoonlijke analyse.
depth: La etiqueta se no basta para explicar la frase. Comprueba transitividad, presencia de a personal y concordancia. || Alleen het woord se verklaart de zin niet. Controleer transitiviteit, persoonlijke a en vormovereenkomst.
task: Redactad carteles para biblioteca, secretaría y patio. Otra pareja decide qué servicio se ofrece y revisa un plural y una construcción con a personal. || Schrijf bordjes voor bibliotheek, administratie en plein. Een ander tweetal bepaalt de dienst en controleert een meervoud en een constructie met persoonlijke a.
q: En la biblioteca se ___ (prestar) libros. :: prestan :: Libros es sujeto plural de la pasiva refleja. || Libros is het meervoudige onderwerp van het passief met se.
q: Aquí se ___ (atender) a los visitantes. :: atiende :: La construcción impersonal lleva tercera persona singular. || De onpersoonlijke constructie krijgt derde persoon enkelvoud.
`,['pcicB','se']);
add('B114','B1',12,'F43 F59',`
title: Seguir, dejar de y llevar + gerundio || Doorgaan, stoppen en duur met gerundio
goal: Expresar continuidad, interrupción y duración. || Voortgang, stoppen en duur uitdrukken.
p: Seguir + gerundio indica continuidad: sigo estudiando. Dejar de + infinitivo marca interrupción: dejé de jugar. Llevar + duración + gerundio expresa tiempo acumulado: llevo dos años estudiando. || Seguir + gerundio geeft voortgang: sigo estudiando. Dejar de + infinitief geeft stoppen: dejé de jugar. Llevar + duur + gerundio geeft opgebouwde tijd: llevo dos años estudiando.
p: La forma no personal depende de la construcción. No intercambies seguir estudiar y dejar estudiando. En llevo dos años aquí puede omitirse el gerundio porque se expresa permanencia. || De onpersoonlijke vorm hangt van de constructie af. Verwissel seguir estudiar en dejar estudiando niet. In llevo dos años aquí kan de gerundio ontbreken omdat verblijf wordt uitgedrukt.
ex: Llevo tres meses practicando y sigo cometiendo algunos errores. || Ik oefen al drie maanden en maak nog steeds enkele fouten.
ex: Dejé de usar la aplicación, pero sigo escuchando el pódcast. || Ik ben gestopt met de app, maar luister nog steeds naar de podcast.
nl: Al drie maanden y nog steeds no se traducen palabra por palabra; mira el patrón verbal completo. || Al drie maanden en nog steeds vertaal je niet woord voor woord; bekijk het hele werkwoordpatroon.
error: Pide distinguir el final de una acción y la continuación de otra antes de corregir la terminación. || Laat eerst stoppen en doorgaan onderscheiden voordat je de uitgang verbetert.
depth: Son maneras de enfocar fases de una acción. Una línea de tiempo puede mostrar qué continúa, qué termina y cuánto dura. || Dit zijn manieren om fasen van een handeling te bekijken. Een tijdlijn toont wat doorgaat, stopt en hoe lang het duurt.
task: Entrevistad a un personaje ficticio sobre tres hábitos: uno continúa, uno terminó y uno empezó hace seis meses. Preparad su balance de aprendizaje. || Interview een fictief personage over drie gewoontes: één gaat door, één stopte en één begon zes maanden geleden. Maak een leerbalans.
q: Sigo ___ (estudiar) español. :: estudiando :: Seguir selecciona aquí gerundio. || Seguir krijgt hier een gerundio.
q: Dejé de ___ (jugar) el año pasado. :: jugar :: Dejar de selecciona infinitivo. || Na dejar de volgt een infinitief.
`,['pcicB','gerundio']);
add('B115','B1',15,'F09 F11',`
title: Lo neutro y sustantivación || Neutraal lo en zelfstandig gebruik
goal: Hablar de una cualidad o un aspecto sin nombrar un objeto. || Een eigenschap of aspect noemen zonder een voorwerp te benoemen.
p: Lo + adjetivo permite hablar de un aspecto: lo importante, lo difícil, lo mejor. No es el masculino de la: no acompaña a un sustantivo como libro. || Lo + bijvoeglijk naamwoord noemt een aspect: lo importante, lo difícil, lo mejor. Het is niet de mannelijke vorm van la en staat niet bij een naamwoord als libro.
p: El grande puede recuperar un nombre omitido: el libro grande. Lo grande expresa el aspecto o la cualidad. Lo de ayer recupera un asunto relacionado con ayer. || El grande kan een weggelaten naamwoord oproepen: el libro grande. Lo grande noemt het aspect of de eigenschap. Lo de ayer verwijst naar iets dat met gisteren samenhangt.
ex: Lo importante es que todos comprendan la tarea, no terminar primero. || Het belangrijkste is dat iedereen de opdracht begrijpt, niet als eerste klaar zijn.
ex: Entre los dos carteles prefiero el grande. Lo de ayer lo revisamos después. || Van de twee posters kies ik de grote. Dat van gisteren bekijken we later.
nl: Het moeilijke se acerca a lo difícil, pero het boek no es lo libro. || Het moeilijke lijkt op lo difícil, maar het boek is niet lo libro.
error: Ante lo libro, pregunta si se nombra un objeto o una cualidad. || Vraag bij lo libro of een voorwerp of een eigenschap wordt genoemd.
depth: Elipsis de un sustantivo y referencia neutra son operaciones diferentes. Recuperar mentalmente el nombre ayuda a distinguirlas. || Een naamwoord weglaten en neutraal verwijzen zijn verschillende bewerkingen. Het naamwoord aanvullen helpt ze onderscheiden.
task: Comparad dos carteles y elegid uno. Separad la referencia al objeto, el grande, de la valoración, lo mejor es la claridad. Justificad la decisión para un grupo concreto. || Vergelijk twee posters en kies er één. Onderscheid verwijzing naar het voorwerp en beoordeling van een aspect. Licht toe voor een concrete groep.
q: ___ importante es comprender la idea. :: Lo :: Lo introduce una cualidad presentada como aspecto. || Lo introduceert een eigenschap als aspect.
q: Entre los dos libros, prefiero ___ grande. :: el :: El recupera el sustantivo masculino libro. || El verwijst naar het mannelijke naamwoord libro.
`,['pcicB','el']);
add('B116','B1',14,'F24 F66',`
title: Preguntas indirectas || Indirecte vragen
goal: Integrar una pregunta dentro de otra frase. || Een vraag in een andere zin opnemen.
p: No sé dónde vive y dime qué necesitas incluyen una pregunta sin signos de interrogación. Los interrogativos conservan la tilde: qué, quién, cómo, cuándo, dónde. || No sé dónde vive en dime qué necesitas bevatten een vraag zonder vraagtekens. Vraagwoorden houden hun accent: qué, quién, cómo, cuándo, dónde.
p: Para una pregunta de sí/no usamos si: no sé si viene. Ese si no lleva tilde y no expresa necesariamente una condición. Distingue pregunta y condición por la función de la frase. || Voor een ja-neevraag gebruiken we si: no sé si viene. Si krijgt geen accent en is niet noodzakelijk een voorwaarde. Onderscheid vraag en voorwaarde op basis van de functie.
ex: ¿Dónde está el aula? No sé dónde está; voy a preguntar. || Waar is het lokaal? Ik weet niet waar het is; ik ga het vragen.
ex: Dime si tienes tiempo y explícame qué necesitas. || Zeg of je tijd hebt en leg uit wat je nodig hebt.
nl: Of y als pueden corresponder a si en contextos distintos. La función permite distinguirlos. || Of en als kunnen in verschillende contexten si worden. De functie maakt het onderscheid duidelijk.
error: No elimines la tilde porque desaparecen los signos. La palabra sigue teniendo valor interrogativo. || Haal het accent niet weg omdat de vraagtekens verdwijnen. Het woord blijft vragend.
depth: Una interrogativa indirecta puede contener futuro: no sé cuándo llegará. No apliques la regla de cuando temporal a cuándo interrogativo. || Een indirecte vraag kan futuro bevatten: no sé cuándo llegará. Pas de regel van tijdelijk cuando niet toe op vragend cuándo.
task: Un alumno tiene las dudas de un visitante y otro una agenda incompleta. Traslada las preguntas a secretaría con no sabe, quiere saber y pregunta si. || Eén leerling heeft vragen van een bezoeker, een ander een onvolledige agenda. Geef de vragen door aan de administratie met no sabe, quiere saber en pregunta si.
q: No sé ___ empieza la clase. Pregunta por la hora. :: cuándo :: Cuándo conserva el valor interrogativo y la tilde. || Cuándo houdt zijn vragende betekenis en accent.
q: No sé ___ Ana viene o no. :: si :: Si introduce una pregunta indirecta de sí/no. || Si introduceert een indirecte ja-neevraag.
`,['pcicB','que']);
add('B117','B1',14,'F66 B101',`
title: Estilo indirecto, introducir voces ajenas || Indirecte rede, andermans woorden weergeven
goal: Transmitir una afirmación, pregunta o instrucción de otra persona. || Een bewering, vraag of instructie van iemand anders doorgeven.
p: Dice que está cansada transmite una afirmación; pregunta si hay tiempo transmite una pregunta; pide que esperemos transmite una petición. La intención decide cómo se construye lo transmitido. || Dice que está cansada geeft een bewering door, pregunta si hay tiempo een vraag en pide que esperemos een verzoek. De bedoeling bepaalt de constructie.
p: Cuando el verbo introductor está en pasado, pueden cambiar los tiempos: dijo que estaba cansada. No hagas cambios automáticos si el contenido sigue vigente y el contexto permite mantener el presente. || Bij een inleidend werkwoord in het verleden kunnen tijden veranderen: dijo que estaba cansada. Verander niet automatisch als de inhoud nog geldt en de context een tegenwoordige tijd toelaat.
ex: Ana dice: «Estoy cansada». Su compañero explica que Ana está cansada. || Ana zegt: ik ben moe. Haar partner legt uit dat Ana moe is.
ex: Ayer Ana dijo que estaba cansada y pidió que la dejaran descansar. || Gisteren zei Ana dat ze moe was en vroeg haar te laten rusten.
nl: Dat y of orientan, pero también cambian persona y punto de vista: mi libro puede pasar a su libro. || Dat en of helpen, maar ook persoon en gezichtspunt veranderen: mi libro kan su libro worden.
error: Si se mantiene yo sin ser el mismo hablante, pregunta a quién pertenece la experiencia. || Vraag bij yo met een andere spreker wie de ervaring heeft.
depth: Informar no es repetir literalmente. Conserva el sentido y reconstruye quién habla, cuándo y a quién. || Rapporteren is niet letterlijk herhalen. Behoud de betekenis en reconstrueer wie spreekt, wanneer en tegen wie.
task: Cada alumno recibe un mensaje de una persona ficticia. Transmítelo a otra pareja, que reconstruye si era noticia, pregunta o petición y quién debe actuar. || Iedereen krijgt een bericht van een fictief persoon. Geef het door; een ander tweetal bepaalt of het nieuws, een vraag of een verzoek was en wie moet handelen.
q: Ana dice: «Estoy cansada». Ana dice que ___ cansada. :: está :: Cambia la persona de estoy a está. || De persoon verandert van estoy naar está.
q: Ana pregunta: «¿Hay tiempo?». Ana pregunta ___ hay tiempo. :: si :: Una pregunta de sí/no se introduce con si. || Een ja-neevraag wordt ingeleid met si.
`,['pcicB','modo']);
add('B118','B1',15,'F61 F66',`
title: Régimen verbal, queísmo y dequeísmo || Vaste voorzetsels, queísmo en dequeísmo
goal: Mantener la preposición que exige una construcción. || Het voorzetsel behouden dat bij een constructie hoort.
p: Depender de, confiar en y acordarse de incluyen una preposición: depende de ti, confío en ella. Si sigue una oración, la relación puede mantenerse: me acuerdo de que vino. || Depender de, confiar en en acordarse de bevatten een voorzetsel: depende de ti, confío en ella. Bij een volgende bijzin kan die relatie blijven: me acuerdo de que vino.
p: Pienso que viene no lleva de. Estoy seguro de que viene sí lo lleva. Añadir de donde no corresponde es dequeísmo; quitar una preposición exigida es queísmo. || Pienso que viene heeft geen de. Estoy seguro de que viene wel. Een onnodige de toevoegen heet dequeísmo; een vereist voorzetsel weglaten heet queísmo.
ex: Me acuerdo de que la clase empieza a las diez, pero pienso que hoy cambia el horario. || Ik herinner me dat de les om tien begint, maar denk dat het rooster vandaag verandert.
ex: Confío en que el grupo pueda resolverlo. La solución depende de todos. || Ik vertrouw erop dat de groep het kan oplossen. De oplossing hangt van iedereen af.
nl: Denk aan, vertrouwen op y afhankelijk van no tienen necesariamente la misma preposición española. Aprende construcciones completas. || Denk aan, vertrouwen op en afhankelijk van hebben niet noodzakelijk hetzelfde Spaanse voorzetsel. Leer complete constructies.
error: No uses eliminar de que como regla general. Prueba la construcción con eso: estoy seguro de eso. || Maak van de que schrappen geen algemene regel. Probeer de constructie met eso: estoy seguro de eso.
depth: La prueba con eso es una ayuda, no una receta para toda variación. Consulta la construcción concreta si admite más de un régimen. || De proef met eso helpt, maar verklaart niet alle variatie. Raadpleeg de concrete constructie als meerdere voorzetsels mogelijk zijn.
task: Revisad un correo ficticio con pienso de que, me acuerdo que y estoy seguro de que. Justificad qué se mantiene y qué se cambia usando una reformulación con eso. || Bekijk een fictieve mail met deze drie constructies. Leg met een herformulering met eso uit wat blijft en wat verandert.
q: Estoy seguro ___ que viene. :: de :: Seguro se construye con de en este uso. || Seguro krijgt in dit gebruik de.
q: Pienso ___ viene. :: que :: Pensar con este significado no exige de. || Pensar vraagt in deze betekenis geen de.
`,['pcicB','queismo','dequeismo']);
add('B201','B2',13,'B105 B103',`
title: Imperfecto de subjuntivo || Imperfecto de subjuntivo
goal: Situar deseos y condiciones desde una perspectiva pasada o hipotética. || Wensen en voorwaarden vanuit een verleden of hypothetisch perspectief plaatsen.
p: Se forma a partir de la tercera persona plural del indefinido sin ron: hablaron da hablara o hablase; tuvieron da tuviera o tuviese. Las formas en ra y se son equivalentes en muchos usos de subjuntivo. || Neem de derde persoon meervoud van de indefinido zonder ron: hablaron geeft hablara of hablase, tuvieron tuviera of tuviese. De vormen op ra en se zijn in veel subjuntivotoepassingen gelijkwaardig.
p: Puede referirse a una acción solicitada en el pasado o a una situación hipotética presente: quería que vinieras, si tuviera tiempo. Imperfecto no significa que siempre hable de ayer. || Het kan gaan om een eerder verzochte handeling of een huidige hypothese: quería que vinieras, si tuviera tiempo. Imperfecto betekent dus niet altijd gisteren.
ex: La profesora quería que todos explicaran su respuesta antes de corregir. || De docent wilde dat iedereen het antwoord uitlegde vóór de correctie.
ex: Si tuviera más tiempo hoy, prepararía otro ejemplo. || Als ik vandaag meer tijd had, zou ik nog een voorbeeld voorbereiden.
nl: Had en una hipótesis neerlandesa no siempre expresa pasado. Esta distinción ayuda a comprender tuviera. || Had in een Nederlandse hypothese is niet automatisch verleden tijd in betekenis. Hetzelfde onderscheid helpt bij tuviera.
error: Si se rechaza hablase como incorrecto, muestra la equivalencia en esta subordinada. No generalices esa equivalencia a cualquier uso histórico de ra. || Laat bij afwijzing van hablase de gelijkwaardigheid in deze bijzin zien. Generaliseer die niet naar elk historisch gebruik van ra.
depth: Separa modo, tiempo de referencia y distancia hipotética. Una etiqueta de conjugación no basta para explicar la intención. || Onderscheid wijs, referentietijd en hypothetische afstand. Een vervoegingsnaam verklaart de bedoeling niet volledig.
task: Reparte peticiones de ayer y deseos para una escuela imaginaria de hoy. Clasificad las frases según su referencia y explicad por qué ambas series pueden usar imperfecto de subjuntivo. || Verdeel verzoeken van gisteren en wensen voor een denkbeeldige school van vandaag. Sorteer op tijdsperspectief en verklaar dezelfde werkwoordsvorm.
q: Quería que Ana ___ (venir). :: viniera / viniese :: La petición se presenta desde un punto pasado; ambas formas son válidas. || Het verzoek wordt vanuit het verleden weergegeven; beide vormen zijn geldig.
q: Si ___ (tener, yo) tiempo hoy, iría. :: tuviera / tuviese :: La condición es hipotética en el presente. || De voorwaarde is hypothetisch in het heden.
`);
add('B202','B2',13,'B105 F46',`
title: Perfecto de subjuntivo || Perfecto de subjuntivo
goal: Valorar o poner en duda un hecho anterior conectado con el presente. || Een eerder feit met verband met het heden beoordelen of betwijfelen.
p: Haya, hayas, haya, hayamos, hayáis, hayan + participio combina subjuntivo y anterioridad: me alegra que hayas venido. El participio permanece invariable. || Haya, hayas, haya, hayamos, hayáis, hayan + deelwoord combineert subjuntivo en anterioriteit: me alegra que hayas venido. Het deelwoord blijft onveranderd.
p: Puede referirse a algo ya ocurrido o a algo que estará terminado antes de un momento futuro: cuando hayas terminado, avísame. La forma compuesta marca anterioridad, no solo pasado cronológico. || Het kan gaan om iets dat al gebeurd is of vóór een toekomstig moment afgerond zal zijn: cuando hayas terminado, avísame. De samengestelde vorm geeft anterioriteit, niet alleen verleden tijd.
ex: Me alegra que hayas enviado el trabajo. Ahora podemos comentarlo. || Ik ben blij dat je het werk hebt verstuurd. Nu kunnen we het bespreken.
ex: Cuando hayáis terminado la tarea, comparad las respuestas. || Vergelijk de antwoorden wanneer jullie de opdracht af hebben.
nl: Hebt gedaan no marca el subjuntivo neerlandés. Busca qué expresión selecciona el modo en español. || Hebt gedaan markeert geen Nederlandse subjuntivo. Zoek welke uitdrukking in het Spaans de wijs bepaalt.
error: No sustituyas haya por ha solo porque el hecho es real. La valoración sigue seleccionando el modo. || Vervang haya niet door ha alleen omdat het feit echt is. De beoordeling bepaalt nog steeds de wijs.
depth: Compara me alegra que vengas y me alegra que hayas venido: cambia la relación temporal, no la valoración. || Vergelijk me alegra que vengas en me alegra que hayas venido: de tijdsrelatie verandert, niet de beoordeling.
task: Una pareja recibe acciones terminadas y otra pendientes antes de una exposición. Redactad reacciones y condiciones de inicio distinguiendo ambas referencias. || Een tweetal krijgt afgeronde acties, een ander nog te voltooien acties voor een presentatie. Formuleer reacties en startvoorwaarden met beide perspectieven.
q: Me alegra que ___ (venir, tú). Usa perfecto de subjuntivo. :: hayas venido :: Haya cambia con tú y el participio no cambia. || Haya verandert bij tú en het deelwoord blijft gelijk.
q: Cuando ___ (terminar, nosotros), saldremos. Usa perfecto de subjuntivo. :: hayamos terminado :: Terminar precede a la salida futura. || Afronden gaat vooraf aan het toekomstige vertrek.
`);
add('B203','B2',13,'B201 B101',`
title: Pluscuamperfecto de subjuntivo || Pluscuamperfecto de subjuntivo
goal: Expresar anterioridad desde una perspectiva pasada o contraria a los hechos. || Anterioriteit vanuit een verleden of niet-werkelijk perspectief uitdrukken.
p: Hubiera o hubiese + participio presenta una acción anterior desde el subjuntivo. Se conjuga haber: hubiéramos llegado. El participio no concuerda con el sujeto. || Hubiera of hubiese + deelwoord geeft een eerdere handeling vanuit de subjuntivo. Haber wordt vervoegd: hubiéramos llegado. Het deelwoord past zich niet aan het onderwerp aan.
p: Puede valorar un hecho anterior: me alegró que hubieras venido. También expresa una condición pasada que no se cumplió: si hubiera estudiado, habría aprobado. || Het kan een eerder feit beoordelen: me alegró que hubieras venido. Ook een niet vervulde voorwaarde in het verleden is mogelijk: si hubiera estudiado, habría aprobado.
ex: Me sorprendió que hubieran terminado tan pronto; el trabajo era difícil. || Het verbaasde me dat ze zo vroeg klaar waren; het werk was moeilijk.
ex: Si hubiéramos salido antes, habríamos llegado a tiempo. || Als we eerder waren vertrokken, waren we op tijd aangekomen.
nl: Una forma neerlandesa con had puede expresar ambas perspectivas. Distingue una reacción ante un hecho de una condición no cumplida. || Een Nederlandse vorm met had kan beide perspectieven weergeven. Onderzoek of het om een feitelijke reactie of een niet vervulde voorwaarde gaat.
error: No enseñes hubiera como señal automática de algo falso: en me alegró que hubieras venido la visita puede ser real. || Leer hubiera niet als automatisch onwaar: bij me alegró que hubieras venido kan het bezoek echt zijn.
depth: El mismo tiempo aparece en construcciones con distinto compromiso con los hechos. El marco de la oración determina la lectura. || Dezelfde tijd verschijnt bij verschillende relaties tot de feiten. Het kader van de zin bepaalt de lezing.
task: Reparte dos relatos breves: una sorpresa real y un arrepentimiento. Señalad lo anterior y lo que se considera ocurrido o no ocurrido. Cambiad después la perspectiva. || Verdeel twee korte verhalen: echte verrassing en spijt. Wijs aan wat eerder is en wat wel of niet plaatsvond. Verander daarna het perspectief.
q: Si ___ (salir, nosotros) antes, habríamos llegado. :: hubiéramos salido / hubiésemos salido :: La condición se presenta como no cumplida en el pasado. || De voorwaarde wordt als onvervuld in het verleden gepresenteerd.
q: Me alegró que ___ (venir, tú). Usa pluscuamperfecto de subjuntivo. :: hubieras venido / hubieses venido :: La visita precede a la reacción pasada. || Het bezoek gaat aan de vroegere reactie vooraf.
`);
add('B204','B2',14,'B201 B103 F69',`
title: Condiciones posibles e hipotéticas || Mogelijke en hypothetische voorwaarden
goal: Elegir el grado de distancia con que se presenta una condición. || De afstand kiezen waarmee een voorwaarde wordt voorgesteld.
p: Si tengo tiempo, iré presenta una condición abierta. Si tuviera tiempo, iría la presenta con mayor distancia hipotética. El imperfecto de subjuntivo puede referirse al presente o al futuro. || Si tengo tiempo, iré geeft een open voorwaarde. Si tuviera tiempo, iría presenteert meer hypothetische afstand. De imperfecto de subjuntivo kan over heden of toekomst gaan.
p: En este patrón no usamos si tendría. La segunda parte puede expresar una consecuencia o recomendación: si yo fuera tú, hablaría con ella. No todas las hipótesis significan imposibilidad absoluta. || In dit patroon gebruiken we niet si tendría. Het tweede deel kan gevolg of advies geven: si yo fuera tú, hablaría con ella. Niet elke hypothese is absoluut onmogelijk.
ex: Si mañana tengo tiempo, iré al club. Todavía no sé mi horario. || Als ik morgen tijd heb, ga ik naar de club. Ik weet mijn rooster nog niet.
ex: Si tuviera una semana libre, viajaría, pero ahora tengo clases. || Als ik een week vrij had, zou ik reizen, maar nu heb ik les.
nl: Als ik tijd zou hebben puede llevar al error si tendría. Compara los patrones completos, no verbos sueltos. || Als ik tijd zou hebben kan tot si tendría verleiden. Vergelijk de volledige patronen, niet losse werkwoorden.
error: Corrige si tendría sin negar que condicional sea posible en otras construcciones con si, como preguntas indirectas. || Verbeter si tendría zonder condicional in andere si-constructies, zoals indirecte vragen, uit te sluiten.
depth: La diferencia es una elección de perspectiva. No asignes probabilidades numéricas fijas a cada patrón. || Het verschil is een perspectiefkeuze. Ken geen vaste waarschijnlijkheidspercentages toe aan elk patroon.
task: Diseñad una mejora escolar con presupuesto real y otra con presupuesto imaginario. Presentad las condiciones de cada plan y explicad el cambio de perspectiva. || Ontwerp een schoolverbetering met echt budget en één met denkbeeldig budget. Presenteer de voorwaarden en verklaar het perspectiefverschil.
q: Si ___ (tener, yo) más tiempo, leería más. :: tuviera / tuviese :: La condición hipotética usa imperfecto de subjuntivo. || De hypothetische voorwaarde gebruikt imperfecto de subjuntivo.
q: Si tengo tiempo mañana, ___ (ir, yo). Usa futuro simple. :: iré :: La consecuencia futura se combina con si + presente. || Het toekomstige gevolg combineert met si + tegenwoordige tijd.
`);
add('B205','B2',12,'B102 B103 F45',`
title: Futuro perfecto y condicional compuesto || Futuro perfecto en condicional compuesto
goal: Expresar una acción terminada antes de un punto futuro o una consecuencia pasada hipotética. || Voltooiing vóór een toekomstig punt of een hypothetisch verleden gevolg uitdrukken.
p: Habré + participio sitúa una acción como terminada antes de un momento futuro: a las cinco habré acabado. También puede expresar conjetura sobre un pasado: habrá olvidado la cita. || Habré + deelwoord presenteert een handeling als voltooid vóór een toekomstig moment: a las cinco habré acabado. Ook een vermoeden over het verleden kan: habrá olvidado la cita.
p: Habría + participio puede presentar una consecuencia pasada hipotética: con más tiempo habría revisado el texto. No equivale a una acción futura todavía realizable. || Habría + deelwoord kan een hypothetisch verleden gevolg geven: con más tiempo habría revisado el texto. Het is niet hetzelfde als een toekomstige handeling die nog mogelijk is.
ex: Para el viernes habremos terminado el proyecto y podremos presentarlo. || Tegen vrijdag zullen we het project af hebben en kunnen presenteren.
ex: Habría revisado el texto, pero no recibí el archivo a tiempo. || Ik zou de tekst hebben nagekeken, maar ontving het bestand niet op tijd.
nl: Zal hebben y zou hebben permiten comparar, pero hay que identificar el momento de referencia. || Zal hebben en zou hebben bieden vergelijkingen, maar maak het referentiepunt expliciet.
error: Pide localizar qué momento sirve de límite y si la acción ocurrió realmente. || Laat het grensmoment aanwijzen en bepalen of de handeling werkelijk plaatsvond.
depth: Los tiempos compuestos relacionan momentos; no se aprenden bien como una lista de traducciones. Dibuja dos puntos y la acción anterior. || Samengestelde tijden verbinden momenten; een vertaalrijtje is onvoldoende. Teken twee punten en de eerdere handeling.
task: Preparad un cronograma para el viernes y un balance de un proyecto que terminó ayer. Separad lo que estará terminado de lo que habría sido posible. || Maak een planning voor vrijdag en een terugblik op een project van gisteren. Onderscheid wat klaar zal zijn en wat mogelijk was geweest.
q: Para el viernes ___ (terminar, nosotros). Usa futuro perfecto. :: habremos terminado :: La finalización precede al límite futuro. || De voltooiing gaat aan het toekomstige grenspunt vooraf.
q: Con más tiempo ___ (revisar, yo) el texto. Usa condicional compuesto. :: habría revisado :: Se expresa una posibilidad pasada no realizada en este contexto. || Dit drukt hier een niet gerealiseerde mogelijkheid in het verleden uit.
`);
add('B206','B2',13,'B201 B202 B203',`
title: Concordancia temporal del subjuntivo || Tijdsverband bij de subjuntivo
goal: Relacionar el tiempo de la subordinada con el punto de vista de la principal. || De tijd van de bijzin aan het perspectief van de hoofdzin verbinden.
p: Quiero que vengas parte del presente; quería que vinieras parte de una perspectiva pasada. Para anterioridad: me alegra que hayas venido, me alegró que hubieras venido. || Quiero que vengas vertrekt vanuit het heden, quería que vinieras vanuit het verleden. Voor anterioriteit: me alegra que hayas venido, me alegró que hubieras venido.
p: No es una sustitución mecánica de terminaciones. La vigencia actual y el contexto pueden permitir otros enfoques. Antes de cambiar una forma, fija quién evalúa y desde cuándo. || Het is geen mechanische vervanging van uitgangen. Actuele geldigheid en context kunnen andere perspectieven toelaten. Bepaal eerst wie beoordeelt en vanuit welk moment.
ex: Hoy quiero que vengas mañana. Ayer quería que vinieras hoy. || Vandaag wil ik dat je morgen komt. Gisteren wilde ik dat je vandaag kwam.
ex: Me alegró que hubieras participado antes de cambiar de grupo. || Ik was blij dat je had meegedaan voordat je van groep wisselde.
nl: El neerlandés puede marcar de otra manera las relaciones temporales. Usa fechas y un momento de habla para explicar la elección española. || Nederlands laat tijdsrelaties soms minder zichtbaar. Gebruik data en een spreekmoment om de Spaanse keuze te verklaren.
error: No corrijas solo por una tabla; comprueba si el alumno mantiene o cambia el punto de vista. || Verbeter niet uitsluitend volgens een tabel; controleer of de leerling het perspectief behoudt of verandert.
depth: Distingue anterioridad y simultaneidad respecto al punto de referencia, no solo pasado y presente respecto al día de hoy. || Onderscheid eerder en gelijktijdig ten opzichte van het referentiepunt, niet alleen verleden en heden ten opzichte van vandaag.
task: Reparte el mismo mensaje contado hoy y contado una semana después. Ajustad tiempos y referencias, y justificad qué cambia y qué puede mantenerse. || Verdeel hetzelfde bericht verteld vandaag en een week later. Pas tijden en verwijzingen aan en verantwoord wat verandert of kan blijven.
q: Ayer quería que tú ___ (venir) ese mismo día. :: vinieras / vinieses :: El deseo se presenta desde el pasado. || De wens wordt vanuit het verleden gepresenteerd.
q: Me alegra que ya ___ (terminar, tú). Usa perfecto de subjuntivo. :: hayas terminado :: La acción anterior se valora desde el presente. || De eerdere handeling wordt vanuit het heden beoordeeld.
`);
add('B207','B2',14,'B117 B201',`
title: Estilo indirecto, tiempo, lugar y órdenes || Indirecte rede, tijd, plaats en opdrachten
goal: Reconstruir una voz ajena sin alterar su sentido. || Andermans woorden weergeven zonder de betekenis te veranderen.
p: Al cambiar de hablante pueden cambiar yo, aquí, hoy y mañana. No son cambios obligatorios si el lugar o el día siguen siendo los mismos. El contexto decide qué referencia es adecuada. || Bij een andere spreker kunnen yo, aquí, hoy en mañana veranderen. Dat hoeft niet als plaats of dag gelijk blijven. De context bepaalt de verwijzing.
p: Una instrucción se transmite con verbos de influencia: dijo que esperáramos. Una afirmación usa otro patrón: dijo que esperaba. Distingue intención y relación temporal antes de transformar. || Een opdracht wordt met beïnvloedingswerkwoorden doorgegeven: dijo que esperáramos. Een bewering gebruikt een ander patroon: dijo que esperaba. Onderscheid bedoeling en tijdsverband vóór het omzetten.
ex: El lunes Ana dijo: «Mañana estaré aquí». El miércoles cuento que dijo que estaría allí el martes. || Maandag zei Ana: morgen ben ik hier. Woensdag vertel ik dat ze zei dat ze dinsdag daar zou zijn.
ex: «Esperad fuera», pidió la profesora. Nos pidió que esperáramos fuera. || Wacht buiten, vroeg de docent. Ze vroeg ons buiten te wachten.
nl: Hier y daar cambian según el lugar desde donde se cuenta algo, no automáticamente por usar estilo indirecto. || Hier en daar veranderen met de vertelplaats, niet automatisch met indirecte rede.
error: Evita tablas que cambian hoy por aquel día sin fijar el momento del nuevo relato. || Vermijd tabellen die hoy automatisch in aquel día veranderen zonder het nieuwe vertelmoment vast te leggen.
depth: Una buena transformación conserva quién se compromete con cada afirmación. No atribuyas al narrador lo que solo dijo otra persona. || Een goede omzetting behoudt wie verantwoordelijk is voor elke bewering. Schrijf de verteller niet toe wat alleen iemand anders zei.
task: Reparte mensajes fechados el lunes y un encargo de resumirlos el jueves desde otra ciudad. La pareja comprueba fechas, lugar, personas e intención de cada mensaje. || Verdeel berichten van maandag en laat ze donderdag vanuit een andere stad samenvatten. Controleer data, plaats, personen en bedoeling.
q: «Esperad fuera». Nos pidió que ___ fuera. :: esperáramos / esperásemos :: La petición pasada selecciona imperfecto de subjuntivo. || Het vroegere verzoek vraagt imperfecto de subjuntivo.
q: El lunes dijo «mañana». Al contarlo el jueves, ese día es el ___. :: martes :: La referencia depende de la fecha original. || De verwijzing hangt af van de oorspronkelijke datum.
`);
add('B208','B2',15,'B113 F45',`
title: Pasiva con ser y resultado con estar || Passief met ser en resultaat met estar
goal: Cambiar el foco entre proceso, agente y resultado. || Het accent tussen proces, uitvoerder en resultaat verplaatsen.
p: Ser + participio presenta una acción desde el elemento que la recibe: las puertas fueron cerradas por el conserje. El participio concuerda con el sujeto paciente. || Ser + deelwoord presenteert een handeling vanuit wat die ondergaat: las puertas fueron cerradas por el conserje. Het deelwoord past zich aan het ondergaande onderwerp aan.
p: Estar + participio suele describir el resultado: las puertas están cerradas. No informa necesariamente de quién las cerró ni de cuándo. Contrasta también la activa: el conserje cerró las puertas. || Estar + deelwoord beschrijft vaak het resultaat: las puertas están cerradas. Dat zegt niet noodzakelijk wie ze sloot of wanneer. Vergelijk ook de actieve zin: el conserje cerró las puertas.
ex: El edificio fue inaugurado en mayo por la alcaldesa. || Het gebouw werd in mei geopend door de burgemeester.
ex: El edificio está cerrado hoy porque se realizan obras. || Het gebouw is vandaag dicht omdat er werkzaamheden zijn.
nl: Worden y zijn ayudan como primera comparación, pero comprueba si importa el proceso o el estado. || Worden/zijn helpt als eerste vergelijking, maar controleer of proces of toestand centraal staat.
error: Ante las puertas fueron cerrado, localiza el sujeto paciente y ajusta el participio. || Laat bij las puertas fueron cerrado het ondergaande onderwerp aanwijzen en het deelwoord aanpassen.
depth: La pasiva es una elección discursiva. No transformes toda frase activa: pregunta qué información debe ser el punto de partida. || Passief is een keuze in de tekst. Zet niet elke actieve zin om; vraag welke informatie het vertrekpunt moet zijn.
task: Escribid dos titulares sobre la misma reforma, uno centrado en el ayuntamiento y otro en la escuela. Añadid una frase sobre el estado actual del edificio. || Schrijf twee koppen over dezelfde verbouwing, één met de gemeente centraal en één met de school. Voeg de huidige toestand toe.
q: Las puertas fueron ___ (cerrar) por el conserje. :: cerradas :: El participio concuerda con puertas. || Het deelwoord past bij puertas.
q: La puerta ___ cerrada ahora; no podemos entrar. Usa estar en presente. :: está :: Se describe el estado actual. || De huidige toestand wordt beschreven.
`,['pcicB','ser','estar']);
add('B209','B2',15,'F36 B113 F53',`
title: Los valores de se || De verschillende functies van se
goal: Analizar se por la construcción completa. || Se vanuit de volledige constructie analyseren.
p: Se puede ser reflexivo, recíproco, parte de un verbo pronominal, sustituto de le/les o marca de una construcción impersonal o pasiva. No tiene una sola traducción. || Se kan wederkerend, wederkerig, onderdeel van een werkwoord, vervanger van le/les of kenmerk van een onpersoonlijke/passieve constructie zijn. Er is niet één vertaling.
p: Compara se lava, se escriben, se arrepiente, se lo da, se vive bien y se venden libros. La función se reconoce por participantes, significado y concordancia, no por la palabra aislada. || Vergelijk se lava, se escriben, se arrepiente, se lo da, se vive bien en se venden libros. De functie blijkt uit deelnemers, betekenis en vormovereenkomst, niet uit het losse woord.
ex: Ana se lava y después se pone la chaqueta. Luis se la presta. || Ana wast zich en trekt daarna de jas aan. Luis leent die aan haar.
ex: Se venden libros en la entrada y se atiende a los visitantes en recepción. || Bij de ingang worden boeken verkocht en bij de receptie worden bezoekers geholpen.
nl: Zich es solo una traducción posible. En se lo doy, se no es reflexivo. || Zich is slechts één mogelijke vertaling. In se lo doy is se geen wederkerend voornaamwoord.
error: Si todo se recibe la etiqueta reflexivo, pide sustituirlo por a sí mismo y examinar si se conserva el sentido. || Laat bij het label wederkerend voor elk se a sí mismo proberen en controleer de betekenis.
depth: Se me cayó el vaso presenta un acontecimiento con una persona afectada; no demuestra por sí solo ausencia de responsabilidad. Evita interpretaciones culturales automáticas. || Se me cayó el vaso presenteert een gebeurtenis met een betrokken persoon; het bewijst niet automatisch afwezigheid van verantwoordelijkheid. Vermijd automatische culturele interpretaties.
task: Entregad seis frases, una por construcción. Los grupos justifican dos análisis y cambian un elemento para mostrar qué análisis deja de funcionar. || Geef zes zinnen, één per constructie. Groepen onderbouwen twee analyses en veranderen één element om te laten zien wanneer de analyse niet meer werkt.
q: Le doy el libro a Ana. ___ lo doy. :: Se :: Le cambia a se delante de lo. || Le verandert in se vóór lo.
q: Aquí se ___ (vender) libros. :: venden :: La pasiva refleja concuerda con libros. || Het passief met se past zich aan libros aan.
`,['pcicB','se','pronombres']);
add('B210','B2',15,'F51 F52',`
title: Leísmo y variación de los pronombres || Leísmo en variatie van voornaamwoorden
goal: Distinguir función, norma y variedad sin corregir toda diferencia. || Functie, norm en taalvariatie onderscheiden zonder elk verschil te verbeteren.
p: El modelo básico distingue lo/la como OD y le como OI. Existe leísmo: uso de le para ciertos objetos directos. La norma admite el referido a una persona masculina singular en usos como a Juan le vi. || Het basismodel onderscheidt lo/la als OD en le als OI. Bij leísmo wordt le voor bepaalde directe objecten gebruikt. De norm aanvaardt het bij een mannelijke persoon in enkelvoud, zoals a Juan le vi.
p: Esa admisión no permite sustituir cualquier lo o la por le. Distingue persona, género, número y variedad, y consulta los usos de cortesía cuando sean relevantes. || Die toelating betekent niet dat elk lo of la door le kan worden vervangen. Onderscheid persoon, geslacht, getal en variëteit, en raadpleeg beleefdheidsgebruik waar relevant.
ex: A Juan lo vi ayer. En algunas variedades también oirás: a Juan le vi ayer. || Ik zag Juan gisteren. In sommige variëteiten hoor je zowel lo vi als le vi.
ex: El libro lo compré ayer y le di una copia a Ana. || Het boek kocht ik gisteren en ik gaf Ana een exemplaar.
nl: Hem no indica si el español usa objeto directo o indirecto. Analiza el verbo y la construcción completa. || Hem vertelt niet of het Spaans OD of OI gebruikt. Analyseer het werkwoord en de hele constructie.
error: No marques a Juan le vi como error automático ni extiendas ese uso a un objeto inanimado. || Markeer a Juan le vi niet automatisch als fout en breid dat gebruik niet uit naar een levenloos voorwerp.
depth: Ofrece un modelo de producción consistente y desarrolla comprensión de variantes. La corrección debe separar norma, registro y objetivo de aprendizaje. || Bied een consistent productiemodel en ontwikkel begrip van varianten. Onderscheid bij feedback norm, register en leerdoel.
task: Comparad dos diálogos con lo vi/le vi y un caso de OI. Redactad feedback que explique la función sin descalificar una variedad legítima. || Vergelijk twee dialogen met lo vi/le vi en een OI-geval. Schrijf feedback die de functie uitlegt zonder een geldige variëteit af te wijzen.
q: El libro ___ compré ayer. Usa el pronombre de OD del modelo básico. :: lo :: El libro es OD masculino singular. || El libro is mannelijk enkelvoudig OD.
q: A Ana ___ di un libro. Usa OI. :: le :: Ana es destinataria de la entrega. || Ana is de ontvanger bij het geven.
`,['pcicB','pronombres']);
add('B211','B2',14,'B105 B201',`
title: Concesión con aunque || Toegeving met aunque
goal: Reconocer un obstáculo que no impide la conclusión. || Een belemmering erkennen die de conclusie niet tegenhoudt.
p: Aunque presenta una dificultad que no bloquea lo que sigue: aunque llueve, salimos. El indicativo puede afirmar el dato. El subjuntivo puede presentarlo como hipotético o como información que no se discute. || Aunque geeft een belemmering die het vervolg niet blokkeert: aunque llueve, salimos. Indicativo kan het gegeven bevestigen. Subjuntivo kan het hypothetisch of als niet ter discussie staand presenteren.
p: Aunque llueva, saldremos puede significar que la lluvia no cambiará el plan. El subjuntivo no prueba que no llueva. Contexto y conocimiento compartido importan. || Aunque llueva, saldremos kan betekenen dat regen het plan niet verandert. De subjuntivo bewijst niet dat het niet regent. Context en gedeelde kennis tellen mee.
ex: Aunque está lloviendo, vamos a jugar dentro y mantener la actividad. || Hoewel het regent, gaan we binnen spelen en houden we de activiteit.
ex: Aunque llueva mañana, mantendremos la excursión; tenemos un plan cubierto. || Ook als het morgen regent, gaat het uitje door; we hebben een overdekt plan.
nl: Hoewel y ook al ayudan a comparar, pero no dan una regla fija para elegir el modo. || Hoewel en ook al helpen het verschil bespreken, maar leveren geen vaste één-op-éénregel voor de wijs.
error: No reduzcas indicativo a real y subjuntivo a falso. Pregunta si el hablante afirma el obstáculo o lo deja fuera de discusión. || Beperk indicativo niet tot echt en subjuntivo tot onwaar. Vraag of de spreker de belemmering bevestigt of buiten discussie plaatst.
depth: La concesión organiza una expectativa: normalmente la dificultad podría impedir algo, pero aquí no lo hace. Haz explícita esa expectativa. || Een toegeving organiseert een verwachting: normaal zou de moeilijkheid iets kunnen verhinderen, maar hier niet. Maak die verwachting expliciet.
task: Cada grupo propone una excursión y recibe una objeción. Mantiene o modifica el plan con aunque y explica si la objeción es conocida o hipotética. || Elke groep stelt een uitje voor en krijgt een bezwaar. Behoud of wijzig het plan met aunque en verklaar of het bezwaar bekend of hypothetisch is.
q: Aunque ___ (llover) mañana, saldremos. Presenta la lluvia como hipótesis. :: llueva :: El obstáculo hipotético no cambia el plan. || De hypothetische belemmering verandert het plan niet.
q: Aunque ahora ___ (llover), salimos. Afirma el dato con presente de indicativo. :: llueve :: El indicativo presenta la lluvia como afirmación. || Indicativo bevestigt de regen als gegeven.
`);
add('B212','B2',14,'B204 B111',`
title: Condiciones con siempre que y a menos que || Voorwaarden met siempre que en a menos que
goal: Expresar requisitos y excepciones a un plan. || Vereisten en uitzonderingen op een plan uitdrukken.
p: Siempre que con valor condicional equivale a con la condición de que y suele llevar subjuntivo: puedes venir siempre que avises. A menos que introduce una excepción: iremos a menos que llueva. || Siempre que met voorwaardelijke betekenis betekent op voorwaarde dat en krijgt doorgaans subjuntivo: puedes venir siempre que avises. A menos que introduceert een uitzondering: iremos a menos que llueva.
p: Siempre que también puede ser temporal y habitual: siempre que viene, saluda. No elijas el modo mirando únicamente el conector; identifica la relación. || Siempre que kan ook tijd en gewoonte aangeven: siempre que viene, saluda. Kies de wijs niet alleen op basis van het verbindingswoord; bepaal het verband.
ex: Podéis usar el aula siempre que la dejéis ordenada. || Jullie mogen het lokaal gebruiken als jullie het netjes achterlaten.
ex: Haremos la actividad fuera a menos que llueva. || We doen de activiteit buiten tenzij het regent.
nl: Mits y tenzij ayudan a distinguir condiciones y excepciones. Altijd wanneer tiene otra función. || Mits en tenzij helpen voorwaarden en uitzonderingen onderscheiden. Altijd wanneer heeft een andere functie.
error: Si todo siempre que recibe subjuntivo, contrasta condición y repetición real. || Vergelijk voorwaarde en echte herhaling als elke siempre que subjuntivo krijgt.
depth: Prueba una paráfrasis: con la condición de que o cada vez que. Si cambia el sentido, no son equivalentes. || Probeer een parafrase: op voorwaarde dat of elke keer dat. Verandert de betekenis, dan zijn ze niet gelijkwaardig.
task: Negociad el uso de una sala escolar. Un grupo propone permisos y otro requisitos; redactad dos condiciones y una excepción que ambos acepten. || Onderhandel over een schoolruimte. Eén groep stelt toestemmingen voor, een ander voorwaarden. Schrijf twee voorwaarden en één gezamenlijke uitzondering.
q: Puedes venir siempre que ___ (avisar, tú). Expresa condición. :: avises :: Siempre que condicional selecciona aquí subjuntivo. || Voorwaardelijk siempre que vraagt hier subjuntivo.
q: Iremos a menos que ___ (llover). :: llueva :: A menos que introduce la excepción con subjuntivo. || A menos que introduceert de uitzondering met subjuntivo.
`);
add('B213','B2',14,'F65 B211',`
title: Causa, consecuencia y organización argumentativa || Oorzaak, gevolg en argumentatie
goal: Elegir conectores por la relación que construyen. || Verbindingswoorden kiezen op basis van het bedoelde verband.
p: Como al inicio puede introducir una causa: como llueve, entramos. Ya que y puesto que también justifican. Por tanto y por consiguiente introducen una conclusión o consecuencia. || Como aan het begin kan een oorzaak geven: como llueve, entramos. Ya que en puesto que geven ook een reden. Por tanto en por consiguiente leiden een conclusie of gevolg in.
p: Tan/tanto... que expresa grado y consecuencia: habló tan bajo que no lo oímos. No confundir tan con tanto: tan rápido, tanto ruido, tantas preguntas. || Tan/tanto... que verbindt graad en gevolg: habló tan bajo que no lo oímos. Onderscheid tan en tanto: tan rápido, tanto ruido, tantas preguntas.
ex: Como faltaban dos alumnos, cambiamos los grupos. Por tanto, hubo que repartir de nuevo las tarjetas. || Omdat twee leerlingen ontbraken, veranderden we de groepen. Daarom moesten de kaarten opnieuw worden verdeeld.
ex: Había tantas preguntas que dedicamos otra sesión al tema. || Er waren zoveel vragen dat we nog een les aan het onderwerp besteedden.

ex: Esta es la compañera con la que preparo el intercambio. || Dit is de collega met wie ik de uitwisseling voorbereid.
ex: Conocimos a una autora cuyos libros se leen en nuestra clase. || We ontmoetten een auteur wier boeken in onze klas worden gelezen.
nl: Met wie y wiens/wier ayudan, pero cuyo concuerda con el nombre siguiente y no con el poseedor. || Met wie en wiens/wier helpen, maar cuyo past zich aan het volgende naamwoord aan, niet aan de bezitter.
error: Ante cuya libros, pregunta qué palabra exige el plural. No expliques la forma por el sexo de la autora. || Vraag bij cuya libros welk woord het meervoud vereist. Verklaar de vorm niet vanuit het geslacht van de auteur.
depth: Compara el objetivo de precisión con el registro. Aprender una forma no obliga a usarla en toda conversación. || Vergelijk de gewenste precisie met het register. Een vorm kennen verplicht niet tot gebruik in elk gesprek.

q: La autora ___ libros leemos viene mañana. :: cuyos :: Cuyos concuerda con libros, masculino plural. || Cuyos past bij libros, mannelijk meervoud.
q: Es la persona ___ la que trabajo. Usa trabajar con. :: con :: La preposición pertenece a trabajar con. || Het voorzetsel hoort bij trabajar con.

p: Más de lo que compara con una expectativa o cantidad expresada por otra oración: cuesta más de lo que pensaba. Más que puede comparar dos elementos: cuesta más que el otro. || Más de lo que vergelijkt met een verwachting of hoeveelheid in een andere zin: cuesta más de lo que pensaba. Más que kan twee elementen vergelijken: cuesta más que el otro.
ex: Da instrucciones como si fuera el responsable, pero hoy solo participa como alumno. || Hij geeft instructies alsof hij verantwoordelijk is, maar doet vandaag alleen als leerling mee.

q: Duró más ___ lo que esperábamos. :: de :: La comparación con una oración usa más de lo que. || De vergelijking met een bijzin gebruikt más de lo que.
